// --- FUNGSI GLOBAL MODAL KONFIRMASI PROFESIONAL ---
function showConfirm(title, message, onConfirm, icon = '⚠️') {
    const modal = document.getElementById('global-confirm-modal');
    if (!modal) {
        if (confirm(message)) onConfirm();
        return;
    }
    
    document.getElementById('confirm-title').innerText = title || "Konfirmasi";
    document.getElementById('confirm-message').innerText = message || "";
    const iconEl = document.getElementById('confirm-icon');
    if (iconEl) iconEl.innerText = icon;
    
    const okBtn = document.getElementById('btn-confirm-ok');
    const cancelBtn = document.getElementById('btn-confirm-cancel');
    
    // Reset event listener
    const newOkBtn = okBtn.cloneNode(true);
    const newCancelBtn = cancelBtn.cloneNode(true);
    okBtn.parentNode.replaceChild(newOkBtn, okBtn);
    cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
    
    newOkBtn.onclick = () => {
        modal.classList.add('hidden');
        if (typeof onConfirm === 'function') onConfirm();
    };
    newCancelBtn.onclick = () => {
        modal.classList.add('hidden');
    };
    
    modal.classList.remove('hidden');
}

// [FUNGSI BARU] Validasi ID Duplikat
async function checkDuplicateAndWarn(contactId) {
    const btnSave = document.getElementById('btn-save-profile');
    const originalText = btnSave.innerHTML;
    
    // Aktifkan Loading Animation
    btnSave.innerHTML = `<div class="flex items-center justify-center gap-2"><div class="spinner-small animate-spin"></div><span>Mengecek ID...</span></div>`;
    btnSave.disabled = true;

    return new Promise((resolve) => {
        google.script.run
            .withSuccessHandler((res) => {
                // Kembalikan tombol ke kondisi semula
                btnSave.innerHTML = originalText;
                btnSave.disabled = false;

                if (res.status === "exists") {
                    showConfirm(
                        "ID Networking Terdeteksi",
                        "ID Networking '" + contactId + "' sudah terdaftar di database.\n\nApakah Anda ingin mengedit profil kontak ini?",
                        () => {
                            if (typeof openEditModalFromData === 'function') {
                                openEditModalFromData(res.data);
                            } else if (typeof openEditModal === 'function') {
                                currentContactId = res.data[1]; 
                                openEditModal();
                            }
                            resolve(true);
                        },
                        '⚠️'
                    );
                    // Jika user membatalkan konfirmasi modal
                    const cancelBtn = document.getElementById('btn-confirm-cancel');
                    if (cancelBtn) {
                        const origCancel = cancelBtn.onclick;
                        cancelBtn.onclick = () => {
                            if (origCancel) origCancel();
                            resolve(true); // User batal
                        };
                    }
                } else {
                    resolve(false); // ID Aman
                }
            })
            .withFailureHandler((err) => {
                btnSave.innerHTML = originalText;
                btnSave.disabled = false;
                showToast("❌ Error validasi ID!");
                resolve(true); // Stop simpan jika error
            })
            .checkContactExistsNative(SHEET_URL, contactId);
    });
}

// [FUNGSI PEMBANTU] Edit modal dari data array (untuk duplikat)
function openEditModalFromData(dataRow) {
    if (!dataRow || !dataRow[1]) return;
    // Pastikan dataRow tersedia di allData agar openEditModal() bisa menemukannya
    const existingIdx = allData.findIndex(r => String(r[1]).trim() === String(dataRow[1]).trim());
    if (existingIdx === -1) {
        allData.unshift(dataRow);
    } else {
        allData[existingIdx] = dataRow;
    }
    currentContactId = dataRow[1];
    openEditModal();
}

        // Fungsi pembungkus untuk menjalankan interval
        function startSyncTimers() {
            // Hentikan dulu jika ada sisa interval sebelumnya agar tidak dobel
            stopSyncTimers();

            // 2. Loop Sinkronisasi Cepat (15 Detik) - Sheet Networking
            syncChatInterval = setInterval(() => {

                fetchAIToken();
                fetchSilentDeviceCache();
            }, 60000);
        }

        // Fungsi untuk menghentikan interval
        function stopSyncTimers() {
            clearInterval(syncChatInterval);
            clearInterval(syncSettingInterval);
        }

        // Jalankan timer pertama kali
        startSyncTimers();

        // 4. OPTIMASI: Page Visibility API (Pengereman Kuota Google)

    function doLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        const btn = document.getElementById('login-btn');
        
        if(u === "" || p === "") { showToast("Username dan Password wajib diisi!"); return; }
        
        btn.innerText = "Memverifikasi..."; btn.disabled = true;
        
        google.script.run.withSuccessHandler(res => {
            if(res.success) {
                loggedInUser = u;
                isMasterAdmin = res.isMaster;
                isCS = res.isCS || false; 
                userAllowedAccounts = res.roles; 
                userMenuAccess = res.menuAccess || "";
                
                // --- SIMPAN SESI KE LOCALSTORAGE ---
                localStorage.setItem('omni_user', u);
                localStorage.setItem('omni_isMaster', res.isMaster);
                localStorage.setItem('omni_isCS', isCS); 
                localStorage.setItem('omni_roles', JSON.stringify(res.roles));
                localStorage.setItem('omni_menuAccess', userMenuAccess);
                
                document.getElementById('login-modal').classList.add('hidden');
                showToast("Login Berhasil!");
                applyFinanceAccessControl();
                applyTaskAccessControl();
                applyChatAccessControl();
                handleCSAutoRedirect();
                
                const btnSetting = document.getElementById('btn-setting-system');
                if(btnSetting) {
                    if(!isMasterAdmin) btnSetting.classList.add('hidden');
                    else btnSetting.classList.remove('hidden');
                }
                const btnSettingDesktop = document.getElementById('btn-setting-system-desktop');
                if(btnSettingDesktop) {
                    if(!isMasterAdmin) btnSettingDesktop.classList.add('hidden');
                    else btnSettingDesktop.classList.remove('hidden');
                }
                
                // Jalankan sistem utama karena sudah login
                fetchData();
                fetchAIToken();
                fetchSilentDeviceCache(); 
                setInterval(fetchData, 15000); 
                setInterval(fetchAIToken, 60000);
                
                // --- INISIALISASI PWA HISTORY STATE ---
                setTimeout(() => {
                    window.history.replaceState({ page: 'exit' }, "", window.location.pathname);
                    window.history.pushState({ page: 'dashboard' }, "", "#dashboard");
                }, 500);
            } else {
                showToast(res.msg);
                btn.innerText = "Login"; btn.disabled = false;
            }
        }).withFailureHandler(err => {
            showToast("Gagal terhubung ke server.");
            btn.innerText = "Login"; btn.disabled = false;
        }).verifyLoginNative(SHEET_URL, u, p);
    }

    // FUNGSI COPY WEBHOOK (Teroptimasi untuk OneSender)
    function copyWebhookUrl() {
        const input = document.getElementById('webhook-url-display');
        
        // 1. Ambil URL dasar dan pisahkan jika sebelumnya sudah ada parameter ?device=
        let baseUrl = input.value.split('?device=')[0]; 
        
        // 2. Tangkap nilai dari input form secara real-time
        const apiUrl = document.getElementById('dev-col-9') ? document.getElementById('dev-col-9').value.toLowerCase() : "";
        const noServer = document.getElementById('dev-col-6') ? document.getElementById('dev-col-6').value.replace(/\D/g, "") : "";
        
        // 3. Logika Injeksi: Jika memakai OneSender dan No Server terisi, tempelkan parameternya
        if (apiUrl.includes('oneapi') && noServer !== "") {
            baseUrl += '?device=' + noServer;
        }
        
        // 4. Update tampilan input di UI agar pengguna melihat URL utuh yang disalin
        input.value = baseUrl;
        
        // 5. Eksekusi salin ke Clipboard bawaan browser
        input.select();
        input.setSelectionRange(0, 99999);
        copyToClipboard(baseUrl, null, "✅ URL Webhook disalin ke Keyboard!");
    }

   // === FUNGSI BARU: MEMBUKA MODAL SETTING (GERIGI) ===
    function openSettingPanel() {
        if (!isMasterAdmin) {
            showToast("Akses ditolak! Fitur Control Panel hanya dapat dibuka oleh Master Admin.");
            return;
        }
        document.getElementById('config-modal').classList.remove('hidden');
        document.getElementById('config-loading').classList.remove('hidden');
        window.history.pushState({ page: 'config' }, "", "#config");
        
        document.getElementById('config-main').classList.add('hidden');
        document.getElementById('section-device-list').classList.add('hidden');
        document.getElementById('section-sys-settings').classList.remove('hidden');
        
        document.getElementById('config-modal-title').innerText = "⚙️ Pengaturan Sistem";
        
        // Sembunyikan tombol kontrol Device di Header saat menu Setting dibuka
        const controls = document.getElementById('header-device-controls');
        if(controls) { controls.classList.remove('flex'); controls.classList.add('hidden'); }

        google.script.run
            .withSuccessHandler(function(data) {
                if (!data || typeof data !== 'object') { showToast("Data Corrupt!"); closeConfigModal(); return; }
                
                // MENGISI DATA UI & AI
                const setVal = (id, val) => { if(document.getElementById(id)) document.getElementById(id).value = val; };
                
                setVal('ui-limit', data.ui.limitData);
                setVal('ai-max-tokens', data.ai.maxTokens);
                setVal('ai-temp', data.ai.temp);
                setVal('ai-limit-history', data.ai.limitHistory);
                setVal('ai-warmer', data.ai.warmer);
                setVal('ai-qty-warmer', data.ai.qtyWarmer);
                setVal('ai-model', data.ai.modelGemini);
                setVal('ai-token', data.ai.tokenGemini);
                
                // MENGISI DATA SEND ARRAY
                data.send.forEach((val, i) => { 
                    // Jika indeks 5 (Rasio Warmer) atau 7 (Rasio Tier2) yg datanya desimal
                    if (i === 5 || i === 7) {
                        let persen = parseFloat(val) || 0;
                        setVal(`send-${i}`, (persen * 100)); 
                    } else {
                        setVal(`send-${i}`, val); 
                    }
                });

                // --- TRIGGER PENGECEKAN TAMPILAN AWAL ---
                togglePesanStatis();

                // GENERATE & MENGISI DATA LABELS SECARA DINAMIS
                let lblHtml = '';
                data.labels.forEach((lbl, i) => {
                   lblHtml += `<div class="flex gap-2 items-center bg-[#f0f2f5] p-1.5 rounded-xl">
                     <span class="text-[10px] font-bold w-5 text-center text-gray-500">${i+1}</span>
                     <input id="lbl-nama-${i}" value="${lbl.nama}" class="w-1/3 bg-white px-2 py-1.5 rounded-lg text-[13px] border-none outline-none" placeholder="Nama Label">
                     <input id="lbl-ket-${i}" value="${lbl.ket}" class="flex-1 bg-white px-2 py-1.5 rounded-lg text-[13px] border-none outline-none" placeholder="Keterangan">
                   </div>`;
                });
                document.getElementById('labels-container').innerHTML = lblHtml;

        // Helper: Deteksi apakah format tanggal sudah kedaluwarsa

            if (!dateStr || dateStr.trim() === "" || dateStr === "-") return false; 
            
            const parts = dateStr.split('/');
            if (parts.length !== 3) return false;
            
            const monthMap = { 'Jan':0, 'Feb':1, 'Mar':2, 'Apr':3, 'Mei':4, 'Jun':5, 'Jul':6, 'Ags':7, 'Sep':8, 'Okt':9, 'Nov':10, 'Des':11, 'Aug':7, 'Dec':11 };
            
            const day = parseInt(parts[0], 10);
            const monthStr = parts[1].substring(0, 3);
            const month = monthMap[monthStr] !== undefined ? monthMap[monthStr] : -1;
            const year = parseInt(parts[2], 10) + 2000;
            
            if (month === -1) return false;
            
            const expDate = new Date(year, month, day);
            const today = new Date();

    // HELPER: Mengubah format "25/Jul/26" dari Sheet menjadi format Kalender "YYYY-MM-DD"
    function parseDateForInput(dateStr) {
        if (!dateStr || dateStr.trim() === "" || dateStr === "-") return "";
        const parts = dateStr.split('/');
        if (parts.length === 3) {
            const monthMap = { 'Jan':'01', 'Feb':'02', 'Mar':'03', 'Apr':'04', 'Mei':'05', 'Jun':'06', 'Jul':'07', 'Ags':'08', 'Sep':'09', 'Okt':'10', 'Nov':'11', 'Des':'12', 'Aug':'08', 'Dec':'12' };
            const day = parts[0].padStart(2, '0');
            const month = monthMap[parts[1].substring(0,3)] || '01';
            const year = "20" + parts[2].replace(/\D/g, '');
            return `${year}-${month}-${day}`;
        }
        return "";
    }

    // HELPER: Mengubah format Kalender "YYYY-MM-DD" menjadi "DD/MMM/YY" untuk disimpan ke Sheet
    function formatDateForSheet(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            const monthMap = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            const day = parseInt(parts[2], 10);
            const month = monthMap[parseInt(parts[1], 10) - 1];
            const year = parts[0].substring(2, 4);
            return `${day}/${month}/${year}`;
        }
        return dateStr;
    }

            const monthMap = { 'Jan':0, 'Feb':1, 'Mar':2, 'Apr':3, 'Mei':4, 'Jun':5, 'Jul':6, 'Ags':7, 'Sep':8, 'Okt':9, 'Nov':10, 'Des':11, 'Aug':7, 'Dec':11 };
            const day = parseInt(parts[0], 10);
            const month = monthMap[parts[1].substring(0, 3)] !== undefined ? monthMap[parts[1].substring(0, 3)] : -1;
            const year = parseInt(parts[2], 10) + 2000;
            if (month === -1) return false;
            const expDate = new Date(year, month, day);
            const today = new Date();
            today.setHours(0,0,0,0); expDate.setHours(0,0,0,0);
            return expDate < today;

// ===== UBAH FUNGSI fetchData() AGAR MENGIRIM ROLE KE SERVER =====
    // Tambahkan parameter isManual = false
function fetchData(isManual = false) {
    if (!SHEET_URL) return;
    if (!checkChatAccess()) {
        const contactList = document.getElementById('contact-list');
        if (contactList) contactList.innerHTML = '<div class="p-6 text-center text-gray-400 text-xs font-semibold">Menu Chat tidak diaktifkan untuk akun ini.</div>';
        const status = document.getElementById('sync-status');
        if (status) status.innerText = "";
        return;
    }
    if (searchTerm !== "") return; 
    
    // BLOK KODE BARU: Kunci proses agar tidak tabrakan
    isFetchingData = true;

    const status = document.getElementById('sync-status');
    if(status) status.innerText = "Sinkronisasi...";

    // Munculkan loading tengah jika tombol diklik manual
    if(isManual) showGlobalLoading("Sinkronisasi Obrolan", "Menarik data chat terbaru dari server...");
    
    google.script.run
    .withSuccessHandler(function(data) {
        isFetchingData = false; // Buka Kunci
        if(isManual) hideGlobalLoading(); // Sembunyikan loading

        if (!data || !Array.isArray(data)) {
            if(status) status.innerText = "Gagal memuat data (Data tidak valid).";
            document.getElementById('contact-list').innerHTML = '<div class="p-8 text-center text-red-400 text-xs italic">Koneksi API / Data Master bermasalah.</div>';
            return;
        }

        allData = data.filter(row => {
            const id = String(row[1] || "").trim();
            if (id === "" || id === 'Unique ID') return false;
            
            if (!isMasterAdmin) {
                if (typeof isCS !== 'undefined' && isCS) {
                    const csDeviceNum = userAllowedAccounts[0].substring(3);
                    const noServerRow = String(row[4] || "").trim();
                    if (noServerRow !== csDeviceNum) return false;
                } else {
                    const akunChat = String(row[0] || "").trim();
                    if (!userAllowedAccounts.includes(akunChat)) return false;
                }
            }
            return true;
        });

        updateDeviceFilter(); updateLabelFilter(); renderSidebar();
        if (currentContactId) refreshChat();
        if(status) status.innerText = "Terakhir: " + new Date().toLocaleTimeString();

        // Silent fetch ticketDataCache jika belum ada agar count task & filter Task Active langsung siap
        if ((typeof ticketDataCache === 'undefined' || !ticketDataCache || ticketDataCache.length <= 1) && !window.isFetchingTicketDataSilent) {
            window.isFetchingTicketDataSilent = true;
            google.script.run
                .withSuccessHandler(function(res) {
                    window.isFetchingTicketDataSilent = false;
                    if (res && res.status === "success") {
                        ticketDataCache = res.ticket || [];
                        areaDataCache = res.area || [];
                        renderSidebar();
                        if (typeof updateCustomerTaskBadge === 'function') updateCustomerTaskBadge();
                    }
                })
                .withFailureHandler(function() {
                    window.isFetchingTicketDataSilent = false;
                })
                .getAreaTicketDataNative(SHEET_URL, (userAllowedAccounts || []).join(','));
        }
    })
    .withFailureHandler(function(error) {
        isFetchingData = false; // Buka Kunci
        if(isManual) hideGlobalLoading(); // Sembunyikan loading
        
        if(status) status.innerText = "Gagal Sinkronisasi: Timeout/Error";
        document.getElementById('contact-list').innerHTML = '<div class="p-8 text-center text-red-400 text-xs italic">Gagal terhubung ke Server Master.</div>';
    })
    .getSheetData(SHEET_URL, (userAllowedAccounts || []).join(','));
}

    // ===== FUNGSI SERVER SIDE SEARCH DENGAN ANIMASI LOADING =====
    function handleServerSearch(e) {
        if (e.key === 'Enter') {
            const kw = document.getElementById('search-input').value.trim();
            if (kw.length < 3) {
                showToast("Ketik minimal 3 huruf untuk mencari di Database.");
                return;
            }
            
            const syncStatus = document.getElementById('sync-status');
            const searchSpinner = document.getElementById('search-spinner');
            
            // Tampilkan animasi loading
            if (searchSpinner) searchSpinner.classList.remove('hidden');
            if (syncStatus) syncStatus.innerText = "Mencari di seluruh Database 2000+ data...";
            
            google.script.run
            .withSuccessHandler(function(data) {
                // Matikan animasi loading setelah sukses
                if (searchSpinner) searchSpinner.classList.add('hidden');
                
                if(data && data.length > 1) { 
                    const newRows = data.filter(row => {
                        const id = String(row[1] || "").trim();
                        return id !== "" && id !== 'Unique ID';
                    });
                    
                    newRows.forEach(newRow => {
                        const existingIndex = allData.findIndex(r => r[1] === newRow[1]);
                        if (existingIndex > -1) {
                            allData[existingIndex] = newRow; 
                        } else {
                            allData.push(newRow); 
                        }
                    });
                    
                    updateDeviceFilter(); updateLabelFilter(); renderSidebar();
                    if (syncStatus) syncStatus.innerText = `Ditemukan ${newRows.length} kontak lama!`;
                    showToast(`Berhasil menarik ${newRows.length} data dari Database.`);
                } else {
                    if (syncStatus) syncStatus.innerText = "Kontak tidak ditemukan di Database.";
                    showToast("Pencarian tidak ditemukan.");
                }
            })
            .withFailureHandler(function(e) {
                // Matikan animasi loading jika gagal
                if (searchSpinner) searchSpinner.classList.add('hidden');
                if (syncStatus) syncStatus.innerText = "Gagal mencari di server.";
                showToast("❌ Server Eror saat mencari.");
            })
            .searchContactNative(SHEET_URL, kw);
        }
    }

    // --- HELPER UNTUK ESCAPE ATRIBUT HTML ---
    function escapeHtmlAttr(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

                textArea.style.outline = "none";
                textArea.style.boxShadow = "none";
                textArea.style.background = "transparent";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                if (successful) {
                    showSuccessFeedback();
                } else {
                    showToast("❌ Gagal menyalin teks");
                }
            } catch (err) {
                console.error("Fallback copy error:", err);
                showToast("❌ Gagal menyalin teks");
            }
        };

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                showSuccessFeedback();
            }).catch(err => {
                console.warn("Clipboard API failed, trying fallback:", err);
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fetchAIToken() {
        if (!SHEET_URL) return;
        google.script.run
            .withSuccessHandler(function(tokenStr) {
                const display = document.getElementById('ai-token-display');
                const badge = document.getElementById('notif-badge');
                const notifList = document.getElementById('notif-list');

                if(tokenStr) {
                    // Memecah data berdasarkan tanda "~"
                    const parts = tokenStr.split('~');
                    
                    // Elemen [0] adalah Token Utama
                    display.innerText = parts[0].trim() || "Info Token Kosong";

                    // Elemen [1] dst adalah Notifikasi Eror
                    const notifs = parts.slice(1);
                    if (notifs.length > 0) {
                        badge.innerText = notifs.length;
                        badge.classList.remove('hidden');

                        // Bangun daftar list notifikasi
                        notifList.innerHTML = '';
                        notifs.forEach(notif => {
                            const cleanNotif = notif.trim();
                            if(cleanNotif === "") return;
                            
                            // Amankan teks dari kutip dan entitas HTML agar tidak merusak atribut HTML saat dicopy
                            const safeText = escapeHtmlAttr(cleanNotif);
                            
                            notifList.innerHTML += `
                                <div class="bg-white p-2.5 rounded-lg border border-gray-200 shadow-sm relative group hover:border-red-300 transition-colors">
                                    <p class="text-[10px] text-gray-700 whitespace-pre-wrap pr-6 line-clamp-3 group-hover:line-clamp-none transition-all">${escapeHtmlAttr(cleanNotif)}</p>
                                    <button onclick="copyNotifData(this)" data-text="${safeText}" class="absolute top-2 right-2 text-gray-400 hover:text-blue-600 bg-gray-50 hover:bg-blue-50 rounded shadow-sm p-1.5 opacity-80 sm:opacity-0 group-hover:opacity-100 transition-all cursor-pointer" title="Copy Log Eror">
                                        <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1h-3a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5z"/></svg>
                                    </button>
                                </div>
                            `;
                        });
                    } else {
                        badge.classList.add('hidden');
                        notifList.innerHTML = '<p class="text-[10px] text-gray-400 text-center py-4">Tidak ada notifikasi eror.</p>';
                    }
                } else {
                    display.innerText = "Info Token Kosong";
                    document.getElementById('notif-badge').classList.add('hidden');
                }
            })
            .withFailureHandler(function(error) {
                document.getElementById('ai-token-display').innerText = "Gagal memuat token";
            })
            .getAITokenStatus(SHEET_URL);
    }

// FUNGSI updateDeviceFilter (DIOPTIMASI: Single-Pass Aggregation)
// Meniadakan fungsi getDeviceStats agar tidak N+1 looping
// =====================================================================
function updateDeviceFilter() {
    const selectElems = document.querySelectorAll('.device-select-elem');
    if (selectElems.length === 0) return;
    const oldVal = selectElems[0].value || "Semua";

    // 1. Single Pass: Grouping Data Kontak Unik
    const contactMap = new Map();
    allData.forEach(row => {
        const id = row[1];
        if (!contactMap.has(id)) {
            const labelWA = String(row[2] || "");
            const isUnsubAI = labelWA.replace(/\s+/g, '').toUpperCase().includes("UNSUBAI");
            const rawVal = row[25];
            const nextSendFuVal = String(row[28] || "").trim(); // Tarik data Next Send FU
            const isUnread = rawVal === true || String(rawVal).toLowerCase().trim() === "true" || String(rawVal).toLowerCase().trim() === "benar";

            contactMap.set(id, {
                device: String(row[3] || "Default").trim(),
                isMe: String(row[13]).toLowerCase().trim() === "true",
                waLabel: labelWA.trim(),
                unsub: isUnsubAI,
                isUnread: isUnread,
                nextSendFu: nextSendFuVal // Masukkan ke dalam map
            });
        }
    });

    // 2. Single Pass: Hitung Statistik Semua & Per Device sekaligus
    let countSemua = 0;
    const deviceStats = {};

    contactMap.forEach((c, id) => {
        const dev = c.device;
        
        if (dev && dev.toLowerCase() !== 'default' && !deviceStats[dev]) {
            deviceStats[dev] = { count: 0 };
        }

        // Terapkan toggle filter dari UI
        const matchUnsub = !filterUnsubOnly || c.unsub;
        const matchBelumBalas = !filterBelumBalasOnly || !c.isMe;
        const matchUnread = !filterUnreadOnly || c.isUnread;
        const matchNextSendFu = !filterNextSendFuOnly || isNextSendFuDue(c.nextSendFu); // LOGIKA BARU

        // Jika lolos SEMUA filter (termasuk Next Send FU), tambahkan hitungan
        if (matchUnsub && matchBelumBalas && matchUnread && matchNextSendFu) {
            countSemua++; 
            if (dev && dev.toLowerCase() !== 'default') {
                deviceStats[dev].count++; 
            }
        }
    });

    // 3. Render Pilihan Dropdown ke SEMUA elemen dropdown perangkat (Desktop & Mobile)
    const sortedDevices = Object.keys(deviceStats).sort();

    selectElems.forEach(select => {
        select.innerHTML = `<option value="Semua">Semua Perangkat (${countSemua})</option>`;

        sortedDevices.forEach(dev => {
            let count = deviceStats[dev].count;
            let deviceTotalDb = "0";
            let koneksiStatus = "";
            let isDeviceUnknown = true;
            let isApiKeyEmpty = true;
            let colorCircle = '⚫';

            const devSetting = deviceCache.find(d => String(d.providerId).trim() === dev);
            if (devSetting && devSetting.fullRow) {
                isDeviceUnknown = false;
                deviceTotalDb = String(devSetting.fullRow[22] || "0").trim(); 
                koneksiStatus = String(devSetting.fullRow[15] || "").toLowerCase().trim(); 
                
                const apiKey = String(devSetting.fullRow[8] || "").trim(); 
                if (apiKey !== "") isApiKeyEmpty = false;
            }

            if (!isDeviceUnknown) {
                if (isApiKeyEmpty) {
                    colorCircle = '⚫';
                } else if (koneksiStatus.includes('terkoneksi')) {
                    colorCircle = '🟢';
                } else if (koneksiStatus.includes('terputus') || koneksiStatus !== "") {
                    colorCircle = '🔴';
                }
            }

            const opt = document.createElement('option');
            opt.value = dev;
            opt.innerText = `${colorCircle} ${dev} (${count}/${deviceTotalDb})`;
            select.appendChild(opt);
        });

        if (Array.from(select.options).some(o => o.value === oldVal)) {
            select.value = oldVal;
        }
    });
}

function handleFollowUpClick(contactId, waNumber) {
    // 1. Buka WA web/app di tab/jendela baru
    window.open(`https://wa.me/${waNumber}`, '_blank');
    
    // 2. Berikan notifikasi awal
    showToast("Memperbarui jadwal Follow Up...");
    
    // 3. Tembak ke Backend GAS untuk update spreadsheet
    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.status === "success") {
                // 4. Update data cache UI secara instan agar sinkron
                // Mengupdate array allData (Ingat: Index Array dimulai dari 0)
                const rowIndex = allData.findIndex(r => r[1] === contactId);
                if (rowIndex > -1) {
                    allData[rowIndex][13] = true; // Kolom N (Index 13): Set isMe ke True
                    allData[rowIndex][16] = res.waktuSekarangStr; // Kolom Q (Index 16): Waktu Keluar Terakhir
                    allData[rowIndex][24] = "Manual NextSendFU dari Omnichanel"; // Kolom Y (Index 24): Log AI
                    allData[rowIndex][28] = res.newDateStr; // Kolom AC (Index 28): Next Send FU
                }
                
                showToast("✅ Jadwal FU diperbarui: " + res.newDateStr);
                
                // 5. Render ulang sidebar agar kartu ter-refresh
                renderSidebar(); 
            } else {

    function isImageUrl(url) {
        if (url.includes('oneapi.my.id/download/v')) return true;
        // TAMBAHKAN BARIS INI: Jika link mengandung "drive.google.com/file/d/", anggap itu gambar
        if (url.includes('drive.google.com/file/d/')) return true;
        if (url.includes('drive.google.com/uc?')) return true;
        const imageExtensions = /\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?.*)?$/i;
        return imageExtensions.test(url);
    }

    // MODIFIKASI: Konversi Link Drive menggunakan jalur CDN Google Usercontent (Mendukung CORS)
function getEmbeddableImageUrl(url) {
        if (!url) return "";
        // TAMBAHAN BARU: Regex ini sekarang bisa menangkap ID dari format /file/d/ MAUPUN /uc?id=
        const gDriveRegex = /drive\.google\.com\/(?:file\/d\/|uc\?.*?id=)([a-zA-Z0-9_-]+)/;
        const match = url.match(gDriveRegex);
        
        if (match) {
            // Mengubahnya menjadi link CDN Googleusercontent agar mendukung CORS & html2canvas
            return `https://lh3.googleusercontent.com/d/${match[1]}`;
        }
        return url;
    }

        const apiWarning = document.getElementById('api-warning-msg');

        // 3. Pengecekan Ketersediaan API & Status Device dari Memori Lokal
        const rowData = allData.find(r => r[1] === currentContactId);
        const apiKeyValid = rowData && String(rowData[31] || "").trim() !== "";
        const apiUrlValid = rowData && String(rowData[32] || "").trim() !== "";
        
        // Pengecekan Status Device dari Kolom C (Indeks 2) di deviceCache
        const devSetting = deviceCache.find(d => d.providerId === contact.device || String(d.fullRow[0] || "").trim() === contact.device);
        const isDeviceOff = devSetting && String(devSetting.fullRow[2] || "").trim().toUpperCase() === "DEVICE OFF";

        // --- BLOK KODE BARU: LOGIKA PINNED MESSAGE (Kolom D / Index 3) & TASK BAR ---
        currentActiveDeviceSetting = devSetting; // Simpan ke global untuk Tooltip
        const pinTaskBar = document.getElementById('chat-pin-task-bar');

        const pinnedTextEl = document.getElementById('pinned-msg-text');
        if (pinTaskBar) pinTaskBar.classList.remove('hidden');
        
        // Menarik data catatan dari Kolom D (Indeks 3)
        const catatanDevice = devSetting && devSetting.fullRow ? String(devSetting.fullRow[3] || "").trim() : "";

        if (catatanDevice !== "" && catatanDevice !== "-") {

// Helper pengecekan apakah tanggal Next Send FU sudah melewati hari ini (due/saatnya FU)
function isNextSendFuDue(dateStr) {
    // 1. MODIFIKASI: Jika data kosong, undefined, atau strip (-), ANGGAP MASUK WAKTU FU (return true)
    if (!dateStr || String(dateStr).trim() === "" || String(dateStr).trim() === "-") {
        return true; 
    }
    
    let targetDate = new Date(dateStr);
    
    // 2. MODIFIKASI: Jika data ada isinya tapi formatnya bukan tanggal valid, ANGGAP MASUK WAKTU FU (return true)
    if (isNaN(targetDate.getTime())) {
        return true; 
    }
    
    // 3. Pengecekan normal jika tanggal valid
    let today = new Date();
    today.setHours(0, 0, 0, 0);
    targetDate.setHours(0, 0, 0, 0);
    
    // Kembalikan true jika tanggal target sudah kelewatan atau sama dengan hari ini
    return targetDate <= today; 
}

            } else {

    // Variabel untuk menampung data file
    let selectedFileData = null;

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Tampilkan panel
        document.getElementById('attachment-panel').classList.remove('hidden');
        document.getElementById('file-name-display').innerText = file.name;
        
        // Cek apakah gambar atau dokumen untuk icon
        const isImage = file.type.startsWith('image/');
        document.getElementById('file-icon').innerText = isImage ? '🖼️' : '📄';

        // Convert ke Base64
        const reader = new FileReader();
        reader.onload = function(e) {
            selectedFileData = {
                base64: e.target.result, // Format: data:image/png;base64,iVBORw0KGgo...
                name: file.name,
                mimeType: file.type,
                type: isImage ? 'image' : 'document'
            };
        };
        reader.readAsDataURL(file);
    }

    function clearAttachment() {
        document.getElementById('file-input').value = "";
        selectedFileData = null;
        document.getElementById('attachment-panel').classList.add('hidden');
    }

    function triggerSend() {
        const input = document.getElementById('msg-input');
        const btn = document.getElementById('send-btn');
        const text = input.value.trim();
        
        // 1. Validasi
        if ((!text && !selectedFileData) || !currentContactId || btn.disabled) return;
        
        const row = allData.find(r => r[1] === currentContactId);
        
        // [BLOK KODE BARU] Parsing waNo responsif untuk Grup dan Personal
        let waNo = currentContactId;
        if (waNo.includes('@g.us')) {
            // Jika Grup: Potong tepat setelah @g.us (membuang ekstensi akun admin di belakangnya)
            waNo = waNo.split('@g.us')[0] + '@g.us';
        } else {
            // Jika Personal: Potong pada titik separator dan bersihkan semua karakter non-angka
            waNo = waNo.split('.')[0].replace(/\D/g, '');
        }
        
        // --- AMBIL KREDENSIAL DARI ARRAY ---
        const apiURLTarget = String(row[32] || "");
        const apiKeyTarget = String(row[31] || "");
        
        // DETEKSI PROVIDER
        const isStarsender = apiURLTarget.toLowerCase().includes('starsender');
        const isFonnte = apiURLTarget.toLowerCase().includes('fonnte'); // Deteksi Fonnte
        
        // 2. Tampilan Loading UI
        btn.disabled = true; btn.classList.add('opacity-70');
        document.getElementById('send-icon').classList.add('hidden');
        document.getElementById('send-loading').classList.remove('hidden');
        input.disabled = true;
        
        // 3. Susun Payload Sesuai Provider
        let payload = {};
        if (selectedFileData) {
            if (isStarsender) {
                payload = { "messageType": selectedFileData.type === "document" ? "document" : "media", "to": waNo, "body": text || " ", "file": "AKAN_DIISI_OLEH_GAS" };
            } else if (isFonnte) {
                // Payload khusus lampiran media untuk Fonnte
                payload = { "target": waNo, "message": text || " ", "url": "AKAN_DIISI_OLEH_GAS" };
            } else {
                // Payload OneSender
                const mediaType = selectedFileData.type === "document" ? "document" : "image";
                payload = { "recipient_type": "individual", "to": waNo, "type": mediaType, [mediaType]: { "link": "AKAN_DIISI_OLEH_GAS", "caption": text } };
            }
        } else {
            // Pengiriman Teks Biasa
            if (isStarsender) {
                payload = { "messageType": "text", "to": waNo, "body": text };
            } else if (isFonnte) {
                // Payload khusus teks untuk Fonnte
                payload = { "target": waNo, "message": text };
            } else {
                // Payload khusus teks OneSender
                payload = { "recipient_type": "individual", "to": waNo, "type": "text", "text": { "body": text } };
            }
        }
        
        // Data paket yang akan dikirim ke Backend
        const requestData = { 
            apiUrl: apiURLTarget, 
            apiKey: apiKeyTarget, 
            payload: payload,
            fileData: selectedFileData,
            uniqueId: currentContactId, 
            sheetInput: SHEET_URL 
        };
        
        // 4. EKSEKUSI NATIVE JALUR DALAM
        google.script.run
            .withSuccessHandler(function(responseStr) {
                const result = JSON.parse(responseStr);
                if (result.status === "success") { 
                    input.value = ""; 
                    input.style.height = 'auto'; 
                    clearAttachment(); 
                    showToast("Pesan Terkirim!"); 
                    setTimeout(fetchData, 2000); 
                } else {
                    showToast("Gagal: " + (result.message || ""));
                }
                resetBtn();
            })
            .withFailureHandler(function(error) {
                showToast("Error Koneksi ke Server UI");
                resetBtn();
            })
            .processUIPostNative(requestData);

        // Fungsi pembantu kembalikan tombol
        function resetBtn() {
            btn.disabled = false; 
            btn.classList.remove('opacity-70'); 
            document.getElementById('send-icon').classList.remove('hidden'); 
            document.getElementById('send-loading').classList.add('hidden'); 
            input.disabled = false; 
            input.focus(); 
        }
    }

    function formatForDatetimeLocal(dateStr) {
        if (!dateStr) return "";
        let formatted = String(dateStr).trim().replace(' ', 'T');

            formatted = formatted.substring(0, 16);
        }
        return formatted;

    function formatFromDatetimeLocal(dtValue) {
        if (!dtValue) return "";
        let formatted = String(dtValue).trim().replace('T', ' ');
        if (formatted.length === 16) {
            formatted += ":00";
        }
        return formatted;
    }

    // Data Bawaan
    document.getElementById('edit-name-input').value = row[7] || "";
    document.getElementById('edit-nama-lengkap').value = row[8] || "";
    document.getElementById('edit-biodata-input').value = row[9] || "";
    
    // BLOK KODE BARU: Setup Data Lanjutan (AA-AF)
    let fufDayVal = row[26] !== "" && row[26] !== undefined ? row[26] : 7;
    document.getElementById('edit-fuf-day').value = fufDayVal;
    
    let fufVal = row[27] !== "" && row[27] !== undefined ? row[27] : 0;
    document.getElementById('edit-fuf').value = fufVal;
    
    document.getElementById('edit-next-send').value = formatForDatetimeLocal(row[28] || "");
    
    let adVal = String(row[29] || "").toUpperCase() === "FALSE" ? "FALSE" : "TRUE";
    document.getElementById('edit-ad').value = adVal;
    
    document.getElementById('edit-first-name').value = row[30] || "";
    document.getElementById('edit-limit-history').value = row[20] !== "" && row[20] !== undefined ? row[20] : "";
    const appendHistEl = document.getElementById('edit-append-history');
    if (appendHistEl) {
        appendHistEl.value = "";
        appendHistEl.style.height = 'auto';
    }

    // Generate Checkbox Label
    const currentLabels = (row[2] || "").toUpperCase().split(',').map(l => l.trim());
    const container = document.getElementById('edit-labels-container');
    container.innerHTML = "";
    
    if (masterLabelsList.length === 0) {
        container.innerHTML = '<span class="text-xs text-red-400">Gagal memuat label.</span>';
    } else {
        masterLabelsList.forEach(label => {
            const isChecked = currentLabels.includes(label.toUpperCase()) ? "checked" : "";
            container.innerHTML += `
                <label class="flex items-center gap-2 p-2 bg-white hover:bg-emerald-50/70 cursor-pointer transition-colors border border-gray-200/80 hover:border-emerald-300 rounded-xl">
                    <input type="checkbox" value="${label}" class="label-checkbox w-4 h-4 text-[#00a884] accent-[#00a884] rounded cursor-pointer shrink-0" ${isChecked}>
                    <span class="text-xs font-semibold text-gray-700 truncate" title="${label}">${label}</span>
                </label>
            `;
        });
    }
    document.getElementById('edit-modal').classList.remove('hidden');
}

// BLOK KODE BARU: Algoritma Pembuat First Name Dinamis
function generateFirstName() {
    const row = allData.find(r => r[1] === currentContactId) || [];
    
    let akun = String(row[0] || "ACC1");
    let prefixAkun = akun.substring(0, 2);
    
    let deviceNum = String(row[4] || "01").replace(/\D/g, '');
    let suffixDevice = deviceNum.slice(-4);
    
    const checkboxes = document.querySelectorAll('.label-checkbox:checked');
    const labels = Array.from(checkboxes).map(cb => cb.value.toUpperCase());
    
    let labelVal = "";
    if (labels.includes("SV")) labelVal = ".SV";
    else if (labels.includes("ABC")) labelVal = ".ABC";
    else if (labels.includes("NEW")) labelVal = ".NEW";
    
    let namaPanggilan = document.getElementById('edit-name-input').value.trim();
    if (namaPanggilan !== "") namaPanggilan = " " + namaPanggilan + " ";
    else namaPanggilan = " ";
    
    let waCust = document.getElementById('edit-wa-customer')?.value.trim().replace(/\D/g, '') || document.getElementById('edit-id-networking').value.replace(/\D/g, '') || String(row[5] || "").replace(/\D/g, '');
    if (waCust.startsWith('0')) waCust = '62' + waCust.substring(1);

    let output = `${prefixAkun}${suffixDevice}${labelVal}${namaPanggilan}[${waCust}]`;
    document.getElementById('edit-first-name').value = output;
}

async function saveProfile() {
    const btn = document.getElementById('btn-save-profile');
    
    let devSelect = document.getElementById('edit-device-select');
    let devNum = devSelect ? devSelect.value.trim().replace(/\D/g, '') : "";
    let waCustRaw = document.getElementById('edit-wa-customer')?.value || "";
    let waCust = waCustRaw.trim().replace(/\D/g, '');
    if (waCust.startsWith('0')) waCust = '62' + waCust.substring(1);

    const idNetInput = document.getElementById('edit-id-networking').value.trim();

    if (isAddContactMode) {
        if (!devNum) {
            showToast("⚠️ Silakan pilih Device Server (Kolom E)!");
            return;
        }
        if (!waCust) {
            showToast("⚠️ Silakan isi Nomor WA Customer (Kolom F)!");
            return;
        }
        // [FUNGSI BARU] Validasi Duplikat Networking (Kolom B)
        const isDuplicate = await checkDuplicateAndWarn(idNetInput);
        if (isDuplicate) return;
    }

    const targetUniqueId = isAddContactMode ? idNetInput : currentContactId;

    // Lookup Nama Device (Kolom D) & Akun CS (Kolom A) dari Setting Sheet berdasarkan Nomor Device (Kolom E / devNum)
    let colD_deviceName = "";
    let colA_akunCS = "ACC1";
    if (isAddContactMode) {
        let devices = window.globalRawDevicesMaster || (typeof deviceCache !== 'undefined' ? deviceCache : []);
        let matchedDev = devices.find(d => {
            let num = String(d.fullRow ? d.fullRow[6] : d.providerId || "").trim().replace(/\D/g, '');
            return num === devNum;
        });
        if (matchedDev) {
            colD_deviceName = String(matchedDev.fullRow ? matchedDev.fullRow[0] : matchedDev.csName || "").trim();
            colA_akunCS = String(matchedDev.fullRow ? matchedDev.fullRow[1] : matchedDev.csName || "ACC1").trim() || "ACC1";
        }
    }

    const newName = document.getElementById('edit-name-input').value.trim();
    const newNamaLengkap = document.getElementById('edit-nama-lengkap').value.trim();
    const newBiodata = document.getElementById('edit-biodata-input').value.trim();
    
    const checkboxes = document.querySelectorAll('.label-checkbox:checked');
    const newLabels = Array.from(checkboxes).map(cb => cb.value).join(', ');

    const appendHistInput = document.getElementById('edit-append-history');
    const newAppendHistory = appendHistInput ? appendHistInput.value.trim() : "";

    const rawNextSend = document.getElementById('edit-next-send').value;
    const finalNextSendStr = formatFromDatetimeLocal(rawNextSend);

    // Kumpulkan Nilai Data Baru
    const dataObj = {
        name: newName,
        namaLengkap: newNamaLengkap,
        biodata: newBiodata,
        labels: newLabels,
        akun: colA_akunCS,             // Kolom A (Akun CS dari Setting Kolom B)
        device: colD_deviceName,        // Kolom D (Nama Device)
        deviceNum: devNum,             // Kolom E (Nomor Device)
        waPhone: waCust,               // Kolom F (WA Customer)
        fufDay: document.getElementById('edit-fuf-day').value,
        fuf: document.getElementById('edit-fuf').value,
        nextSend: finalNextSendStr,
        editAd: document.getElementById('edit-ad').value,
        firstName: document.getElementById('edit-first-name').value,
        limitHistory: document.getElementById('edit-limit-history').value,
        appendHistory: newAppendHistory,
        isNewContact: isAddContactMode
    };

    btn.innerHTML = `<div class="flex items-center justify-center gap-2"><div class="spinner-small"></div><span>Menyimpan...</span></div>`;
    btn.disabled = true;
    btn.classList.add('opacity-70');

    google.script.run
        .withSuccessHandler(function(status) {
            if (status === "success") {
                if (isAddContactMode) {
                    const pad = n => String(n).padStart(2, '0');
                    const now = new Date();
                    const nowStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                    const yy = String(now.getFullYear()).slice(-2);
                    const mm = pad(now.getMonth()+1);
                    const dd = pad(now.getDate());
                    const colM_format = "id" + yy + mm + dd; // Rumus idyymmdd (misal: id261110)
                    
                    const newRow = [
                        colA_akunCS, targetUniqueId, newLabels || "NEW", colD_deviceName, devNum, waCust, "",
                        newName, newNamaLengkap, newBiodata, nowStr, "{}", colM_format, false,
                        "", "", "", 0, 0, newAppendHistory, dataObj.limitHistory, "Queue", "", "", "Manual Input UI", true,
                        dataObj.fufDay, dataObj.fuf, dataObj.nextSend, dataObj.editAd === "FALSE" ? false : true, dataObj.firstName
                    ];
                    allData.unshift(newRow);
                    currentContactId = targetUniqueId;
                } else {
                    const rowIndex = allData.findIndex(r => r[1] === currentContactId);
                    if (rowIndex > -1) {
                        allData[rowIndex][7] = dataObj.name; 
                        allData[rowIndex][8] = dataObj.namaLengkap; 
                        allData[rowIndex][2] = dataObj.labels; 
                        allData[rowIndex][9] = dataObj.biodata; 
                        allData[rowIndex][26] = dataObj.fufDay;
                        allData[rowIndex][27] = dataObj.fuf;
                        allData[rowIndex][28] = dataObj.nextSend;
                        allData[rowIndex][29] = dataObj.editAd === "FALSE" ? false : true;
                        allData[rowIndex][30] = dataObj.firstName;
                        allData[rowIndex][20] = dataObj.limitHistory;
                    }
                }
                
                document.getElementById('edit-modal').classList.add('hidden');
                
                if (currentContactId) {
                    const nameDisp = document.getElementById('chat-name');
                    if (nameDisp) nameDisp.innerText = newName || targetUniqueId;
                    const badges = document.getElementById('chat-badges');
                    if (badges) {
                        const isUnsub = newLabels.replace(/\s+/g, '').toUpperCase().includes("UNSUBAI");
                        badges.innerHTML = (newLabels ? `<span class="badge-wa !bg-white/20 !text-white border-none">${newLabels}</span>` : '') + (isUnsub ? `<span class="badge-unsub-ai !bg-red-500 !text-white border-white/40">UNSUB AI</span>` : '');
                    }
                }
                
                renderSidebar();
                if (isAddContactMode) {
                    openChat();
                    refreshChat();
                    showToast("✅ Kontak baru berhasil ditambahkan!");
                } else {
                    showToast("Profil Lengkap & Setup FUF berhasil diperbarui!");
                }
            } else {
                showToast("Gagal menyimpan data ke Database.");
            }
            btn.innerText = "Simpan";
            btn.disabled = false;
            btn.classList.remove('opacity-70');
        })
        .withFailureHandler(function(e) {
            showToast("Error koneksi jaringan saat menyimpan.");
            btn.innerText = "Simpan";
            btn.disabled = false;
            btn.classList.remove('opacity-70');
        })
        .updateContactProfileFullNative(SHEET_URL, targetUniqueId, dataObj);
}

// --- FUNGSI BARU: TARIK DATA DEVICE DI BACKGROUND ---
function fetchSilentDeviceCache(callback) {
    if (!SHEET_URL) return;
    google.script.run
        .withSuccessHandler(function(data) {
            if (data && data.devices) {
                // 1. Suntik Webhook
                if (document.getElementById('webhook-url-display')) {
                    document.getElementById('webhook-url-display').value = data.webhookUrl || "A2 Kosong / URL belum dideteksi";
                }
                
                // 2. Suntik B23 & B24 ke Global Memory
                if (data.send) {
                    sysDayTier2 = data.send[6] || "-";
                    sysRasioTier2 = data.send[7] ? (parseFloat(data.send[7]) * 100) + "%" : "-";
                }
                
                // 3. Simpan Bank Content ke memori Frontend
                if (data.bankContent) globalBankContentCache = data.bankContent;
                
                let rawDevices = data.devices || [];
                window.globalRawDevicesMaster = rawDevices;
                if (data.akunList) window.globalAkunListMaster = data.akunList;
                
                // Ekstraksi Khusus CS: Filter berdasarkan Nomor Server (Kolom G)
                if (typeof isCS !== 'undefined' && isCS) {
                    let csNum = userAllowedAccounts[0].substring(3);
                    deviceCache = rawDevices.filter(d => String(d.fullRow[6] || "").trim() === csNum);
                    if (deviceCache.length > 0 && deviceCache[0].fullRow) {
                        userMenuAccess = String(deviceCache[0].fullRow[29] || "").trim();
                        localStorage.setItem('omni_menuAccess', userMenuAccess);
                    }
                } 
                // Ekstraksi Khusus Admin Biasa
                else if (typeof isMasterAdmin !== 'undefined' && !isMasterAdmin && typeof userAllowedAccounts !== 'undefined') {
                    deviceCache = rawDevices.filter(d => {
                        let akunDevice = String(d.fullRow[1] || "").trim();
                        return userAllowedAccounts.includes(akunDevice);
                    });
                } 
                // Ekstraksi Master Admin
                else {
                    deviceCache = rawDevices;
                }
                updateDeviceFilter(); 
                applyFinanceAccessControl();
                applyTaskAccessControl();
                applyChatAccessControl();
                handleCSAutoRedirect();
                if (typeof callback === 'function') callback(deviceCache);
            }
        })
        .getSettingsForUI(SHEET_URL);
}

// --- FUNGSI BARU: AUTOSINKRONISASI JIKA MANAJEMEN DEVICE SELESAI DIEDIT / TAMBAH BARU / HAPUS ---
function syncDeviceDataAfterChange(customMsg) {
    showToast(customMsg || "🔄 Autosinkronisasi data device sedang berjalan...");

    // Indikator visual loading pada list device jika modal sedang terbuka
    const listEl = document.getElementById('device-list');
    if (listEl && !document.getElementById('config-modal').classList.contains('hidden')) {
        listEl.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-[#008069] font-bold italic animate-pulse flex flex-col items-center gap-2">
            <div class="spinner-small mx-auto"></div>
            <span>Mensinkronkan data device terbaru dari server...</span>
        </div>`;
    }

    // Tarik data device & setting terbaru dari server
    fetchSilentDeviceCache(function(newDeviceCache) {
        // 1. Render ulang tampilan card device jika panel terbuka
        if (!document.getElementById('config-modal').classList.contains('hidden') && 
            !document.getElementById('section-device-list').classList.contains('hidden')) {
            renderDeviceList();
        }

        // 2. Jalankan sinkronisasi data obrolan / kontak utama
        fetchData();

        // 3. Refreshed Device Setting & Pinned Info jika chat sedang aktif
        if (typeof currentContactId !== 'undefined' && currentContactId) {
            const contact = allData.find(r => r[1] === currentContactId);
            if (contact) {
                const updatedDevSetting = newDeviceCache.find(d => 
                    d.providerId === contact[4] || String(d.fullRow[0] || "").trim() === contact[4]
                );
                currentActiveDeviceSetting = updatedDevSetting || null;

                // Update pinned message container
                const pinnedContainer = document.getElementById('pinned-msg-container');
                const pinnedTextEl = document.getElementById('pinned-msg-text');
                const catatanDevice = updatedDevSetting && updatedDevSetting.fullRow ? String(updatedDevSetting.fullRow[3] || "").trim() : "";

                if (pinnedContainer && pinnedTextEl) {
                    if (catatanDevice !== "" && catatanDevice !== "-") {
                        pinnedTextEl.innerText = catatanDevice;
                        pinnedContainer.classList.remove('hidden');
                    } else {
                        pinnedContainer.classList.add('hidden');
                    }
                }

                // Update warning status device OFF
                const deviceOffWarning = document.getElementById('device-off-msg');
                const isDeviceOff = updatedDevSetting && String(updatedDevSetting.fullRow[2] || "").trim().toUpperCase() === "DEVICE OFF";
                if (deviceOffWarning) {
                    if (isDeviceOff) {
                        deviceOffWarning.classList.remove('hidden');
                    } else {
                        deviceOffWarning.classList.add('hidden');
                    }
                }
            }
        }

        showToast("✅ Autosinkronisasi device selesai!");
    });
}
