// 4. Event Listener saat KPI / ID Area (C) Dipilih
function onTicketAreaChange(isEditMode = false, initialProg = null) {
    let selectedAreaId = document.getElementById('tk-id-area').value.trim();
    let subfields = document.getElementById('tk-subfields-container');
    let akunField = document.getElementById('tk-akun');
    let badgeAkun = document.getElementById('tk-badge-akun');
    
    let parentIdVal = (document.getElementById('tk-parent-id')?.value || "").trim();
    let isSubtaskForm = parentIdVal !== "" || (document.getElementById('tk-parent-banner') && !document.getElementById('tk-parent-banner').classList.contains('hidden'));

    if (!selectedAreaId && !isSubtaskForm) {
        subfields.classList.add('hidden');
        akunField.value = "";
        badgeAkun.innerText = "Akun: -";
        document.getElementById('tk-area-p').innerText = "-";
        return;
    }

    // Lookup Akun dari Sheet Area Kolom B (Index 1) berdasarkan ID Area di Kolom A
    let areaRow = areaDataCache.slice(1).find(r => String(r[0] || "").trim() === selectedAreaId);
    let akun = areaRow ? String(areaRow[1] || "").trim() : "";
    akunField.value = akun;
    badgeAkun.innerText = "Akun: " + (akun || "-");

    // Populate dropdown costumer filtered by selected Akun
    let currentW = document.getElementById('tk-col-w')?.value || '';
    let currentX = document.getElementById('tk-col-x')?.value || '';
    populateTicketCustomerOptions(currentW, currentX);

    // Buka sub-fields container
    subfields.classList.remove('hidden');

    let hArea = areaDataCache[0] || [];

    // AUTO-FILL JAM (KOLOM Q TASK) DARI KOLOM U SHEET AREA (TIME LOOP / JAM KPI)
    let idxUArea = getColIndex(hArea, "Time Loop") > -1 ? getColIndex(hArea, "Time Loop") : (getColIndex(hArea, "Time") > -1 ? getColIndex(hArea, "Time") : 20);
    let rawTimeLoop = areaRow ? (areaRow[idxUArea] !== undefined ? areaRow[idxUArea] : areaRow[20]) : "";
    let parsedTimeLoop = _parseTimeForInput(rawTimeLoop);
    let timeInputEl = document.getElementById('tk-time');
    if (parsedTimeLoop && timeInputEl && (!isEditMode || !timeInputEl.value)) {
        timeInputEl.value = parsedTimeLoop;
    }

    // TAMPILKAN KOLOM P SHEET AREA (Progress Pencapaian KPI Area Aktif)
    let idxP = getColIndex(hArea, "Pencapaian") > -1 ? getColIndex(hArea, "Pencapaian") : 15; // Kolom P
    let valP = areaRow ? String(areaRow[idxP] || areaRow[15] || "-").trim() : "-";
    document.getElementById('tk-area-p').innerText = valP || "-";

    // CEK KOLOM Q SHEET AREA (Auto-KS: True / False)
    let idxQ = getColIndex(hArea, "Auto KS") > -1 ? getColIndex(hArea, "Auto KS") : 16; // Kolom Q
    let rawQ = areaRow ? String(areaRow[idxQ] || areaRow[16] || "").trim().toLowerCase() : "";
    let isAutoKs = (rawQ === "true" || rawQ === "1" || rawQ === "ya" || rawQ === "yes");

    let badgeAutoKs = document.getElementById('tk-badge-autoks');
    let kontribusiInput = document.getElementById('tk-kontribusi');
    let kontribusiMode = document.getElementById('tk-kontribusi-mode');
    let kontribusiDesc = document.getElementById('tk-kontribusi-desc');
    
    kontribusiInput.dataset.autoks = isAutoKs ? "true" : "false";

    if (isAutoKs) {
        badgeAutoKs.className = "text-[9.5px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 shrink-0";
        badgeAutoKs.innerText = "Auto-KS: True (Otomatis)";
        kontribusiMode.innerText = "Otomatis dari Progress (K)";
        kontribusiMode.className = "text-[10px] font-bold text-emerald-600";
        kontribusiDesc.innerText = "Nilai terisi otomatis mengikuti % progress (Kolom K)";
        kontribusiInput.readOnly = true;
        kontribusiInput.classList.add('bg-gray-100', 'cursor-not-allowed');

        // Set nilai kontribusi otomatis dari Kolom K (% progress): misal 50% -> 0.5
        let currentProg = (initialProg !== null && !isNaN(initialProg) && initialProg > 0) ? initialProg : (parseInt(document.getElementById('tk-prog-val').value) || 1);
        if (!isEditMode && (initialProg === null || initialProg === 0)) currentProg = 1;
        kontribusiInput.value = (currentProg / 100);
    } else {
        badgeAutoKs.className = "text-[9.5px] font-extrabold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-200 shrink-0";
        badgeAutoKs.innerText = "Auto-KS: False (Manual)";
        kontribusiMode.innerText = "Input Manual";
        kontribusiMode.className = "text-[10px] font-bold text-amber-600";
        kontribusiDesc.innerText = "Silakan masukkan angka kontribusi tugas secara manual";
        kontribusiInput.readOnly = false;
        kontribusiInput.classList.remove('bg-gray-100', 'cursor-not-allowed');
    }

    // Cek Kolom S (Tags) di Sheet Area (Index 18)
    let idxTags = getColIndex(hArea, "Tags") > -1 ? getColIndex(hArea, "Tags") : 18;
    let tagsStr = areaRow ? String(areaRow[idxTags] || areaRow[18] || "").trim() : "";
    
    // Cek Kolom R (Berulang) di Sheet Area (Index 17)
    let idxR = getColIndex(hArea, "Berulang") > -1 ? getColIndex(hArea, "Berulang") : 17;
    let rawR = areaRow ? String(areaRow[idxR] || areaRow[17] || "").trim().toLowerCase() : "";
    let isBerulang = (rawR === "true" || rawR === "1" || rawR === "ya" || rawR === "yes");

    let tagsContainer = document.getElementById('tk-tags-container');
    let manualProgWrapper = document.getElementById('tk-manual-prog-wrapper');
    let checklistDiv = document.getElementById('tk-tags-checklist');

    // Single Progress Bar: Jika isBerulang True, slider & number input diset disabled (read-only), namun jika task memiliki Parent Task ID (sub-task) selalu izinkan manual
    let progSlider = document.getElementById('tk-prog-slider');
    let progNum = document.getElementById('tk-prog-num');
    if (isBerulang && !isSubtaskForm && !parentIdVal) {
        if (progSlider) { progSlider.disabled = true; progSlider.classList.add('cursor-not-allowed', 'opacity-80'); }
        if (progNum) { progNum.disabled = true; progNum.classList.add('bg-gray-100', 'cursor-not-allowed'); }
    } else {
        if (progSlider) { progSlider.disabled = false; progSlider.classList.remove('cursor-not-allowed', 'opacity-80'); }
        if (progNum) { progNum.disabled = false; progNum.readOnly = false; progNum.classList.remove('bg-gray-100', 'cursor-not-allowed'); }
    }

    let currentTaskId = (document.getElementById('tk-id')?.value || "").trim();
    let hasChildSubtasks = false;
    if (currentTaskId && currentTaskId !== 'NEW' && ticketDataCache && ticketDataCache.length > 1) {
        hasChildSubtasks = ticketDataCache.slice(1).some(r => String(r[9] || "").trim() === currentTaskId);
    }
    let shouldShowTags = !isSubtaskForm && !hasChildSubtasks;

    if (isAutoKs && shouldShowTags) {
        tagsContainer.classList.remove('hidden');
    }

    if (tagsStr && shouldShowTags) {
        // Mode Checklist Tags ON
        tagsContainer.classList.remove('hidden');

        let tagsArr = tagsStr.split(',').map(s => s.trim()).filter(Boolean);
        let existingChecked = isEditMode ? (document.getElementById('tk-tags-val').value || "").split(',').map(s => s.trim().toLowerCase()).filter(Boolean) : [];
        
        // Auto-check jika sebelumnya task punya progress tapi tags di Kolom L belum terisi
        let autoCheckCount = 0;
        if (isEditMode && existingChecked.length === 0 && initialProg !== null && initialProg > 0 && tagsArr.length > 0) {
            autoCheckCount = Math.min(tagsArr.length, Math.max(1, Math.round((initialProg / 100) * tagsArr.length)));
        }

        let checkHtml = "";
        tagsArr.forEach((tag, idx) => {
            let isChecked = existingChecked.includes(tag.toLowerCase()) || (autoCheckCount > 0 && idx < autoCheckCount);
            checkHtml += `
            <label class="flex items-center gap-2 p-2 bg-gray-50/80 hover:bg-blue-50/70 cursor-pointer transition-colors border border-gray-200/80 hover:border-blue-300 rounded-xl">
                <input type="checkbox" value="${tag}" ${isChecked ? 'checked' : ''} onchange="onTicketTagCheckChange()" class="tk-tag-cb w-4 h-4 accent-blue-600 rounded cursor-pointer shrink-0">
                <span class="text-xs font-semibold text-gray-700 truncate" title="${tag}">${tag}</span>
            </label>`;
        });
        checklistDiv.innerHTML = checkHtml;

        if (isAutoKs && !isEditMode && (initialProg === 0 || initialProg === null)) {
            setTicketProgress(1);
            document.getElementById('tk-prog-slider').value = 1;
            document.getElementById('tk-prog-num').value = 1;
            onTicketTagCheckChange();
        } else if (!isEditMode && (initialProg === 0 || initialProg === null)) {
            setTicketProgress(0);
        } else {
            onTicketTagCheckChange();
        }
    } else {
        // Mode Checklist Tags Kosong di Area -> Hide L jika Auto-KS False
        if (!isAutoKs) {
            tagsContainer.classList.add('hidden');
            checklistDiv.innerHTML = "";
            document.getElementById('tk-tags-val').value = "";
        }
        
        if (isAutoKs) {
            let baseProg = (isEditMode && initialProg !== null && initialProg > 0) ? initialProg : 1;
            setTicketProgress(baseProg);
            document.getElementById('tk-prog-slider').value = baseProg;
            document.getElementById('tk-prog-num').value = baseProg;
        } else if (isEditMode && initialProg !== null) {
            setTicketProgress(initialProg);
            document.getElementById('tk-prog-slider').value = initialProg;
            document.getElementById('tk-prog-num').value = initialProg;
        } else if (!isEditMode) {
            setTicketProgress(0);
        }
    }
}

// 5. Event Listener Checklist Tags (L) -> Otomatis hitung Progress (K) & Priority (I)
function onTicketTagCheckChange() {
    let allCbs = document.querySelectorAll('.tk-tag-cb');
    let total = allCbs.length;
    let checkedCbs = Array.from(document.querySelectorAll('.tk-tag-cb:checked'));
    let checkedCount = checkedCbs.length;
    
    let counter = document.getElementById('tk-tags-counter');
    if (counter) counter.innerText = `${checkedCount}/${total}`;

    let pct = total > 0 ? Math.round((checkedCount / total) * 100) : 0;
    
    // Periksa apakah ini task berulang (untuk sinkronisasi progres otomatis)
    let isBerulang = false;
    const areaSelect = document.getElementById('tk-id-area');
    const selectedAreaId = areaSelect ? areaSelect.value.trim() : "";
    if (selectedAreaId && areaDataCache && areaDataCache.length > 1) {
        const hArea = areaDataCache[0] || [];
        let idxR = getColIndex(hArea, "Berulang") > -1 ? getColIndex(hArea, "Berulang") : 17;
        let areaRow = areaDataCache.slice(1).find(r => String(r[0] || "").trim() === selectedAreaId);
        let rawR = areaRow ? String(areaRow[idxR] || areaRow[17] || "").trim().toLowerCase() : "";
        isBerulang = (rawR === "true" || rawR === "1" || rawR === "ya" || rawR === "yes");
    }

    // Hanya update progress otomatis jika Berulang = True
    if (isBerulang) {
        let kontribusiInput = document.getElementById('tk-kontribusi');
        let isAutoKs = kontribusiInput && kontribusiInput.dataset.autoks === "true";

        // Jika Auto-KS: True dan belum ada yang dicentang, pertahankan nilai dasar 1%
        if (isAutoKs && checkedCount === 0) {
            pct = 1;
        }

        document.getElementById('tk-prog-slider').value = pct;
        document.getElementById('tk-prog-num').value = pct;
        setTicketProgress(pct);
    }

    // Simpan daftar tags yang dicentang
    let checkedTagsStr = checkedCbs.map(cb => cb.value).join(', ');
    document.getElementById('tk-tags-val').value = checkedTagsStr;
}

// 6. Event Listener Manual Progress Slider/Input
function onManualTicketProgress(val) {
    let num = parseInt(val) || 0;
    num = Math.max(0, Math.min(100, num));
    document.getElementById('tk-prog-slider').value = num;
    document.getElementById('tk-prog-num').value = num;
    setTicketProgress(num);
}

// 7. Pengatur Visual Progress (K) & Priority Badge (I) & Sync Kontribusi (M jika Auto-KS True)
function setTicketProgress(pct) {
    pct = Math.max(0, Math.min(100, pct));
    document.getElementById('tk-prog-val').value = pct;
    document.getElementById('tk-prog-badge').innerText = pct + "%";
    
    // Update Dynamic Track Gradient pada Single Progress Slider
    let slider = document.getElementById('tk-prog-slider');
    if (slider) {
        let colorFrom = '#3B82F6'; // blue-500
        let colorTo = '#4F46E5';   // indigo-600
        if (pct === 100) {
            colorFrom = '#10B981'; // emerald-500
            colorTo = '#059669';   // emerald-600
        } else if (pct === 0) {
            colorFrom = '#D1D5DB'; // gray-300
            colorTo = '#D1D5DB';
        }
        slider.style.background = `linear-gradient(to right, ${colorFrom} 0%, ${colorTo} ${pct}%, #E5E7EB ${pct}%, #E5E7EB 100%)`;
    }

    let bar = document.getElementById('tk-prog-bar');
    if (bar) {
        bar.style.width = pct + "%";
        if (pct === 100) {
            bar.className = "h-2.5 rounded-full bg-gradient-to-r from-emerald-500 to-green-600 transition-all duration-300";
        } else if (pct > 0) {
            bar.className = "h-2.5 rounded-full bg-gradient-to-r from-blue-500 to-indigo-600 transition-all duration-300";
        } else {
            bar.className = "h-2.5 rounded-full bg-gray-300 transition-all duration-300";
        }
    }

    // Hitung Kolom M (Kontribusi) jika Kolom Q Area (Auto-KS) bernilai True
    let kontribusiInput = document.getElementById('tk-kontribusi');
    if (kontribusiInput && kontribusiInput.dataset.autoks === "true") {
        if (pct === 0) {
            kontribusiInput.value = "";
        } else {
            kontribusiInput.value = (pct / 100);
        }
    }

    // Skema Priority (Kolom I):
    // 100% = Done, 1-99% = In Progress, 0% = Plan
    let priority = "Plan";
    let badge = document.getElementById('tk-priority-badge');
    if (pct === 100) {
        priority = "Done";
        badge.className = "text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 tracking-wider";
        badge.innerHTML = "🟢 DONE";
    } else if (pct > 0) {
        priority = "In Progress";
        badge.className = "text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 border border-blue-200 tracking-wider";
        badge.innerHTML = "🟡 IN PROGRESS";
    } else {
        priority = "Plan";
        badge.className = "text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200 tracking-wider";
        badge.innerHTML = "⚪ PLAN";
    }
    document.getElementById('tk-priority').value = priority;

    // Trigger hide/show dan pengosongan form jika K = 0
    handleProgressKChange(pct);
}

// Pengatur Tampilan Kondisional saat Kolom K (Progress) = 0 atau > 0
function handleProgressKChange(pct) {
    let num = parseInt(pct);
    if (isNaN(num)) num = 0;

    const tagsWrapper = document.getElementById('tk-tags-container'); // Kolom L
    const gtaskWrapper = document.getElementById('tk-gtask-wrapper'); // Kolom Z
    const kontribusiAreaWrapper = document.getElementById('tk-kontribusi-area-p-wrapper'); // Kolom M & Virtual P Sheet Area
    const deadlineWrapper = document.getElementById('tk-deadline-wrapper'); // Kolom P & Q Ticket

    const inputM = document.getElementById('tk-kontribusi');
    const inputP = document.getElementById('tk-date');
    const inputQ = document.getElementById('tk-time');

    let isAutoKs = inputM && inputM.dataset.autoks === "true";
    let isBerulang = false;
    const areaSelect = document.getElementById('tk-id-area');
    const selectedAreaId = areaSelect ? areaSelect.value.trim() : "";
    if (selectedAreaId && areaDataCache && areaDataCache.length > 1) {
        const hArea = areaDataCache[0] || [];
        let idxR = getColIndex(hArea, "Berulang") > -1 ? getColIndex(hArea, "Berulang") : 17;
        let areaRow = areaDataCache.slice(1).find(r => String(r[0] || "").trim() === selectedAreaId);
        let rawR = areaRow ? String(areaRow[idxR] || areaRow[17] || "").trim().toLowerCase() : "";
        isBerulang = (rawR === "true" || rawR === "1" || rawR === "ya" || rawR === "yes");
    }

    if (num === 0) {
        // HIDE: Kolom L (Kecuali jika Progress > 0 DAN Berulang: True), Z, M, Virtual data kolom P (sheet area), P Ticket, Q Ticket
        if (tagsWrapper && !(num > 0 && isBerulang)) tagsWrapper.classList.add('hidden');
        if (gtaskWrapper) gtaskWrapper.classList.add('hidden');
        if (kontribusiAreaWrapper) kontribusiAreaWrapper.classList.add('hidden');
        if (deadlineWrapper) deadlineWrapper.classList.add('hidden');


        // KOSONGKAN VALUE: Kolom M, P, Q, dan reset tags jika sebelumnya sudah ada value
        if (inputM) inputM.value = "";
        if (inputP) inputP.value = "";
        if (inputQ) inputQ.value = "";
        
        let tagsVal = document.getElementById('tk-tags-val');
        if (tagsVal) tagsVal.value = "";
        document.querySelectorAll('.tk-tag-cb').forEach(cb => { cb.checked = false; });
        let counter = document.getElementById('tk-tags-counter');
        if (counter) {
            let total = document.querySelectorAll('.tk-tag-cb').length;
            counter.innerText = `0/${total}`;
        }
    } else {
        // SHOW: Kolom Z, M & P Area, P & Q Ticket
        let parentIdVal = (document.getElementById('tk-parent-id')?.value || "").trim();
        let isSubtaskForm = parentIdVal !== "" || (document.getElementById('tk-parent-banner') && !document.getElementById('tk-parent-banner').classList.contains('hidden'));

        if (gtaskWrapper) gtaskWrapper.classList.remove('hidden');
        if (kontribusiAreaWrapper) {
            if (isSubtaskForm) kontribusiAreaWrapper.classList.add('hidden');
            else kontribusiAreaWrapper.classList.remove('hidden');
        }
        if (deadlineWrapper) deadlineWrapper.classList.remove('hidden');

        // Kolom L Tags: Dimunculkan HANYA jika Progress > 0 DAN Berulang: True, serta BUKAN sub-task & TIDAK memiliki sub-task terisi
        let currentTaskId = (document.getElementById('tk-id')?.value || "").trim();
        let hasChildSubtasks = false;
        if (currentTaskId && currentTaskId !== 'NEW' && ticketDataCache && ticketDataCache.length > 1) {
            hasChildSubtasks = ticketDataCache.slice(1).some(r => String(r[9] || "").trim() === currentTaskId);
        }

        if (tagsWrapper && (num > 0 && isBerulang) && !isSubtaskForm && !hasChildSubtasks) {
            tagsWrapper.classList.remove('hidden');
        } else if (tagsWrapper) {
            tagsWrapper.classList.add('hidden');
        }

        // Jika P (tgl) atau Q (jam) kosong saat beralih dari 0 ke > 0, isi default tanggal hari ini & jam sekarang + 1 jam
        if (inputP && !inputP.value) {
            let now = new Date();
            let yyyy = now.getFullYear();
            let mm = String(now.getMonth() + 1).padStart(2, '0');
            let dd = String(now.getDate()).padStart(2, '0');
            inputP.value = `${yyyy}-${mm}-${dd}`;
        }
        if (inputQ && !inputQ.value) {
            let nowPlus1 = new Date();
            nowPlus1.setHours(nowPlus1.getHours() + 1);
            let hh = String(nowPlus1.getHours()).padStart(2, '0');
            let m = String(nowPlus1.getMinutes()).padStart(2, '0');
            inputQ.value = `${hh}:${m}`;
        }
        if (inputM && isAutoKs) {
            inputM.value = (num / 100);
        }
    }
}

    if (!isEdit) {

        document.getElementById('tk-badge-akun').innerText = "Akun: -";

        let areaSelect = document.getElementById('tk-id-area');
        areaSelect.innerHTML = '<option value="">-- Pilih Agen Terlebih Dahulu --</option>';
        areaSelect.disabled = true;
        areaSelect.classList.add('bg-gray-100', 'cursor-not-allowed');

        let areaWrapper = document.getElementById('tk-area-wrapper');
        if (areaWrapper) areaWrapper.classList.remove('hidden');

        document.getElementById('tk-subfields-container').classList.add('hidden');
        document.getElementById('tk-area-p').innerText = "-";
        document.getElementById('tk-badge-autoks').innerText = "Auto-KS: -";
        document.getElementById('tk-kontribusi').value = "";
        document.getElementById('tk-kontribusi').dataset.autoks = "false";
        document.getElementById('tk-kontribusi').readOnly = false;
        document.getElementById('tk-kontribusi').classList.remove('bg-gray-100', 'cursor-not-allowed');

        document.getElementById('tk-judul').value = "";
        document.getElementById('tk-desc').value = "";
        document.getElementById('tk-desc').style.height = 'auto';
        document.getElementById('tk-tags-val').value = "";

        document.getElementById('tk-date').value = "";
        document.getElementById('tk-time').value = "";
        document.getElementById('tk-gtask').value = "False";

        if (document.getElementById('tk-col-w')) document.getElementById('tk-col-w').value = "";
        if (document.getElementById('tk-col-x')) document.getElementById('tk-col-x').value = "";
        populateTicketCustomerOptions("", "");

        let kontribusiInput = document.getElementById('tk-kontribusi');
        let isAutoKs = kontribusiInput && kontribusiInput.dataset.autoks === "true";
        let defaultProg = isAutoKs ? 1 : 0;
        document.getElementById('tk-prog-slider').value = defaultProg;
        document.getElementById('tk-prog-num').value = defaultProg;
        setTicketProgress(defaultProg);
        handleProgressKChange(defaultProg);
    } else {
        // Mode Edit: Load data baris dari ticketDataCache
        const rowData = ticketDataCache.find(r => String(r[0] || "").trim() === String(id).trim());
        if (rowData) {
            document.getElementById('tk-id').value = rowData[0] || id;

            // Kolom U: Nama Agen (Index 20)
            let agenName = rowData[20] || "";
            if (!agenName && rowData[19]) {
                agentMap.forEach((idA, nA) => { if (idA === rowData[19]) agenName = nA; });
            }
            document.getElementById('tk-agen').value = agenName;
            
            // Trigger agent change
            onTicketAgentChange(true);

            // Kolom T: ID Agen (Index 19)
            let idAgen = rowData[19] || document.getElementById('tk-id-agen').value;
            document.getElementById('tk-id-agen').value = idAgen;
            document.getElementById('tk-badge-id-agen').innerText = "ID: " + (idAgen || "-");

            // Kolom C: ID Area (Index 2)
            let idAreaVal = String(rowData[2] || "").trim();
            let areaSelect = document.getElementById('tk-id-area');
            if (idAreaVal && !Array.from(areaSelect.options).some(o => o.value === idAreaVal)) {
                let areaRow = areaDataCache.slice(1).find(r => String(r[0] || "").trim() === idAreaVal);
                let goal = areaRow ? (areaRow[3] || areaRow[2] || idAreaVal) : idAreaVal;
                let akun = areaRow ? String(areaRow[1] || "").trim() : "";
                let label = akun ? `[${akun}] ${goal} (${idAreaVal})` : `${goal} (${idAreaVal})`;
                let opt = document.createElement('option');
                opt.value = idAreaVal;
                opt.innerText = label;
                areaSelect.appendChild(opt);
            }
            areaSelect.value = idAreaVal;
            areaSelect.disabled = false;
            areaSelect.classList.remove('bg-gray-100', 'cursor-not-allowed');

            // Kolom L: Tags (Index 11)
            const hTicket = ticketDataCache[0] || [];
            let idxL = getColIndex(hTicket, "Tags") > -1 ? getColIndex(hTicket, "Tags") : 11;
            document.getElementById('tk-tags-val').value = rowData[idxL] !== undefined ? rowData[idxL] : (rowData[11] || "");

            // Kolom K: % Progress (Index 10) - Tangani format desimal koma misal "0,5" -> 50%
            let idxK = getColIndex(hTicket, "Prog Task");
            if (idxK === -1) idxK = getColIndex(hTicket, "% Progress");
            if (idxK === -1) idxK = getColIndex(hTicket, "Progress");
            if (idxK === -1) idxK = getColIndex(hTicket, "Prog");
            if (idxK === -1) idxK = 10;

            let rawProg = rowData[idxK] !== undefined ? rowData[idxK] : rowData[10];
            let progStr = String(rawProg !== undefined && rawProg !== null ? rawProg : "0").trim();
            let safeProgStr = progStr.replace(',', '.').replace('%', '').trim();
            let numProg = parseFloat(safeProgStr);
            if (!isNaN(numProg)) {
                if (numProg > 0 && numProg <= 1 && !progStr.includes('%')) {
                    numProg = numProg * 100;
                }
            } else {
                numProg = 0;
            }
            let pVal = Math.min(100, Math.max(0, Math.round(numProg)));

            // Trigger area change dengan membawa initial pVal
            onTicketAreaChange(true, pVal);

            // Kolom B: Akun (Index 1)
            let idxB = getColIndex(hTicket, "Akun") > -1 ? getColIndex(hTicket, "Akun") : 1;
            let akunVal = rowData[idxB] !== undefined ? rowData[idxB] : (rowData[1] || document.getElementById('tk-akun').value);
            document.getElementById('tk-akun').value = akunVal;
            document.getElementById('tk-badge-akun').innerText = "Akun: " + (akunVal || "-");

            // Kolom W (Index 22) & Kolom X (Index 23)
            let idxW = getColIndex(hTicket, "ID Costumer") > -1 ? getColIndex(hTicket, "ID Costumer") : 22;
            let idxX = getColIndex(hTicket, "Nama Costumer") > -1 ? getColIndex(hTicket, "Nama Costumer") : 23;
            let valW = rowData[idxW] !== undefined ? String(rowData[idxW] || "").trim() : (String(rowData[22] || "").trim());
            let valX = rowData[idxX] !== undefined ? String(rowData[idxX] || "").trim() : (String(rowData[23] || "").trim());
            if (document.getElementById('tk-col-w')) document.getElementById('tk-col-w').value = valW;
            if (document.getElementById('tk-col-x')) document.getElementById('tk-col-x').value = valX;
            populateTicketCustomerOptions(valW, valX);

            // Kolom G: Nama Project (Index 6)
            let idxG = getColIndex(hTicket, "Project") > -1 ? getColIndex(hTicket, "Project") : (getColIndex(hTicket, "Nama Project") > -1 ? getColIndex(hTicket, "Nama Project") : 6);
            document.getElementById('tk-judul').value = rowData[idxG] !== undefined ? rowData[idxG] : (rowData[6] || "");

            // Kolom H: Deskripsi Project (Index 7)
            let idxH = getColIndex(hTicket, "Deskripsi") > -1 ? getColIndex(hTicket, "Deskripsi") : 7;
            document.getElementById('tk-desc').value = rowData[idxH] !== undefined ? rowData[idxH] : (rowData[7] || "");
            setTimeout(() => { autoResizeTicketTextarea(document.getElementById('tk-desc')); }, 50);

            // Set progress visual & input slider
            setTicketProgress(pVal);
            document.getElementById('tk-prog-slider').value = pVal;
            document.getElementById('tk-prog-num').value = pVal;

            if (pVal === 0) {
                document.getElementById('tk-kontribusi').value = "";
                document.getElementById('tk-date').value = "";
                document.getElementById('tk-time').value = "";
                handleProgressKChange(0);
            } else {
                // Kolom M: Kontribusi (Index 12)
                let idxM = getColIndex(hTicket, "Kontribusi") > -1 ? getColIndex(hTicket, "Kontribusi") : 12;
                let kontribusiInput = document.getElementById('tk-kontribusi');
                if (kontribusiInput.dataset.autoks === "true") {
                    kontribusiInput.value = (pVal / 100);
                } else {
                    let existingM = rowData[idxM] !== undefined ? rowData[idxM] : rowData[12];
                    kontribusiInput.value = (existingM !== undefined && existingM !== null && existingM !== "") ? existingM : "";
                }

                // Kolom P & Q: Deadline (Index 15 & 16)
                let idxP = getColIndex(hTicket, "Deadline") > -1 ? getColIndex(hTicket, "Deadline") : (getColIndex(hTicket, "Tgl Deadline") > -1 ? getColIndex(hTicket, "Tgl Deadline") : 15);
                let idxQ = getColIndex(hTicket, "Time") > -1 ? getColIndex(hTicket, "Time") : (getColIndex(hTicket, "Jam") > -1 ? getColIndex(hTicket, "Jam") : 16);

                document.getElementById('tk-date').value = _parseDateForInput(rowData[idxP] !== undefined ? rowData[idxP] : rowData[15]) || todayStr;
                let rawQTime = rowData[idxQ] !== undefined ? rowData[idxQ] : rowData[16];
                let parsedTaskTime = _parseTimeForInput(rawQTime);
                if (!parsedTaskTime && selectedAreaId && areaDataCache && areaDataCache.length > 1) {
                    let areaRow = areaDataCache.slice(1).find(r => String(r[0] || "").trim() === String(selectedAreaId).trim());
                    if (areaRow) {
                        let hArea = areaDataCache[0] || [];
                        let idxUArea = getColIndex(hArea, "Time Loop") > -1 ? getColIndex(hArea, "Time Loop") : (getColIndex(hArea, "Time") > -1 ? getColIndex(hArea, "Time") : 20);
                        let rawTimeLoop = areaRow[idxUArea] !== undefined ? areaRow[idxUArea] : areaRow[20];
                        parsedTaskTime = _parseTimeForInput(rawTimeLoop);
                    }
                }
                document.getElementById('tk-time').value = parsedTaskTime || timePlus1Str;

                handleProgressKChange(pVal);
            }

            // Kolom Z: GTask (Index 25)
            let idxZ = getColIndex(hTicket, "Update Gtask") > -1 ? getColIndex(hTicket, "Update Gtask") : (getColIndex(hTicket, "Gtask") > -1 ? getColIndex(hTicket, "Gtask") : 25);
            let rawZ = String(rowData[idxZ] !== undefined ? rowData[idxZ] : (rowData[25] || "")).trim();
            document.getElementById('tk-gtask').value = (rawZ.toLowerCase() === "true") ? "True" : "False";
        }

    // --- PENANGANAN SUB-TASK & BANNER REFERENSI ---
    const parentBanner = document.getElementById('tk-parent-banner');
    const btnAddSubtask = document.getElementById('btn-add-subtask');
    const subtasksContainer = document.getElementById('tk-subtasks-container');
    const subtasksList = document.getElementById('tk-subtasks-list');
    const subtasksBadgeCount = document.getElementById('tk-subtasks-badge-count');

    let currentTaskRow = (isEdit && id && ticketDataCache && ticketDataCache.length > 1) ? ticketDataCache.find(r => String(r[0] || "").trim() === String(id).trim()) : null;
    let parentId = currentTaskRow ? String(currentTaskRow[9] || "").trim() : "";
    if (document.getElementById('tk-parent-id')) document.getElementById('tk-parent-id').value = parentId;

    let progSlider = document.getElementById('tk-prog-slider');
    let progNum = document.getElementById('tk-prog-num');
    if (progSlider) progSlider.disabled = false;
    if (progNum) progNum.readOnly = false;

    if (isEdit && parentId) {
        // Task yang sedang dibuka adalah SUB-TASK (Parent Task ID terisi) -> Progress selalu bisa diisi manual
        if (progSlider) { progSlider.disabled = false; progSlider.classList.remove('cursor-not-allowed', 'opacity-80'); }
        if (progNum) { progNum.disabled = false; progNum.readOnly = false; progNum.classList.remove('bg-gray-100', 'cursor-not-allowed'); }

        let areaWrapper = document.getElementById('tk-area-wrapper');
        if (areaWrapper) areaWrapper.classList.add('hidden');
        let kontribusiWrapper = document.getElementById('tk-kontribusi-area-p-wrapper');
        if (kontribusiWrapper) kontribusiWrapper.classList.add('hidden');
        let tagsContainer = document.getElementById('tk-tags-container');
        if (tagsContainer) tagsContainer.classList.add('hidden');
        document.getElementById('tk-subfields-container').classList.remove('hidden');

        if (parentBanner) {
            parentBanner.classList.remove('hidden');
            let parentRow = ticketDataCache.find(r => String(r[0] || "").trim() === String(parentId).trim());
            let parentTitle = parentRow ? (parentRow[6] || `ID #${parentId}`) : `ID #${parentId}`;
            document.getElementById('tk-parent-title').innerText = parentTitle;
            document.getElementById('btn-open-parent-task').onclick = function() { openTicketForm(parentId); };
        }
        if (subtasksContainer) subtasksContainer.classList.add('hidden');
        if (btnAddSubtask) btnAddSubtask.classList.add('hidden');
    } else {
        // Task Utama (bukan Sub-Task)
        let areaWrapper = document.getElementById('tk-area-wrapper');
        if (areaWrapper) areaWrapper.classList.remove('hidden');

        if (parentBanner) parentBanner.classList.add('hidden');

        // Cari seluruh sub-task yang menginduk pada task ini
        let childSubtasks = [];
        if (isEdit && id && ticketDataCache && ticketDataCache.length > 1) {
            const hTicket = ticketDataCache[0] || [];
            let idxG = getColIndex(hTicket, "Project") > -1 ? getColIndex(hTicket, "Project") : 6;
            let idxK = getColIndex(hTicket, "Prog Task") > -1 ? getColIndex(hTicket, "Prog Task") : 10;
            let idxH = getColIndex(hTicket, "Deskripsi") > -1 ? getColIndex(hTicket, "Deskripsi") : 7;
            let idxR = getColIndex(hTicket, "Status") > -1 ? getColIndex(hTicket, "Status") : 17;
            let idxP = getColIndex(hTicket, "Deadline") > -1 ? getColIndex(hTicket, "Deadline") : (getColIndex(hTicket, "Tgl Deadline") > -1 ? getColIndex(hTicket, "Tgl Deadline") : 15);
            let idxU = getColIndex(hTicket, "Nama Agen") > -1 ? getColIndex(hTicket, "Nama Agen") : 20;

            const monthShort = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

            ticketDataCache.slice(1).forEach(r => {
                let rParentId = String(r[9] || "").trim();
                if (rParentId === String(id).trim()) {
                    let rProgRaw = r[idxK] !== undefined ? r[idxK] : r[10];
                    let rProgStr = String(rProgRaw !== undefined && rProgRaw !== null ? rProgRaw : "0").trim().replace(',', '.').replace('%', '');
                    let rProgNum = parseFloat(rProgStr) || 0;
                    if (rProgNum > 0 && rProgNum <= 1 && !String(rProgRaw).includes('%')) rProgNum = rProgNum * 100;
                    rProgNum = Math.min(100, Math.max(0, Math.round(rProgNum)));

                    let rawDeadline = r[idxP] !== undefined ? r[idxP] : (r[15] || "");
                    let deadlineTs = Infinity;
                    let deadlineLabel = "-";
                    if (rawDeadline && String(rawDeadline).trim() !== "" && String(rawDeadline).trim() !== "-") {
                        let parsedIso = (typeof _parseDateForInput === 'function') ? _parseDateForInput(rawDeadline) : "";
                        let dObj = parsedIso ? new Date(parsedIso + "T00:00:00") : new Date(rawDeadline);
                        if (!isNaN(dObj.getTime())) {
                            deadlineTs = dObj.getTime();
                            let yy = String(dObj.getFullYear()).slice(-2);
                            let mmm = monthShort[dObj.getMonth()] || String(dObj.getMonth() + 1).padStart(2, '0');
                            let dd = String(dObj.getDate()).padStart(2, '0');
                            deadlineLabel = `${yy}-${mmm}-${dd}`;
                        } else {
                            deadlineLabel = String(rawDeadline).trim();
                        }
                    }

                    let namaAgen = String(r[idxU] !== undefined ? r[idxU] : (r[20] || "-")).trim() || "-";

                    childSubtasks.push({
                        id: r[0],
                        project: r[idxG] || r[6] || "Sub-Task",
                        prog: rProgNum,
                        status: String(r[idxR] || r[17] || "Plan"),
                        deadlineLabel: deadlineLabel,
                        deadlineTs: deadlineTs,
                        agen: namaAgen
                    });
                }
            });

            // Pengurutan:
            // 1. Sub-task < 100% selalu di paling atas, yang 100% di bawah
            // 2. Diurutkan berdasarkan Deadline A-Z (terdekat/earliest di atas, tanpa deadline di bawah)
            childSubtasks.sort((a, b) => {
                let aDone = a.prog >= 100 ? 1 : 0;
                let bDone = b.prog >= 100 ? 1 : 0;
                if (aDone !== bDone) return aDone - bDone;
                return a.deadlineTs - b.deadlineTs;
            });
        }

        // Gabungkan sub-task yang sedang dalam proses sinkronisasi ke server (pending state)
        window.pendingSavingSubtasks = window.pendingSavingSubtasks || {};
        let parentPendingList = window.pendingSavingSubtasks[String(id).trim()] || [];
        parentPendingList = parentPendingList.filter(p => !childSubtasks.some(c => String(c.id).trim() === String(p.id).trim()));
        window.pendingSavingSubtasks[String(id).trim()] = parentPendingList;

        if (parentPendingList.length > 0) {
            let formattedPending = parentPendingList.map(p => ({
                id: p.id,
                project: p.project,
                prog: p.prog || 0,
                status: p.status || "Plan",
                deadlineLabel: p.deadlineLabel || "-",
                deadlineTs: -1,
                agen: p.agen || "-",
                isPending: true
            }));
            childSubtasks = [...formattedPending, ...childSubtasks];
        }

        if (childSubtasks.length > 0) {
            // Task Utama Memiliki Sub-Task -> Hide Checklist Tags (Kolom L)
            let tagsContainer = document.getElementById('tk-tags-container');
            if (tagsContainer) tagsContainer.classList.add('hidden');

            if (subtasksContainer) subtasksContainer.classList.remove('hidden');
            if (btnAddSubtask) btnAddSubtask.classList.remove('hidden');

            if (subtasksBadgeCount) subtasksBadgeCount.innerText = childSubtasks.length;

            // Render daftar sub-task: UI Elegan dengan loading spinner di paling atas untuk pending item
            let htmlList = childSubtasks.map(s => {
                let safeProj = escapeHtmlAttr(s.project);
                let safeAgen = escapeHtmlAttr(s.agen);
                let safeDeadline = escapeHtmlAttr(s.deadlineLabel);

                if (s.isPending) {
                    return `
                    <div id="subtask-pending-${s.id}" class="relative overflow-hidden p-2.5 bg-blue-50/90 border border-blue-200 rounded-xl flex items-center justify-between gap-2.5 shadow-2xs animate-pulse">
                        <div class="flex items-center gap-2.5 min-w-0 flex-1">
                            <div class="spinner-small border-blue-600 shrink-0"></div>
                            <div class="min-w-0 flex-1">
                                <div class="text-xs font-bold text-blue-950 truncate">${safeProj}</div>
                                <div class="text-[10px] text-blue-600 font-medium flex items-center gap-1.5 mt-0.5">
                                    <span>⏳ Menyinkronkan sub-task ke server...</span>
                                    <span class="text-gray-500 font-normal">[${safeAgen}]</span>
                                </div>
                            </div>
                        </div>
                        <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-lg bg-blue-100 text-blue-700 border border-blue-200 shrink-0">Sync...</span>
                    </div>
                    `;
                }

                let badgeClass = (s.prog >= 100)
                    ? 'bg-emerald-100 text-emerald-700 border-emerald-200'
                    : 'bg-indigo-100 text-indigo-700 border-indigo-200';

                return `
                <div onclick="openTicketForm('${s.id}')" class="relative overflow-hidden p-2.5 bg-white hover:bg-indigo-50/70 border border-gray-200 hover:border-indigo-300 rounded-xl transition-all flex items-start gap-2.5 shadow-2xs cursor-pointer">
                    <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-lg ${badgeClass} border shrink-0 mt-0.5">${s.prog}%</span>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-bold text-gray-800 leading-snug break-words">${safeProj}</div>
                        <div class="text-[10px] text-gray-500 mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                            <span class="font-semibold text-amber-700">📅 ${safeDeadline}</span>
                            <span class="text-gray-600 font-medium">[${safeAgen}]</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
            if (subtasksList) subtasksList.innerHTML = htmlList;

            // HITUNG RATA-RATA PROGRESS (AUTO-AVERAGE)
            let totalProg = 0;
            childSubtasks.forEach(s => { totalProg += s.prog; });
            let avgProg = Math.round(totalProg / childSubtasks.length);

            // Kunci (Lock) Input Progress Manual & Set nilai rata-rata (hanya jika Parent Task ID kosong)
            if (!parentId) {
                if (progSlider) progSlider.disabled = true;
                if (progNum) progNum.readOnly = true;
            }

            setTicketProgress(avgProg);
            document.getElementById('tk-prog-slider').value = avgProg;
            document.getElementById('tk-prog-num').value = avgProg;
            handleProgressKChange(avgProg);
            document.getElementById('tk-prog-badge').innerText = `${avgProg}% (Auto)`;
        } else {
            // Task Utama TIDAK Memiliki Sub-Task
            if (subtasksContainer) subtasksContainer.classList.add('hidden');
            if (btnAddSubtask && isEdit) btnAddSubtask.classList.remove('hidden');
            else if (btnAddSubtask) btnAddSubtask.classList.add('hidden');

            if (subtasksList) subtasksList.innerHTML = `<div class="text-[11px] text-gray-400 italic">Belum ada sub-task turunan.</div>`;
            if (subtasksBadgeCount) subtasksBadgeCount.innerText = "0";
        }
    }

    document.getElementById('ticket-input-modal').classList.remove('hidden');
}

    let dd = String(now.getDate()).padStart(2, '0');

    let idxX = getColIndex(hTicket, "Nama Costumer") > -1 ? getColIndex(hTicket, "Nama Costumer") : 23;

    document.getElementById('ticket-input-modal').classList.remove('hidden');

// 8c. Helper Form Quick Sub-Task & Submit
function toggleQuickSubtaskForm(show) {
    const box = document.getElementById('tk-quick-subtask-box');
    const input = document.getElementById('tk-quick-subtask-input');
    if (!box) return;
    
    let isHidden = box.classList.contains('hidden');
    let shouldShow = (typeof show === 'boolean') ? show : isHidden;
    
    if (shouldShow) {
        box.classList.remove('hidden');
        if (input) {
            input.value = '';
            setTimeout(() => input.focus(), 50);
        }
    } else {
        box.classList.add('hidden');
    }
}

function submitQuickSubtask() {
    const parentIdVal = document.getElementById('tk-id')?.value;
    const inputEl = document.getElementById('tk-quick-subtask-input');
    const titleVal = inputEl ? inputEl.value.trim() : "";
    
    if (!parentIdVal || parentIdVal === "NEW") {
        showToast("⚠️ Simpan Task Utama terlebih dahulu sebelum menambah sub-task!");
        return;
    }
    if (!titleVal) {
        showToast("⚠️ Tulis nama sub-task terlebih dahulu!");
        if (inputEl) inputEl.focus();
        return;
    }

    const parentRow = (typeof ticketDataCache !== 'undefined' && Array.isArray(ticketDataCache)) 
        ? ticketDataCache.find(r => String(r[0] || "").trim() === String(parentIdVal).trim()) 
        : null;
    if (!parentRow) {
        showToast("⚠️ Data Task Utama tidak ditemukan!");
        return;
    }

    // Generator ID Sub-task Baru: yyMMddhhmmss
    let now = new Date();
    let yy = String(now.getFullYear()).slice(-2);
    let mm = String(now.getMonth() + 1).padStart(2, '0');
    let dd = String(now.getDate()).padStart(2, '0');
    let hh = String(now.getHours()).padStart(2, '0');
    let m = String(now.getMinutes()).padStart(2, '0');
    let sec = String(now.getSeconds()).padStart(2, '0');
    let finalSubId = yy + mm + dd + hh + m + sec;
    let todayStr = `${now.getFullYear()}-${mm}-${dd}`;

    const hTicket = ticketDataCache[0] || [];
    let parentAkun = parentRow[getColIndex(hTicket, "Akun") > -1 ? getColIndex(hTicket, "Akun") : 1] || parentRow[1] || "";
    let parentAgen = parentRow[getColIndex(hTicket, "Nama Agen") > -1 ? getColIndex(hTicket, "Nama Agen") : 20] || parentRow[20] || "";
    let parentIdAgen = parentRow[getColIndex(hTicket, "ID Agen") > -1 ? getColIndex(hTicket, "ID Agen") : 19] || parentRow[19] || "";
    let parentCostumerW = parentRow[getColIndex(hTicket, "ID Costumer") > -1 ? getColIndex(hTicket, "ID Costumer") : 22] || parentRow[22] || "";
    let parentCostumerX = parentRow[getColIndex(hTicket, "Nama Costumer") > -1 ? getColIndex(hTicket, "Nama Costumer") : 23] || parentRow[23] || "";

    let payloadArray = new Array(30).fill(null);
    payloadArray[0] = finalSubId;
    payloadArray[1] = parentAkun;
    payloadArray[2] = ""; // Bebas KPI Area
    payloadArray[6] = `[Sub] ${titleVal}`;
    payloadArray[7] = `Sub-task dari: ${parentRow[6] || parentIdVal}`;
    payloadArray[8] = "Plan";
    payloadArray[9] = parentIdVal; // Parent Task ID
    payloadArray[10] = "1%";
    payloadArray[11] = "";
    payloadArray[12] = 0;
    payloadArray[13] = todayStr;
    payloadArray[15] = todayStr;
    payloadArray[16] = `${hh}:${m}`;
    payloadArray[19] = parentIdAgen;
    payloadArray[20] = parentAgen;
    payloadArray[22] = parentCostumerW;
    payloadArray[23] = parentCostumerX;
    payloadArray[25] = "False";

    // Simpan ke state pending agar loading spinner langsung muncul di paling atas
    window.pendingSavingSubtasks = window.pendingSavingSubtasks || {};
    window.pendingSavingSubtasks[parentIdVal] = window.pendingSavingSubtasks[parentIdVal] || [];
    window.pendingSavingSubtasks[parentIdVal].unshift({
        id: finalSubId,
        project: `[Sub] ${titleVal}`,
        prog: 1,
        status: "Plan",
        deadlineLabel: todayStr,
        agen: parentAgen,
        isPending: true
    });

    // Sembunyikan quick form & reset input
    toggleQuickSubtaskForm(false);

    // Re-render subtask section di modal parent task tanpa menutup modal!
    openTicketForm(parentIdVal);

    showToast("⏳ Sub-task ditambahkan, menyinkronkan...");

    google.script.run
        .withSuccessHandler(function() {
            showToast("✅ Sub-task berhasil disimpan!");
            if (window.pendingSavingSubtasks && window.pendingSavingSubtasks[parentIdVal]) {
                window.pendingSavingSubtasks[parentIdVal] = window.pendingSavingSubtasks[parentIdVal].filter(item => String(item.id) !== String(finalSubId));
            }
            refreshTaskKpiDataSilent(function() {
                hideItemSpinner(finalSubId, 'task');
                const currentModalTaskId = document.getElementById('tk-id')?.value;
                const isModalOpen = !document.getElementById('ticket-input-modal').classList.contains('hidden');
                if (isModalOpen && String(currentModalTaskId) === String(parentIdVal)) {
                    openTicketForm(parentIdVal);
                }
            });
        })
        .withFailureHandler(function() {
            showToast("❌ Gagal menyimpan Sub-task.");
            if (window.pendingSavingSubtasks && window.pendingSavingSubtasks[parentIdVal]) {
                window.pendingSavingSubtasks[parentIdVal] = window.pendingSavingSubtasks[parentIdVal].filter(item => String(item.id) !== String(finalSubId));
            }
            hideItemSpinner(finalSubId, 'task');
            const currentModalTaskId = document.getElementById('tk-id')?.value;
            const isModalOpen = !document.getElementById('ticket-input-modal').classList.contains('hidden');
            if (isModalOpen && String(currentModalTaskId) === String(parentIdVal)) {
                openTicketForm(parentIdVal);
            }
        })
        .updateAreaTicketNative(SHEET_URL, "Ticket", finalSubId, 1, payloadArray);
}

// 9. Submit / Simpan Form Ticket ke Server
function submitTicketForm() {
    const btn = document.getElementById('btn-save-ticket');
    const idData = document.getElementById('tk-id').value.trim();
    const isEdit = (idData !== "" && !idData.startsWith("NEW") && ticketDataCache.some(r => String(r[0]).trim() === idData));

    // Validasi
    const agen = document.getElementById('tk-agen').value.trim();
    const idArea = document.getElementById('tk-id-area').value.trim();
    const judul = document.getElementById('tk-judul').value.trim();
    const parentIdVal = (document.getElementById('tk-parent-id')?.value || "").trim();
    const isSubtaskForm = parentIdVal !== "" || (document.getElementById('tk-parent-banner') && !document.getElementById('tk-parent-banner').classList.contains('hidden'));

    if (!agen) {
        showToast("⚠️ Silakan pilih Nama Agen!");
        document.getElementById('tk-agen').focus();
        return;
    }
    if (!idArea && !isSubtaskForm) {
        showToast("⚠️ Silakan pilih KPI / Area Terkait!");
        document.getElementById('tk-id-area').focus();
        return;
    }
    if (!judul) {
        showToast("⚠️ Nama Project (Kolom G) wajib diisi!");
        document.getElementById('tk-judul').focus();
        return;
    }

    btn.innerHTML = `<div class="flex items-center justify-center gap-2"><div class="spinner-small"></div><span>Menyimpan...</span></div>`;
    btn.disabled = true;

    // Ambil data baris lama jika edit
    const existingRow = isEdit ? ticketDataCache.find(r => String(r[0]).trim() === idData) : null;
    let payloadArray = existingRow ? [...existingRow] : new Array(30).fill(null);
    while (payloadArray.length < 30) payloadArray.push(null);

    // Tanggal hari ini
    let now = new Date();
    let yyyy = now.getFullYear();
    let mm = String(now.getMonth() + 1).padStart(2, '0');
    let dd = String(now.getDate()).padStart(2, '0');
    let todayStr = `${yyyy}-${mm}-${dd}`;

    // Generator ID Baru: yyMMddhhmmss jika belum ada
    let finalId = idData;
    if (!finalId || finalId === "NEW") {
        let yy = String(now.getFullYear()).slice(-2);
        let hh = String(now.getHours()).padStart(2, '0');
        let m = String(now.getMinutes()).padStart(2, '0');
        let sec = String(now.getSeconds()).padStart(2, '0');
        finalId = yy + mm + dd + hh + m + sec;
    }

    let progNum = parseInt(document.getElementById('tk-prog-val').value) || 0;
    let priorityVal = document.getElementById('tk-priority').value || "Plan";

    // PEMETAAN KOLOM RESMI (A s/d AD):
    // A (0): id = otomatis if-yymmddhhmmss
    payloadArray[0] = finalId;
    
    // B (1): Akun = otomatis lookup dari sheet area Kolom B
    payloadArray[1] = document.getElementById('tk-akun').value.trim();

    // C (2): id area
    payloadArray[2] = idArea;

    // D (3), E (4), F (5): JANGAN DIUPDATE
    payloadArray[3] = null;
    payloadArray[4] = null;
    payloadArray[5] = null;

    // G (6): Nama Project (Wajib Diisi)
    payloadArray[6] = judul;

    // H (7): Deskripsi Project
    payloadArray[7] = document.getElementById('tk-desc').value.trim();

    // I (8): Priority (Done / In Progress / Plan)
    payloadArray[8] = priorityVal;

    // J (9): Parent Task ID (Murni ID untuk Sub-Task, Kosong jika Main Task)
    payloadArray[9] = parentIdVal;

    // Z (25): Update Gtask (default: False)
    let gtaskVal = document.getElementById('tk-gtask').value;
    payloadArray[25] = (gtaskVal === "True") ? "True" : "False";

    // K (10): % progress
    payloadArray[10] = progNum + "%";

    // L (11): Tags
    payloadArray[11] = document.getElementById('tk-tags-val').value.trim();

    // M (12): Kontribusi (Angka) - Otomatis jika Kolom Q Area True, Manual jika False
    let rawM = document.getElementById('tk-kontribusi').value.trim();
    let valM = 0;
    if (rawM !== "") {
        let parsedM = parseFloat(String(rawM).replace(',', '.'));
        valM = isNaN(parsedM) ? rawM : parsedM;
    }
    payloadArray[12] = valM;

    // N (13): update otomatis tgl hari ini
    payloadArray[13] = todayStr;

    // O (14): Jangan diupdate
    payloadArray[14] = null;

    // P (15): Tgl deadline (mengizinkan tanggal lampau)
    let inputDate = document.getElementById('tk-date').value;
    payloadArray[15] = inputDate ? inputDate : (isEdit ? (existingRow[15] || "") : "");

    // Q (16): Time deadline
    payloadArray[16] = document.getElementById('tk-time').value;

    // R (17): Jangan diupdate
    payloadArray[17] = null;

    // S (18): update otomatis tgl hari ini HANYA jika Done / Kolom K 100%
    if (progNum === 100 || priorityVal.toLowerCase() === "done") {
        payloadArray[18] = todayStr;
    } else {
        payloadArray[18] = isEdit ? (existingRow[18] || "") : "";
    }

    // JIKA USER MENGISI ANGKA 0 PADA FORM KOLOM K:
    // Kolom M, P, Q, S dikosongkan value-nya (termasuk Z dan L)
    if (progNum === 0) {
        payloadArray[25] = "False"; // Kolom Z (Update GTask)
        payloadArray[11] = "";     // Kolom L (Tags)
        payloadArray[12] = "";     // Kolom M (Kontribusi)
        payloadArray[15] = "";     // Kolom P (Tgl Deadline)
        payloadArray[16] = "";     // Kolom Q (Jam Deadline)
        payloadArray[18] = "";     // Kolom S (Tgl Selesai)
    }

    // T (19): ID Agen
    payloadArray[19] = document.getElementById('tk-id-agen').value.trim();

    // U (20): Nama Agen
    payloadArray[20] = agen;

    // V s/d AD (21-29):
    payloadArray[21] = isEdit ? (existingRow[21] || null) : null; // V
    payloadArray[22] = (document.getElementById('tk-col-w')?.value || "").trim() || (isEdit ? (existingRow[22] || null) : null); // W: ID Costumer
    payloadArray[23] = (document.getElementById('tk-col-x')?.value || "").trim() || (isEdit ? (existingRow[23] || null) : null); // X: Nama Costumer
    for (let c = 24; c <= 29; c++) {
        if (c === 25) continue; // Skip index 25 (Kolom Z: Update Gtask) agar tidak tertimpa
        payloadArray[c] = isEdit ? (existingRow[c] || null) : null;
    }

    // Tentukan searchId untuk TextFinder di master:
    // Jika edit, gunakan finalId (ID di Kolom A). Jika baru, kirim finalId (akan di-append jika tidak ketemu)
    const searchId = isEdit ? idData : finalId;

    if (parentIdVal) {
        // PENANGANAN SUB-TASK: Jangan tutup modal edit parent task!
        window.pendingSavingSubtasks = window.pendingSavingSubtasks || {};
        window.pendingSavingSubtasks[parentIdVal] = window.pendingSavingSubtasks[parentIdVal] || [];
        window.pendingSavingSubtasks[parentIdVal] = window.pendingSavingSubtasks[parentIdVal].filter(item => String(item.id) !== String(finalId));
        window.pendingSavingSubtasks[parentIdVal].unshift({
            id: finalId,
            project: judul,
            prog: progNum,
            status: priorityVal,
            deadlineLabel: inputDate || "-",
            agen: agen,
            isPending: true
        });

        // Re-render modal edit ke Parent Task (menu edit tidak ditutup)
        openTicketForm(parentIdVal);
        btn.innerHTML = `Simpan Task`; btn.disabled = false;
        showItemSpinner(finalId, 'task', 'Menyimpan...', {
            contactId: String(payloadArray[22] || '').trim(),
            project: judul,
            isNew: !isEdit
        });

        showToast("⏳ Sub-task ditambahkan, menyinkronkan...");

        google.script.run
            .withSuccessHandler(function() {
                showToast("✅ Sub-task berhasil disimpan!");
                if (window.pendingSavingSubtasks && window.pendingSavingSubtasks[parentIdVal]) {
                    window.pendingSavingSubtasks[parentIdVal] = window.pendingSavingSubtasks[parentIdVal].filter(item => String(item.id) !== String(finalId));
                }
                refreshTaskKpiDataSilent(function() {
                    hideItemSpinner(finalId, 'task');
                    const currentModalTaskId = document.getElementById('tk-id')?.value;
                    const isModalOpen = !document.getElementById('ticket-input-modal').classList.contains('hidden');
                    if (isModalOpen && String(currentModalTaskId) === String(parentIdVal)) {
                        openTicketForm(parentIdVal);
                    }
                });
            })
            .withFailureHandler(function() {
                showToast("❌ Gagal menyimpan Sub-task.");
                if (window.pendingSavingSubtasks && window.pendingSavingSubtasks[parentIdVal]) {
                    window.pendingSavingSubtasks[parentIdVal] = window.pendingSavingSubtasks[parentIdVal].filter(item => String(item.id) !== String(finalId));
                }
                hideItemSpinner(finalId, 'task');
                const currentModalTaskId = document.getElementById('tk-id')?.value;
                const isModalOpen = !document.getElementById('ticket-input-modal').classList.contains('hidden');
                if (isModalOpen && String(currentModalTaskId) === String(parentIdVal)) {
                    openTicketForm(parentIdVal);
                }
            })
            .updateAreaTicketNative(SHEET_URL, "Ticket", searchId, 1, payloadArray);

        return;
    }

    // PENANGANAN MAIN TASK UTAMA: Tutup modal langsung & tampilkan spinner pada kartu spesifik tanpa memblokir UI global
    document.getElementById('ticket-input-modal').classList.add('hidden');
    btn.innerHTML = `Simpan Task`; btn.disabled = false;
    showItemSpinner(finalId, 'task', 'Menyimpan...', {
        contactId: String(payloadArray[22] || '').trim(),
        project: judul,
        isNew: !isEdit
    });

    google.script.run
        .withSuccessHandler(function() {
            showToast("✅ Task berhasil disimpan!");
            refreshTaskKpiDataSilent(function() {
                hideItemSpinner(finalId, 'task');
            });
        })
        .withFailureHandler(function() {
            showToast("❌ Gagal menyimpan Task.");
            hideItemSpinner(finalId, 'task');
        })
        .updateAreaTicketNative(SHEET_URL, "Ticket", searchId, 1, payloadArray);
}

// Helper: Ambil Opsi Unik khusus untuk sheet Area (agar dropdown dinamis)
function getAreaUniqueOptions(colIndex) {
    let options = new Set();
    areaDataCache.slice(1).forEach(row => {
        let val = String(row[colIndex] || "").trim();
        if (val && val !== "-") options.add(val);
    });
    return Array.from(options).sort();
}

// blok kode baru
// Helper: Vlookup ID Agen saat Nama Agen (Kolom O) dipilih
function autoFillAgenId() {
    let nama = document.getElementById('ar-agen-nama').value.trim();
    let idField = document.getElementById('ar-agen-id');
    
    // 1. Kosongkan ID terlebih dahulu agar jika nama dihapus/diganti, ID lama tidak nyangkut
    idField.value = "";
    
    // Hentikan fungsi jika kolom nama agen kosong
    if (nama === "") return;

    // 2. Cari di cache Kolom O / Index 14 (Nama Agen)
    // Gunakan toLowerCase() agar pencarian kebal terhadap perbedaan huruf besar/kecil
    let found = areaDataCache.slice(1).find(r => 
        String(r[14] || "").trim().toLowerCase() === nama.toLowerCase()
    );
    
    // 3. Jika cocok, otomatis isi Kolom N / Index 13 (ID Agen)
    if(found && found[13]) {
        idField.value = found[13];
    } else {
        // Fallback: Cari di Data Devices (Sheet Setting)
        let devices = window.globalRawDevicesMaster || (typeof deviceCache !== 'undefined' && deviceCache.length > 0 ? deviceCache : []);
        let dev = devices.find(d => {
            let pId = String(d.providerId || (d.fullRow ? d.fullRow[0] : "")).trim();
            return pId.toLowerCase() === nama.toLowerCase();
        });
        if (dev && dev.fullRow && dev.fullRow[6]) {
            idField.value = dev.fullRow[6];
        }
    }
}

function switchTaskKpiTab(tabName) {

    const kpiCol = document.getElementById('kpi-col');
    const btnTask = document.getElementById('tab-btn-task');
    const btnKpi = document.getElementById('tab-btn-kpi');

    const activeClasses = "flex-1 h-full flex flex-col items-center justify-center text-[#0055ff] active:scale-90 transition-all select-none cursor-pointer py-1 group";
    const inactiveClasses = "flex-1 h-full flex flex-col items-center justify-center text-gray-600 hover:text-[#0055ff] active:text-[#0055ff] active:scale-90 transition-all select-none cursor-pointer py-1 group";

    if (tabName === 'task') {
        if (taskCol) {
            taskCol.classList.remove('hidden');
            taskCol.classList.add('flex');
        }
        if (kpiCol) {
            kpiCol.classList.remove('flex');
            kpiCol.classList.add('hidden');
        }

        if (btnTask) btnTask.className = activeClasses;
        if (btnKpi) btnKpi.className = inactiveClasses;
    } else {
        if (kpiCol) {
            kpiCol.classList.remove('hidden');
            kpiCol.classList.add('flex');
        }
        if (taskCol) {
            taskCol.classList.remove('flex');
            taskCol.classList.add('hidden');
        }

        if (btnKpi) btnKpi.className = activeClasses;
        if (btnTask) btnTask.className = inactiveClasses;
    }
}

// PENYEMPURNAAN openAreaForm() DENGAN LOGIKA TOMBOL HAPUS
// =========================================================================
function openAreaForm(id = 'NEW') {
    const isEdit = (id !== 'NEW');
    document.getElementById('ar-id').value = id;
    document.getElementById('area-modal-title').innerHTML = isEdit ? `🎯 Edit KPI` : `🎯 Tambah KPI Baru`;

    // Tampilkan tombol hapus dan tombol Share WA hanya jika mode Edit
    const btnDelete = document.getElementById('btn-delete-area');
    const shareWrapper = document.getElementById('ar-share-wrapper');
    if (btnDelete) {
        if (isEdit) {
            btnDelete.classList.remove('hidden');
            if (shareWrapper) shareWrapper.classList.remove('hidden');
        } else {
            btnDelete.classList.add('hidden');
            if (shareWrapper) shareWrapper.classList.add('hidden');
        }
    }

    // Setup Dropdown/Combobox dengan Data Cache:
    // Akun (B) dari Sheet Setting B34:B, Nama Agen (O) dari Sheet Setting A34:A
    // Parameter false di akhir untuk menghilangkan pilihan "+ Tambah Baru"
    // [PERBAIKAN]: Memastikan fungsi getSettingAkunOptions dan getSettingAgenOptions tersedia di global context (di omniui_modals.html)
    const akunOpts = (typeof getSettingAkunOptions === 'function') ? getSettingAkunOptions() : [];
    const agenOpts = (typeof getSettingAgenOptions === 'function') ? getSettingAgenOptions() : [];
    
    // Fallback jika cache masih kosong (misal belum terinisialisasi)
    const finalAkunOpts = (akunOpts.length > 0) ? akunOpts : getAreaUniqueOptions(1);
    const finalAgenOpts = (agenOpts.length > 0) ? agenOpts : getAreaUniqueOptions(14);

    populateDropdown('ar-akun', finalAkunOpts, "", false);
    populateDropdown('ar-area', getAreaUniqueOptions(2), "");
    populateDropdown('ar-satuan-kd', getAreaUniqueOptions(8), "");
    populateDropdown('ar-agen-nama', finalAgenOpts, "", false);

    const setVal = (elmId, val) => document.getElementById(elmId).value = val;
    const _normalizeBool = (val) => {
        if (!val) return "False";
        let s = String(val).trim().toLowerCase();
        return (s === "true" || s === "1" || s === "ya" || s === "yes" || s === "on") ? "True" : "False";
    };

    if (!isEdit) {
        setVal('ar-akun', "");
        setVal('ar-area', "");
        setVal('ar-goal', "");
        setVal('ar-desc', "");
        setVal('ar-kd', "");
        setVal('ar-satuan-kd', "");
        setVal('ar-start', "");
        setVal('ar-deadline', "");
        setVal('ar-status', "In Progress");
        setVal('ar-agen-id', "");
        setVal('ar-agen-nama', "");
        setVal('ar-auto-ks', "False");
        setVal('ar-berulang', "False");
        setVal('ar-tags', "");
        setVal('ar-day-loop', "1");
        setVal('ar-time-loop', "");
    } else {
        const rowData = areaDataCache.find(r => r[0] === id);
        if(rowData) {
            populateDropdown('ar-akun', finalAkunOpts, rowData[1], false);
            populateDropdown('ar-area', getAreaUniqueOptions(2), rowData[2]); 
            setVal('ar-goal', rowData[3] || "");
            setVal('ar-desc', rowData[4] || "");
            setVal('ar-kd', rowData[7] || "");
            populateDropdown('ar-satuan-kd', getAreaUniqueOptions(8), rowData[8]);
            setVal('ar-start', _parseDateForInput(rowData[9]));
            setVal('ar-deadline', _parseDateForInput(rowData[10]));
            setVal('ar-status', rowData[12] || "In Progress");
            setVal('ar-agen-id', rowData[13] || "");
            populateDropdown('ar-agen-nama', finalAgenOpts, rowData[14], false);
            setVal('ar-auto-ks', _normalizeBool(rowData[16]));
            setVal('ar-berulang', _normalizeBool(rowData[17]));
            setVal('ar-tags', rowData[18] || "");
            setVal('ar-day-loop', rowData[19] || "1");
            let rawTimeLoop = rowData[20];
            let parsedTimeLoop = _parseTimeForInput(rawTimeLoop) || String(rawTimeLoop || "").trim();
            setVal('ar-time-loop', parsedTimeLoop);
        }
    }
    
    toggleBerulangFields();
    syncDayButtons(); // Render visual tombol hari
    renderKpiTagChips(); // Render visual tag chips
    document.getElementById('area-input-modal').classList.remove('hidden');
}

// Proses Simpan Data
function submitAreaForm() {
    const btn = document.getElementById('btn-save-area');
    const idData = document.getElementById('ar-id').value;

    // 1. VALIDASI WAJIB ISI DENGAN INTERAKSI VISUAL LENGKAP
    const requiredFields = [
        {id: 'ar-akun', name: 'Akun (B)'},
        {id: 'ar-area', name: 'Area (C)'},
        {id: 'ar-goal', name: 'Straight Goal (D)'},
        {id: 'ar-kd', name: 'KD (H)'},
        {id: 'ar-satuan-kd', name: 'Satuan KD (I)'},
        {id: 'ar-start', name: 'Start At (J)'},
        {id: 'ar-deadline', name: 'Deadline (K)'},
        {id: 'ar-status', name: 'Status (M)'},
        {id: 'ar-agen-nama', name: 'Nama Agen (O)'}
    ];

    // Helper untuk memberikan Toast Warning, Focus Auto-Scroll, dan Highlight Merah
    function highlightAndWarnField(el, message) {
        showToast("⚠️ " + message);
        if (el) {
            el.focus();
            if (typeof el.scrollIntoView === 'function') {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            // Efek highlight merah pada elemen input
            el.classList.add('border-red-500', 'ring-2', 'ring-red-400');
            setTimeout(() => {
                el.classList.remove('border-red-500', 'ring-2', 'ring-red-400');
            }, 3000);
        }
    }

    for (let f of requiredFields) {
        const el = document.getElementById(f.id);
        const val = el ? el.value.trim() : "";
        if (!val) {
            highlightAndWarnField(el, "Kolom " + f.name + " wajib diisi!");
            return;
        }
    }

    // Validasi Tanggal: Start At tidak boleh melewati tanggal Deadline
    const startVal = document.getElementById('ar-start').value;
    const deadlineVal = document.getElementById('ar-deadline').value;
    if (startVal && deadlineVal && new Date(startVal) > new Date(deadlineVal)) {
        highlightAndWarnField(document.getElementById('ar-start'), "Tanggal Start At tidak boleh melewati Deadline!");
        return;
    }

    // Validasi Khusus Mode Berulang (Recurring Mode)
    const isBerulang = document.getElementById('ar-berulang').value;
    if (isBerulang === "True") {
        const tagsEl = document.getElementById('ar-tags');
        const dayLoopEl = document.getElementById('ar-day-loop');
        const timeLoopEl = document.getElementById('ar-time-loop');

        if (!tagsEl || !tagsEl.value.trim()) {
            highlightAndWarnField(tagsEl, "Mode Berulang ON! Kolom Tags (S) wajib diisi.");
            return;
        }
        if (!dayLoopEl || !dayLoopEl.value.trim()) {
            const dayContainer = document.getElementById('day-selector-container');
            highlightAndWarnField(dayContainer || dayLoopEl, "Mode Berulang ON! Silakan pilih minimal 1 hari pada Day Loop (T).");
            return;
        }
        if (!timeLoopEl || !timeLoopEl.value.trim()) {
            highlightAndWarnField(timeLoopEl, "Mode Berulang ON! Kolom Time Loop (U) wajib diisi.");
            return;
        }
    }

    btn.innerHTML = `<div class="flex items-center justify-center gap-2"><div class="spinner-small"></div><span>Menyimpan...</span></div>`;
    btn.disabled = true;

    // 2. MAPPING KE PAYLOAD ARRAY
    const existingRow = (idData !== "NEW") ? areaDataCache.find(r => r[0] === idData) : null;
    let payloadArray = existingRow ? [...existingRow] : new Array(21).fill("");
    while(payloadArray.length < 21) payloadArray.push("");
    
    // Generator ID Baru (YYMMDDhhmmss)
    if (idData === "NEW") {
        let d = new Date();
        let yy = String(d.getFullYear()).slice(-2);
        let mm = String(d.getMonth() + 1).padStart(2, '0');
        let dd = String(d.getDate()).padStart(2, '0');
        let hh = String(d.getHours()).padStart(2, '0');
        let min = String(d.getMinutes()).padStart(2, '0');
        let sec = String(d.getSeconds()).padStart(2, '0');
        payloadArray[0] = yy + mm + dd + hh + min + sec;
    } else {
        payloadArray[0] = idData;
    }
    
    payloadArray[1] = document.getElementById('ar-akun').value.trim();
    payloadArray[2] = document.getElementById('ar-area').value.trim();
    payloadArray[3] = document.getElementById('ar-goal').value.trim();
    payloadArray[4] = document.getElementById('ar-desc').value.trim();
    
    // PERLINDUNGAN FORMULA SPREADSHEET:
    // Kolom F (index 5), Kolom G (index 6), Kolom L (index 11), dan Kolom P (index 15) tidak boleh diisi value apapun (Read-Only)
    payloadArray[5] = null; // Kolom F
    payloadArray[6] = null; // Kolom G
    
    payloadArray[7] = document.getElementById('ar-kd').value.trim();
    payloadArray[8] = document.getElementById('ar-satuan-kd').value.trim();
    payloadArray[9] = document.getElementById('ar-start').value;
    payloadArray[10] = document.getElementById('ar-deadline').value;
    payloadArray[11] = null; // Kolom L (Read-Only / Formula Spreadsheet)
    payloadArray[12] = document.getElementById('ar-status').value;
    payloadArray[13] = document.getElementById('ar-agen-id').value.trim();
    payloadArray[14] = document.getElementById('ar-agen-nama').value.trim();
    
    payloadArray[15] = null; // Kolom P
    
    payloadArray[16] = document.getElementById('ar-auto-ks').value;
    payloadArray[17] = isBerulang;
    payloadArray[18] = document.getElementById('ar-tags').value.trim();
    payloadArray[19] = document.getElementById('ar-day-loop').value;
    payloadArray[20] = document.getElementById('ar-time-loop').value;

    // 3. KIRIM KE SCRIPT NATIVE
    const kpiId = payloadArray[0];
    document.getElementById('area-input-modal').classList.add('hidden');
    btn.innerHTML = `Simpan KPI`; btn.disabled = false;
    showItemSpinner(kpiId, 'kpi', 'Menyimpan...');

    google.script.run
        .withSuccessHandler(function(res) {
            if(res && res.includes("success")) {
                showToast("✅ KPI berhasil disimpan!");
                refreshTaskKpiDataSilent(function() {
                    hideItemSpinner(kpiId, 'kpi');
                });
            } else {
                showToast("❌ Gagal menyimpan KPI.");
                hideItemSpinner(kpiId, 'kpi');
            }
        })
        .withFailureHandler(function() {
            showToast("❌ Eror Jaringan. Gagal menyimpan KPI.");
            hideItemSpinner(kpiId, 'kpi');
        })
        .updateAreaTicketNative(SHEET_URL, "Area", payloadArray[0], 1, payloadArray);
}

// FUNGSI SINKRONISASI VISUAL TOMBOL HARI BERDASARKAN INPUT
function syncDayButtons() {
    const dayInput = document.getElementById('ar-day-loop');
    const dayButtons = document.querySelectorAll('.day-btn');
    
    if (!dayInput) return;

    // Pecah string "1, 5" menjadi array ["1", "5"] dan bersihkan spasi
    let currentVals = dayInput.value.split(',').map(s => s.trim()).filter(Boolean);
    
    dayButtons.forEach(btn => {
        const val = btn.getAttribute('data-val');
        if (currentVals.includes(val)) {
            // Jika angka ada di input, nyalakan tombol (kuning)
            btn.classList.remove('text-gray-500', 'bg-white', 'border-gray-200');
            btn.classList.add('bg-yellow-600', 'text-white', 'border-yellow-600');
        } else {
            // Jika tidak ada, matikan tombol (abu-abu)
            btn.classList.remove('bg-yellow-600', 'text-white', 'border-yellow-600');
            btn.classList.add('text-gray-500', 'bg-white', 'border-gray-200');
        }
    });
}

// EVENT LISTENER KLIK TOMBOL HARI
document.addEventListener('DOMContentLoaded', () => {
    const dayButtons = document.querySelectorAll('.day-btn');
    const dayInput = document.getElementById('ar-day-loop');

    dayButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const val = this.getAttribute('data-val');

            let currentVals = dayInput.value.split(',').map(s => s.trim()).filter(Boolean);
            
            // Toggle On/Off
            if (currentVals.includes(val)) {
                currentVals = currentVals.filter(d => d !== val); // Hapus jika sudah ada
            } else {
                currentVals.push(val); // Tambah jika belum ada
            }

            currentVals.sort((a, b) => parseInt(a) - parseInt(b));
            
            // Kembalikan ke format string "1, 5" dan simpan
            dayInput.value = currentVals.join(', ');
