<script>
    if (!localStorage.getItem('omni_user')) {
        document.getElementById('login-modal').classList.remove('hidden');
    }

// Global Set untuk melacak item Task / KPI yang sedang dalam proses penyimpanan/penghapusan
window.pendingSavingTaskIds = window.pendingSavingTaskIds || new Set();
window.pendingSavingKpiIds = window.pendingSavingKpiIds || new Set();
window.pendingSavingTaskMeta = window.pendingSavingTaskMeta || {};
window.pendingSavingSubtasks = window.pendingSavingSubtasks || {};

// Helper: Tampilkan spinner lokal pada kartu Task / KPI spesifik
function showItemSpinner(itemId, type = 'task', message = 'Menyimpan...', meta = null) {
    if (!itemId) return;
    const strId = String(itemId);
    if (type === 'task') {
        window.pendingSavingTaskIds.add(strId);
        if (meta && typeof meta === 'object') {
            window.pendingSavingTaskMeta[strId] = Object.assign({}, meta, { message: message });
        }
    } else {
        window.pendingSavingKpiIds.add(strId);
    }

    const cardEl = document.getElementById(type === 'task' ? `task-card-${strId}` : `kpi-card-${strId}`);
    if (cardEl) {
        cardEl.classList.add('relative');
        let existingOverlay = cardEl.querySelector('.item-saving-spinner-overlay');
        if (!existingOverlay) {
            const overlay = document.createElement('div');
            overlay.className = 'item-saving-spinner-overlay absolute inset-0 bg-white/85 backdrop-blur-[1px] rounded-lg z-20 flex items-center justify-center gap-2 text-xs font-bold text-blue-600 shadow-sm transition-all';
            overlay.innerHTML = `<div class="spinner-small border-blue-600"></div><span>${message}</span>`;
            cardEl.appendChild(overlay);
        }
    }

    if (type === 'task') {
        if (typeof updateCustomerTaskBadge === 'function') updateCustomerTaskBadge();
        const modalTask = document.getElementById('customer-task-list-modal');
        if (modalTask && !modalTask.classList.contains('hidden') && typeof openCustomerTaskListPopup === 'function') {
            openCustomerTaskListPopup();
        }
    }
}

// Helper: Sembunyikan spinner lokal dari kartu Task / KPI spesifik
function hideItemSpinner(itemId, type = 'task') {
    if (!itemId) return;
    const strId = String(itemId);
    if (type === 'task') {
        window.pendingSavingTaskIds.delete(strId);
        delete window.pendingSavingTaskMeta[strId];
    } else {
        window.pendingSavingKpiIds.delete(strId);
    }

    const cardEl = document.getElementById(type === 'task' ? `task-card-${strId}` : `kpi-card-${strId}`);
    if (cardEl) {
        const overlay = cardEl.querySelector('.item-saving-spinner-overlay');
        if (overlay) overlay.remove();
    }

    if (type === 'task') {
        if (typeof updateCustomerTaskBadge === 'function') updateCustomerTaskBadge();
        const modalTask = document.getElementById('customer-task-list-modal');
        if (modalTask && !modalTask.classList.contains('hidden') && typeof openCustomerTaskListPopup === 'function') {
            openCustomerTaskListPopup();
        }
    }
}

// Helper: Ambil state UI (accordions terbuka & posisi scroll)
function captureTaskKpiDashboardState() {
    const openAccordions = new Set();
    document.querySelectorAll('.agent-task-body, .agent-kpi-body').forEach(el => {
        if (!el.classList.contains('hidden')) {
            openAccordions.add(el.id);
        }
    });

    const scrollToday = document.getElementById('ui-col-today')?.scrollTop || 0;
    const scrollKpi = document.getElementById('ui-col-kpi')?.scrollTop || 0;
    const scrollBody = document.getElementById('task-dashboard-body')?.scrollTop || 0;

    return { openAccordions, scrollToday, scrollKpi, scrollBody };
}

// Helper: Kembalikan state UI (accordions & scroll)
function restoreTaskKpiDashboardState(state) {
    if (!state) return;

    if (state.openAccordions && state.openAccordions.size > 0) {
        state.openAccordions.forEach(id => {
            const bodyEl = document.getElementById(id);
            if (bodyEl) {
                bodyEl.classList.remove('hidden');
                let cleanId = id.replace('body-agent-task-', '').replace('body-agent-kpi-', '');
                let isTask = id.startsWith('body-agent-task-');
                let prefix = isTask ? 'icon-agent-task-' : 'icon-agent-kpi-';
                let textPrefix = isTask ? 'text-agent-task-' : 'text-agent-kpi-';
                let iconEl = document.getElementById(prefix + cleanId);
                let textEl = document.getElementById(textPrefix + cleanId);
                if (iconEl) iconEl.style.transform = 'rotate(180deg)';
                if (textEl) textEl.textContent = 'Tutup';
            }
        });
    }

    if (state.scrollToday) {
        const elToday = document.getElementById('ui-col-today');
        if (elToday) elToday.scrollTop = state.scrollToday;
    }
    if (state.scrollKpi) {
        const elKpi = document.getElementById('ui-col-kpi');
        if (elKpi) elKpi.scrollTop = state.scrollKpi;
    }
    if (state.scrollBody) {
        const elBody = document.getElementById('task-dashboard-body');
        if (elBody) elBody.scrollTop = state.scrollBody;
    }
}

// Helper: Refresh Data Task & KPI secara senyap di background (tanpa showGlobalLoading & tanpa ubah tab)
function refreshTaskKpiDataSilent(onComplete) {
    const savedState = captureTaskKpiDashboardState();

    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.status === "success") {
                areaDataCache = res.area || [];
                ticketDataCache = res.ticket || [];
                populateTaskKpiFilterOptions();
                renderTaskDashboard();
                restoreTaskKpiDashboardState(savedState);
                if (typeof updateCustomerTaskBadge === 'function') updateCustomerTaskBadge();
                if (typeof renderSidebar === 'function') renderSidebar();
            }
            if (typeof onComplete === 'function') onComplete(true);
        })
        .withFailureHandler(function(err) {
            if (typeof onComplete === 'function') onComplete(false);
        })
        .getAreaTicketDataNative(SHEET_URL, (userAllowedAccounts || []).join(','));
}

// 2. PERBAIKAN BUKA & TUTUP MODAL TASK
// Cari fungsi openTaskDashboard, dan ganti / tambahkan kode ini:
function openTaskDashboard() {
    document.getElementById('task-dashboard-modal').classList.remove('hidden');
    switchTaskKpiTab('task');
    
    // [BLOK KODE BARU]: Injeksi History State agar tombol Back HP berfungsi
    window.history.pushState({ page: 'task' }, "", "#task");

    // Cek apakah data sudah ada di Cache
    if(areaDataCache.length === 0 || ticketDataCache.length === 0) {
        showGlobalLoading("Memuat Workspace...", "Menarik data KPI dan Tugas dari server.");

        google.script.run
            .withSuccessHandler(function(res) {
                hideGlobalLoading();
                if (res.status === "success") {
                    areaDataCache = res.area;
                    ticketDataCache = res.ticket;
                    populateTaskKpiFilterOptions();
                    renderTaskDashboard();
                } else {
                    showToast("❌ Gagal memuat data: " + res.message);
                }
            })
            .withFailureHandler(function(err) {
                hideGlobalLoading();
                showToast("❌ Error Koneksi Server.");
            })
            .getAreaTicketDataNative(SHEET_URL, (userAllowedAccounts || []).join(','));
    } else {
        populateTaskKpiFilterOptions();
        renderTaskDashboard();
    }
}

// [BLOK KODE BARU]: Tambahkan fungsi khusus untuk menutup Task Modal
function closeTaskDashboard() {
    document.getElementById('task-dashboard-modal').classList.add('hidden');
    if (window.location.hash === '#task') window.history.back(); // Kembalikan URL ke #dashboard
}

function switchTaskToFinance() {
    document.getElementById('task-dashboard-modal').classList.add('hidden');
    if (window.location.hash === '#task') {
        window.history.replaceState({ page: 'dashboard' }, "", "#dashboard");
    }
    openFinancePanel();
}

function closeTaskKpiFilterModal() {

function resetTaskKpiFilter() {
    const s = document.getElementById('task-filter-search');
    const sm = document.getElementById('task-filter-search-mobile');
    const a = document.getElementById('task-filter-agen');
    const ak = document.getElementById('task-filter-akun');
    const kpi = document.getElementById('task-filter-kpi');
    if (s) s.value = '';
    if (sm) sm.value = '';
    if (a) a.value = '';
    if (ak) ak.value = '';
    if (kpi) kpi.value = '';

function filterByKpiId(kpiId) {
    if (!kpiId) return;
    const selectKpi = document.getElementById('task-filter-kpi');
    if (!selectKpi) return;

    let targetId = String(kpiId).trim();
    if (selectKpi.value === targetId) {
        selectKpi.value = '';
        if (typeof showToast === 'function') showToast("ℹ️ Filter KPI dibersihkan.");
    } else {
        selectKpi.value = targetId;
        if (typeof showToast === 'function') showToast("🎯 Memfilter Workspace berdasarkan KPI: " + targetId);
    }
    applyTaskKpiFilter();
}

function syncTaskKpiData() {
    const syncBtns = [document.getElementById('btn-sync-task-kpi'), document.getElementById('btn-sync-task-kpi-mobile')].filter(Boolean);
    const syncIcons = [document.getElementById('icon-sync-task-kpi'), document.getElementById('icon-sync-task-kpi-mobile')].filter(Boolean);
    
    syncBtns.forEach(btn => {
        btn.disabled = true;
        btn.classList.add('opacity-75', 'cursor-not-allowed');
    });
    syncIcons.forEach(icon => {
        icon.classList.add('animate-spin');
    });

    showGlobalLoading("Sinkronisasi Workspace...", "Menarik data KPI dan Task terbaru dari server.");

    google.script.run
        .withSuccessHandler(function(res) {
            hideGlobalLoading();
            syncBtns.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            });
            syncIcons.forEach(icon => {
                icon.classList.remove('animate-spin');
            });

            if (res && res.status === "success") {
                areaDataCache = res.area || [];
                ticketDataCache = res.ticket || [];
                populateTaskKpiFilterOptions();
                renderTaskDashboard();
                showToast("✅ Data Task & KPI berhasil disinkronkan!");
            } else {
                showToast("❌ Gagal me-refresh data: " + (res ? res.message : "Response kosong"));
            }
        })
        .withFailureHandler(function(err) {
            hideGlobalLoading();
            syncBtns.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            });
            syncIcons.forEach(icon => {
                icon.classList.remove('animate-spin');
            });
            showToast("❌ Error Koneksi Server saat me-refresh data.");
        })
        .getAreaTicketDataNative(SHEET_URL, (userAllowedAccounts || []).join(','));
}

function applyTaskKpiFilter() {
    updateFilterBadges();
    populateTaskKpiFilterOptions();
    renderTaskDashboard();
}

function updateFilterBadges() {
    const s1 = (document.getElementById('task-filter-search')?.value || '').trim();
    const s2 = (document.getElementById('task-filter-search-mobile')?.value || '').trim();
    const s = s1 || s2;
    const a = (document.getElementById('task-filter-agen')?.value || '').trim();
    const ak = (document.getElementById('task-filter-akun')?.value || '').trim();
    const kpi = (document.getElementById('task-filter-kpi')?.value || '').trim();
    const isActive = (s !== '' || a !== '' || ak !== '' || kpi !== '');

    const bMob = document.getElementById('filter-badge-mobile');
    const bDesk = document.getElementById('filter-badge-desktop');
    if (bMob) bMob.classList.toggle('hidden', !isActive);
    if (bDesk) bDesk.classList.toggle('hidden', !isActive);
}

function populateTaskKpiFilterOptions() {
    const selectAgen = document.getElementById('task-filter-agen');
    const selectAkun = document.getElementById('task-filter-akun');
    const selectKpi = document.getElementById('task-filter-kpi');
    if (!selectAgen || !selectAkun) return;

    const currentAgen = (selectAgen.value || '').trim();
    const currentAkun = (selectAkun.value || '').trim();
    const currentKpi = selectKpi ? (selectKpi.value || '').trim() : '';

    let agents = new Set();
    let accounts = new Set();
    let kpiMap = new Map();

    const hArea = (areaDataCache && areaDataCache[0]) ? areaDataCache[0] : [];
    const aIdxGoal = getColIndex(hArea, "Straight Goal") > -1 ? getColIndex(hArea, "Straight Goal") : 3; // Kolom D
    const aIdxAgen = getColIndex(hArea, "Nama Agen") > -1 ? getColIndex(hArea, "Nama Agen") : (getColIndex(hArea, "Agen") > -1 ? getColIndex(hArea, "Agen") : 14);

    // Dari Sheet Ticket: Kolom U (20 / Nama Agen) & Kolom B (1 / Akun)
    if (ticketDataCache && ticketDataCache.length > 1) {
        ticketDataCache.slice(1).forEach(row => {
            let ag = String(row[20] || row[19] || '').trim();
            let ak = String(row[1] || '').trim();
            if (ag && ag !== '-' && ag !== 'Unassigned') agents.add(ag);
            if (ak && ak !== '-' && ak !== 'Unassigned') accounts.add(ak);
        });
    }

    // Dari Sheet Area: Kolom O (14 / Nama Agen), Kolom B (1 / Akun), & Kolom A (0 / ID Area) + Kolom D (Goal)
    if (areaDataCache && areaDataCache.length > 1) {
        areaDataCache.slice(1).forEach(row => {
            let ag = String(row[aIdxAgen] || row[14] || row[2] || '').trim();
            let ak = String(row[1] || '').trim();
            let idArea = String(row[0] || '').trim();
            let goal = String(row[aIdxGoal] !== undefined ? row[aIdxGoal] : (row[3] || '')).trim();

            if (ag && ag !== '-' && ag !== 'Unassigned') agents.add(ag);
            if (ak && ak !== '-' && ak !== 'Unassigned') accounts.add(ak);

            // Filter Kpi berdasarkan Agen dan/atau Akun yang sedang dipilih
            let matchAgen = !currentAgen || (ag.toLowerCase() === currentAgen.toLowerCase());
            let matchAkun = !currentAkun || (ak.toLowerCase() === currentAkun.toLowerCase());

            if (matchAgen && matchAkun && idArea && goal) {
                kpiMap.set(idArea, goal);
            }
        });
    }

    let sortedAgents = Array.from(agents).sort((a,b) => a.localeCompare(b));
    let sortedAccounts = Array.from(accounts).sort((a,b) => a.localeCompare(b));
    let sortedKpis = Array.from(kpiMap.entries()).sort((a,b) => a[1].localeCompare(b[1]));

    selectAgen.innerHTML = '<option value="">-- Semua Agen --</option>' + 
        sortedAgents.map(a => `<option value="${a}" ${a === currentAgen ? 'selected' : ''}>${a}</option>`).join('');

    selectAkun.innerHTML = '<option value="">-- Semua Akun --</option>' + 
        sortedAccounts.map(a => `<option value="${a}" ${a === currentAkun ? 'selected' : ''}>${a}</option>`).join('');

    if (selectKpi) {
        let isCurrentKpiValid = kpiMap.has(currentKpi);
        selectKpi.innerHTML = '<option value="">-- Semua KPI --</option>' +
            sortedKpis.map(([id, goal]) => `<option value="${id}" ${id === currentKpi ? 'selected' : ''}>${goal}</option>`).join('');
        
        if (!isCurrentKpiValid) {
            selectKpi.value = '';
        }
    }
}

// Fungsi pembantu agar UMKM anti-error jika kolom tergeser
function getColIndex(headers, columnName) {
    let idx = headers.findIndex(h => String(h).toLowerCase().trim() === columnName.toLowerCase());
    return idx !== -1 ? idx : -1; 
}

// 3. PERBAIKAN RENDER TASK DASHBOARD (Hapus Deklarasi Ganda)
function renderTaskDashboard() {
    if(!ticketDataCache[0] || !areaDataCache[0]) return;

    // Ekstraksi Header
    const hTicket = ticketDataCache[0];
    const hArea = areaDataCache[0];

    // Index Kolom Ticket (Dinamis dengan fallback indeks baku)
    const tIdxStatus = getColIndex(hTicket, "Status") > -1 ? getColIndex(hTicket, "Status") : (getColIndex(hTicket, "Priority") > -1 ? getColIndex(hTicket, "Priority") : 8); // Kolom I / Kolom R
    const tIdxProg = getColIndex(hTicket, "Prog Task") > -1 ? getColIndex(hTicket, "Prog Task") : 10; // Kolom K
    const tIdxProject = getColIndex(hTicket, "Project") > -1 ? getColIndex(hTicket, "Project") : (getColIndex(hTicket, "Nama Project") > -1 ? getColIndex(hTicket, "Nama Project") : 6); // Kolom G
    const tIdxIdArea = getColIndex(hTicket, "ID Area") > -1 ? getColIndex(hTicket, "ID Area") : 2; // Kolom C
    const tIdxAkun = getColIndex(hTicket, "Akun") > -1 ? getColIndex(hTicket, "Akun") : 1; // Kolom B
    const tIdxDeadline = getColIndex(hTicket, "Deadline") > -1 ? getColIndex(hTicket, "Deadline") : (getColIndex(hTicket, "Tgl Deadline") > -1 ? getColIndex(hTicket, "Tgl Deadline") : 15); // Kolom P
    const tIdxTime = getColIndex(hTicket, "Time") > -1 ? getColIndex(hTicket, "Time") : (getColIndex(hTicket, "Jam") > -1 ? getColIndex(hTicket, "Jam") : 16); // Kolom Q
    const tIdxAgen = getColIndex(hTicket, "Nama Agen") > -1 ? getColIndex(hTicket, "Nama Agen") : (getColIndex(hTicket, "Agen") > -1 ? getColIndex(hTicket, "Agen") : 20); // Kolom U (Index 20)
    const tIdxW = getColIndex(hTicket, "ID Costumer") > -1 ? getColIndex(hTicket, "ID Costumer") : (getColIndex(hTicket, "ID Customer") > -1 ? getColIndex(hTicket, "ID Customer") : 22); // Kolom W (Index 22)
    const tIdxX = getColIndex(hTicket, "Nama Costumer") > -1 ? getColIndex(hTicket, "Nama Costumer") : (getColIndex(hTicket, "Nama Customer") > -1 ? getColIndex(hTicket, "Nama Customer") : 23); // Kolom X (Index 23)

    // Index Kolom Area (KPI)
    const aIdxAgen = getColIndex(hArea, "Nama Agen") > -1 ? getColIndex(hArea, "Nama Agen") : (getColIndex(hArea, "Agen") > -1 ? getColIndex(hArea, "Agen") : 14);
    const aIdxGoal = getColIndex(hArea, "Straight Goal") > -1 ? getColIndex(hArea, "Straight Goal") : 3; // Kolom D

    // Lookup Map O(1): ID Area (Sheet Area Kolom A) -> Nama KPI (Sheet Area Kolom D)
    let areaKpiMap = {};
    if (areaDataCache && areaDataCache.length > 1) {
        areaDataCache.slice(1).forEach(aRow => {
            let aId = String(aRow[0] || "").trim(); // Kolom A
            let aGoal = String(aRow[aIdxGoal] || aRow[3] || "").trim(); // Kolom D (Straight Goal)
            if (aId) {
                areaKpiMap[aId] = aGoal;
            }
        });
    }

    // Helper Tanggal Deadline (Konversi ke Timestamp untuk Sorting Z-A & Format Teks Visual)
    const parseDeadlineDate = (dStr) => {
        if (!dStr || dStr === "-" || dStr === "") return 0;
        let d = new Date(dStr);
        if (isNaN(d.getTime())) {
            let parts = String(dStr).split(/[\/\-]/);
            if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
        }
        return isNaN(d.getTime()) ? 0 : d.getTime();
    };

    const formatDeadlineVisual = (dStr) => {
        if (!dStr || dStr === "-" || dStr === "") return "";
        let d = new Date(dStr);
        if (isNaN(d.getTime())) {
            let parts = String(dStr).split(/[\/\-]/);
            if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
            if (isNaN(d.getTime())) return dStr;
        }
        const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    };

    const uiToday = document.getElementById('ui-col-today');
    const uiKPI = document.getElementById('ui-col-kpi');
    uiToday.innerHTML = ""; uiKPI.innerHTML = "";

    // DEKLARASI FILTER CUKUP DILAKUKAN SEKALI DI SINI SAJA
    const activeFilters = Array.from(document.querySelectorAll('.task-filter-cb:checked')).map(cb => cb.value.toLowerCase());
    const activeKpiFilters = Array.from(document.querySelectorAll('.kpi-filter-cb:checked')).map(cb => cb.value.toLowerCase());
    
    // Filter Kustom Modal (Agen, Akun, KPI, Search Project / Area)
    const filterAgen = (document.getElementById('task-filter-agen')?.value || "").trim().toLowerCase();
    const filterAkun = (document.getElementById('task-filter-akun')?.value || "").trim().toLowerCase();
    const filterKpi = (document.getElementById('task-filter-kpi')?.value || "").trim().toLowerCase();
    const filterSearchDesk = (document.getElementById('task-filter-search')?.value || "").trim().toLowerCase();
    const filterSearchMob = (document.getElementById('task-filter-search-mobile')?.value || "").trim().toLowerCase();
    const filterSearch = filterSearchDesk || filterSearchMob;

    let taskDataAgg = {};

    let nowObj = new Date();
    let yyyyNow = nowObj.getFullYear();
    let mmNow = String(nowObj.getMonth() + 1).padStart(2, '0');
    let ddNow = String(nowObj.getDate()).padStart(2, '0');
    let todayYmd = `${yyyyNow}-${mmNow}-${ddNow}`;

    // ---------------------------------------------------------
    // 1. RENDER TASK (TICKET)
    // ---------------------------------------------------------
    ticketDataCache.slice(1).forEach(row => {
        let statRaw = String(row[tIdxStatus] !== undefined ? row[tIdxStatus] : (row[8] || row[17] || "Plan")).trim();
        let statLower = statRaw.toLowerCase();
        
        let rawDeadline = row[tIdxDeadline] !== undefined ? row[tIdxDeadline] : row[15];
        let deadlineYmd = _parseDateForInput(rawDeadline);
        let isDeadlineToday = (deadlineYmd === todayYmd);

        // Logika Filter: Checkbox "today" memunculkan semua task dengan deadline tgl hari ini (termasuk yang sudah done) atau status 'today'/'do'/'overtime'
        let isMatch = activeFilters.some(filter => {
            if (filter === 'today') {
                let isDo = (statLower === 'do' || (statLower.startsWith('do') && !statLower.startsWith('done')));
                return isDeadlineToday || isDo || statLower.includes('overtime') || statLower.includes('today');
            }
            return statLower.includes(filter);
        });
        
        if(isMatch) {
            let agen = String(row[tIdxAgen] !== undefined ? row[tIdxAgen] : (row[20] || row[19] || "Unassigned")).trim();
            let akunVal = String(row[tIdxAkun] !== undefined ? row[tIdxAkun] : row[1] || "").trim();
            let projectName = String(row[tIdxProject] !== undefined ? row[tIdxProject] : row[6] || "-").trim();
            let idAreaVal = String(row[tIdxIdArea] !== undefined ? row[tIdxIdArea] : row[2] || "").trim();
            let kpiName = areaKpiMap[idAreaVal] || (idAreaVal ? `KPI: ${idAreaVal}` : "");
            let descVal = String(row[7] || "").trim();
            // Matching murni Kolom J (Index 9 / Parent Task ID)
            let parentId = String(row[9] || "").trim();

            // Filter Agen (Ticket Kolom U / Index 20)
            if (filterAgen !== "" && agen.toLowerCase() !== filterAgen) return;

            // Filter Akun (Ticket Kolom B / Index 1)
            if (filterAkun !== "" && akunVal.toLowerCase() !== filterAkun) return;

            // Filter KPI (Ticket Kolom C / Index 2 ID Area vs Kolom A Area)
            if (filterKpi !== "" && idAreaVal.toLowerCase() !== filterKpi) return;

            // Filter Search (Nama Project dan Nama Area)
            if (filterSearch !== "") {
                let combinedSearch = (projectName + " " + kpiName + " " + descVal + " " + idAreaVal).toLowerCase();
                if (!combinedSearch.includes(filterSearch)) return;
            }

            if(!taskDataAgg[agen]) taskDataAgg[agen] = [];

            // 1. Konversi Kolom K (Prog Task) dari decimal ke % bulat
            let rawProg = row[tIdxProg] !== undefined ? row[tIdxProg] : row[10];
            let progVal = 0;
            if (rawProg !== undefined && rawProg !== null && rawProg !== "") {
                let pStr = String(rawProg).replace(',', '.').replace('%', '').trim();
                let num = parseFloat(pStr);
                if (!isNaN(num)) {
                    if (num > 0 && num <= 1 && !String(rawProg).includes('%')) {
                        num = num * 100;
                    }
                    progVal = Math.min(100, Math.max(0, Math.round(num)));
                }
            }

            let rawDeadline = row[tIdxDeadline] !== undefined ? row[tIdxDeadline] : row[15];
            let rawTime = row[tIdxTime] !== undefined ? row[tIdxTime] : row[16];
            let timeVal = _parseTimeForInput(rawTime) || String(rawTime || "").trim();

            let valW = String(row[tIdxW] !== undefined ? row[tIdxW] : (row[22] || "")).trim();
            let valX = String(row[tIdxX] !== undefined ? row[tIdxX] : (row[23] || "")).trim();

            taskDataAgg[agen].push({
                id: row[0],
                akun: akunVal,
                project: projectName,
                kpi: kpiName,
                prog: progVal,
                deadlineVal: parseDeadlineDate(rawDeadline),
                deadlineText: formatDeadlineVisual(rawDeadline),
                time: timeVal,
                statAsli: statRaw,
                colW: valW,
                colX: valX,
                parentId: parentId
            });
        }
    });

    // Simpan agregasi data task ke window scope untuk tombol Share WA
    window.currentTaskDataAgg = taskDataAgg;

    for (let agen in taskDataAgg) {
        // Multi-level Sorting:
        // 1. Task dengan status Done (atau Progress 100%) diletakkan paling bawah
        // 2. Tgl Deadline Kolom P (Z - A / Descending)
        // 3. Time Kolom Q (A - Z / Ascending)
        taskDataAgg[agen].sort((a, b) => {
            let aDone = a.statAsli.toLowerCase().includes('done') || a.prog >= 100;
            let bDone = b.statAsli.toLowerCase().includes('done') || b.prog >= 100;
            if (aDone !== bDone) {
                return aDone ? 1 : -1; // Done selalu berada di baris paling bawah
            }
            if (a.deadlineVal === 0 && b.deadlineVal > 0) return 1;
            if (b.deadlineVal === 0 && a.deadlineVal > 0) return -1;
            if (a.deadlineVal !== b.deadlineVal) {
                return a.deadlineVal - b.deadlineVal; // A - Z (YYMMDD Ascending)
            }
            if (!a.time && b.time) return 1;
            if (a.time && !b.time) return -1;
            return String(a.time || "").localeCompare(String(b.time || "")); // A - Z (Time 24 Jam: AM dahulu baru PM)
        });

        // Hitung Rata-rata Progress Task Agen
        let totalTaskProg = 0;
        taskDataAgg[agen].forEach(t => { totalTaskProg += (t.prog || 0); });
        let avgTaskProg = taskDataAgg[agen].length > 0 ? Math.round(totalTaskProg / taskDataAgg[agen].length) : 0;
        let taskStrokeColor = avgTaskProg === 100 ? "text-emerald-300" : (avgTaskProg >= 50 ? "text-amber-300" : "text-rose-300");

        let taskListHtml = taskDataAgg[agen].map(t => {
            // Styling Status Badge (Kolom R)
            let badgeStyle = "bg-gray-100 text-gray-700 border border-gray-200";
            let sLower = t.statAsli.toLowerCase();
            if (sLower === 'do' || sLower.includes('doing') || sLower.includes('today')) badgeStyle = "bg-blue-100 text-blue-800 border border-blue-200";
            else if (sLower.includes('overtime')) badgeStyle = "bg-purple-100 text-purple-800 border border-purple-200";
            else if (sLower.includes('done')) badgeStyle = "bg-emerald-100 text-emerald-800 border border-emerald-200";
            else if (sLower.includes('overdue')) badgeStyle = "bg-rose-100 text-rose-800 border border-rose-200";
            else if (sLower.includes('schedule')) badgeStyle = "bg-amber-100 text-amber-800 border border-amber-200";
            else if (sLower.includes('plan')) badgeStyle = "bg-slate-100 text-slate-700 border border-slate-200";

            // Styling Progress Bar & Pill (Kolom K)
            let progColor = "bg-gray-300";
            let progTextColor = "text-gray-500";
            if (t.prog >= 100) { progColor = "bg-emerald-500"; progTextColor = "text-emerald-700"; }
            else if (t.prog >= 50) { progColor = "bg-blue-600"; progTextColor = "text-blue-700"; }
            else if (t.prog > 0) { progColor = "bg-amber-500"; progTextColor = "text-amber-700"; }

            return `
            <div id="task-card-${t.id}" class="relative p-2.5 mb-2 bg-white rounded-lg border border-gray-100 shadow-xs hover:border-blue-200 hover:shadow-sm transition-all">
                ${(window.pendingSavingTaskIds && window.pendingSavingTaskIds.has(String(t.id))) ? `
                <div class="item-saving-spinner-overlay absolute inset-0 bg-white/85 backdrop-blur-[1px] rounded-lg z-20 flex items-center justify-center gap-2 text-xs font-bold text-blue-600 shadow-sm">
                    <div class="spinner-small border-blue-600"></div>
                    <span>Memproses...</span>
                </div>` : ''}
                <!-- Baris 1: Status Badge (Kolom R) + Badge Akun (Kolom B) + Nama KPI (Lookup Kolom C -> Area Kolom D) + Tombol Edit -->
                <div class="flex items-center justify-between gap-2 mb-1.5">
                    <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
                        <!-- Status Badge (Kolom R) -->
                        <span class="text-[9px] font-black px-2 py-0.5 rounded-full ${badgeStyle} uppercase tracking-wider shrink-0">${t.statAsli}</span>
                        
                        <!-- Badge Akun (Kolom B) -->
                        ${t.akun ? `
                        <span class="inline-flex items-center gap-1 text-[9.5px] font-bold text-sky-800 bg-sky-50 px-2 py-0.5 rounded-full border border-sky-200 shrink-0" title="Akun: ${t.akun}">
                            👤 <span class="truncate max-w-[90px]">${t.akun}</span>
                        </span>` : ''}

                        <!-- Badge Costumer (Kolom X) -->
                        ${t.colX ? `
                        <span class="inline-flex items-center gap-1 text-[9.5px] font-bold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200 shrink-0" title="Costumer: ${t.colX}">
                            🤝 <span class="truncate max-w-[95px]">${t.colX}</span>
                        </span>` : ''}

                        <!-- Nama KPI (Lookup Kolom C -> Area Kolom D) -->
                        ${t.kpi ? `
                        <span class="inline-flex items-center gap-1 text-[9.5px] font-bold text-purple-700 bg-purple-50 px-2 py-0.5 rounded-md border border-purple-100 truncate max-w-[180px]" title="Nama KPI: ${t.kpi}">
                            🎯 <span class="truncate">${t.kpi}</span>
                        </span>` : ''}
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        ${t.parentId ? `
                        <button onclick="event.stopPropagation(); openTicketForm('${t.parentId}')" class="text-[9.5px] font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-2 py-0.5 rounded-full border border-blue-200 transition-colors cursor-pointer" title="Buka Task Utama">
                            Ref &raquo;
                        </button>` : ''}
                        <!-- Tombol Edit Task -->
                        <button onclick="openTicketForm('${t.id}')" class="text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-1 rounded transition-colors" title="Edit Task">
                            <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.499.499 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11l.178-.178z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Baris 2: Nama Project (Kolom G) - Deskripsi (Kolom H) disembunyikan -->
                <div class="mb-2">
                    <h4 class="font-bold text-xs text-gray-800 leading-snug hover:text-blue-600 transition-colors cursor-pointer" onclick="openTicketForm('${t.id}')" title="Project: ${t.project}">
                        📁 ${t.project}
                    </h4>
                </div>

                <!-- Baris 3: Model Visual Prog Task (Kolom K) % Bulat + Tgl Deadline (Kolom P) + Time (Kolom Q) -->
                <div class="flex items-center justify-between gap-2 pt-1 border-t border-gray-50 text-[10px]">
                    <!-- Progress Bar (Kolom K) -->
                    <div class="flex items-center gap-1.5 flex-1 max-w-[150px]">
                        <div class="flex-1 bg-gray-100 rounded-full h-1.5 overflow-hidden">
                            <div class="${progColor} h-1.5 rounded-full transition-all duration-300" style="width: ${t.prog}%"></div>
                        </div>
                        <span class="font-black text-[10px] ${progTextColor} shrink-0 w-[28px] text-right">${t.prog}%</span>
                    </div>

                    <!-- Tanggal Deadline (Kolom P) & Time (Kolom Q) -->
                    <div class="flex items-center gap-2 text-gray-500 font-medium text-[9px] shrink-0">
                        ${t.deadlineText ? `<span class="flex items-center gap-0.5 text-gray-700 font-bold" title="Tgl Deadline: ${t.deadlineText}">📅 ${t.deadlineText}</span>` : ''}
                        ${t.time && t.time !== '-' ? `<span class="flex items-center gap-0.5 text-gray-400" title="Time: ${t.time}">🕒 ${t.time}</span>` : ''}
                    </div>
                </div>
            </div>
        `}).join('');

        let cleanAgenId = String(agen).replace(/[^a-zA-Z0-9]/g, '_');

        uiToday.innerHTML += `
            <div class="mb-3 border border-blue-100 rounded-xl overflow-hidden bg-white shadow-xs">
                <div class="bg-blue-600 px-3 py-2.5 flex justify-between items-center border-b border-blue-700 cursor-pointer select-none hover:bg-blue-700 transition-colors" onclick="toggleAgentTaskCollapse('${cleanAgenId}')">
                    <div class="flex items-center gap-2">
                        <svg id="icon-agent-task-${cleanAgenId}" class="w-4 h-4 text-white transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                        <span class="font-bold text-xs text-white tracking-wide flex items-center gap-1.5">
                            <span>👷</span> <span>${agen}</span>
                        </span>
                    </div>
                    <div class="flex gap-1.5 items-center" onclick="event.stopPropagation()">
                        <span class="bg-white/20 text-white text-[10px] px-2 py-0.5 rounded-full border border-white/20 font-bold tracking-wider">${taskDataAgg[agen].length} Task</span>
                        <div class="relative inline-flex items-center justify-center shrink-0 w-7 h-7 bg-black/20 rounded-full border border-white/20 shadow-xs" title="Rata-rata Progress Task: ${avgTaskProg}%">
                            <svg class="w-full h-full" viewBox="0 0 36 36">
                                <path class="text-white/25" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path class="${taskStrokeColor} transition-all duration-500" stroke-dasharray="${avgTaskProg}, 100" stroke-width="4" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <span class="absolute text-[8px] font-black text-white leading-none tracking-tighter">${avgTaskProg}%</span>
                        </div>
                        <button onclick="shareAgentTasksWA('${agen.replace(/'/g, "\\'")}')" class="flex items-center gap-1 text-[10px] font-bold bg-emerald-500 hover:bg-emerald-600 text-white px-2.5 py-0.5 rounded-full shadow-xs transition-all border border-emerald-400 active:scale-95 shrink-0" title="Share WhatsApp Task Agen ${agen}">
                            <svg width="11" height="11" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592z"/></svg>
                            <span>Share</span>
                        </button>
                    </div>
                </div>
                <div id="body-agent-task-${cleanAgenId}" class="agent-task-body p-2 bg-gray-50/40 hidden">${taskListHtml}</div>
            </div>
        `;
    }
    if(uiToday.innerHTML === "") uiToday.innerHTML = `<p class="text-xs text-gray-400 italic text-center p-6 border-2 border-dashed border-gray-200 rounded-lg m-2">Tidak ada tugas yang sesuai filter.</p>`;

    // ---------------------------------------------------------
    // 2. RENDER KPI (AREA) DENGAN FORMAT TANGGAL & PERSENTASE
    // ---------------------------------------------------------
    
    // PERBAIKAN FUNGSI TANGGAL (Return sebagai Object)
    const formatDateIndo = (dateStr) => {
        if (!dateStr || dateStr === "-" || dateStr === "") return { text: "-", val: 0 };
        let d = new Date(dateStr);
        if (isNaN(d.getTime())) {
            let parts = String(dateStr).split(/[\/\-]/);
            if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
            if (isNaN(d.getTime())) return { text: dateStr, val: 0 };
        }
        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        return {
            text: d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear(),
            val: d.getTime() // Digunakan untuk sorting presisi
        };
    };

    let kpiData = {};
    areaDataCache.slice(1).forEach(row => {
        let kpiStatus = String(row[12] || "in progress").toLowerCase().trim();
        if (kpiStatus === "") kpiStatus = "in progress";

        let isKpiMatch = activeKpiFilters.some(filter => kpiStatus.includes(filter));
        
        // Hanya eksekusi baris jika sesuai dengan centang checkbox
        if(isKpiMatch) {
            let areaId = String(row[0] || "").trim(); // Index 0: ID Area (Kolom A Sheet Area)
            let akun = String(row[1] || "Unassigned").trim(); // Index 1: Akun (Kolom B)
            let agen = String(row[aIdxAgen] || "Unassigned").trim(); // Index 14 / Kolom O (Nama Agen)
            let goal = String(row[aIdxGoal] || "").trim();
            let areaVal = String(row[2] || "").trim(); // Index 2: Area (Kolom C)
            let descArea = String(row[4] || "").trim(); // Index 4: Deskripsi (Kolom E)

            // Filter Agen (Area Kolom O / Index 14)
            if (filterAgen !== "" && agen.toLowerCase() !== filterAgen) return;

            // Filter Akun (Area Kolom B / Index 1)
            if (filterAkun !== "" && akun.toLowerCase() !== filterAkun) return;

            // Filter KPI (Area Kolom A ID Area)
            if (filterKpi !== "" && areaId.toLowerCase() !== filterKpi) return;

            // Filter Search (Nama Project dan Nama Area)
            if (filterSearch !== "") {
                let combinedArea = (areaVal + " " + goal + " " + descArea).toLowerCase();
                if (!combinedArea.includes(filterSearch)) return;
            }
            
            let rawDeadline = row[10]; // Kolom K (Deadline)
            let pencapaianVal = row[15] || "0"; // Kolom P (Pencapaian Saat Ini)

            let rawPersen = row[6];
            if (rawPersen === undefined || rawPersen === "") {
                rawPersen = row[6] || 0;
            }

            // 1. Eksekusi Konversi Persentase (0.96 -> 96%)
            let safePersenStr = String(rawPersen).replace(',', '.');
            let floatPersen = parseFloat(safePersenStr);
            let persenTeks = isNaN(floatPersen) ? "0%" : Math.round(floatPersen * 100) + "%";
            let floatMurni = isNaN(floatPersen) ? 0 : floatPersen;

            // 2. Eksekusi Format Tanggal & Angka Value Sorting
            let deadlineData = formatDateIndo(rawDeadline);

            if(goal !== "") {
                if(!kpiData[agen]) kpiData[agen] = {};
                if(!kpiData[agen][akun]) kpiData[agen][akun] = [];
                
                let rawR = String(row[17] || "").trim().toLowerCase();
                let isBerulangBool = (rawR === "true" || rawR === "1" || rawR === "ya" || rawR === "yes");

                // Susun data berbasis Hierarki: Agen -> Akun
                kpiData[agen][akun].push({
                    id: row[0], 
                    goal: goal,
                    prog: persenTeks,       
                    progFloat: floatMurni,  
                    deadline: deadlineData.text, 
                    deadlineVal: deadlineData.val, // Nilai ukur sortir (Z-A)
                    pencapaian: pencapaianVal,
                    rawRow: row,
                    isBerulang: isBerulangBool
                });
            }
        }
    });
    
    // 2. PERBAIKAN WARNA UI PADA LOOPING PEMBUATAN KARTU KPI
    for (let agen in kpiData) {
        let akunHtml = '';
        let totalGoals = 0;
        let totalAgenKpiProgSum = 0;
        
        // Looping Sub-grup Akun
        for (let akun in kpiData[agen]) {
            let items = kpiData[agen][akun];
            totalGoals += items.length;
            items.sort((a, b) => b.deadlineVal - a.deadlineVal);
            
            let sumProg = 0;
            items.forEach(k => {
                sumProg += (k.progFloat || 0);
                totalAgenKpiProgSum += (k.progFloat || 0);
            });
            let avgFloat = items.length > 0 ? (sumProg / items.length) : 0;
            let avgTeks = Math.round(avgFloat * 100) + "%";

            // PERUBAHAN WARNA: List Item KPI (Minimalis + Auto Task Generator Button)
            let kpiListHtml = items.map(k => {
                let autoTaskBtnHtml = '';
                let taskInfo = getMissingAutoTaskInfo(k.id, k.rawRow);

                let isSelectedKpi = filterKpi !== "" && filterKpi === String(k.id).trim().toLowerCase();
                let activeBadgeClass = isSelectedKpi 
                    ? "bg-indigo-600 text-white border-indigo-700 shadow-xs" 
                    : "bg-indigo-50 text-indigo-700 hover:bg-indigo-100 hover:text-indigo-800 border-indigo-200/80";

                if (taskInfo.count > 0) {
                    autoTaskBtnHtml = `
                    <button onclick="generateAutoTasksForKpi('${k.id}')" class="flex items-center gap-1 text-[10px] font-extrabold bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white px-2 py-0.5 rounded-md shadow-xs transition-all hover:scale-105 active:scale-95 shrink-0 cursor-pointer" title="Klik untuk membuat ${taskInfo.count} task otomatis pekan ini">
                        <span>📝</span>
                        <span>+${taskInfo.count} Task</span>
                    </button>`;
                } else if (k.isBerulang) {
                    let uCount = (taskInfo && taskInfo.unfinishedCount !== undefined) ? taskInfo.unfinishedCount : 0;
                    autoTaskBtnHtml = `
                    <span onclick="event.stopPropagation(); filterByKpiId('${k.id}')" class="text-[9px] font-bold ${activeBadgeClass} px-1.5 py-0.5 rounded border shrink-0 cursor-pointer transition-colors" title="Klik untuk filter task & KPI ini (${uCount} task aktif)">
                        ⏳ ${uCount} Active
                    </span>`;
                } else {
                    // KPI Non-Berulang (Kolom R != berulang): Hitung Task Aktif (Status <> Done & Status <> Plan)
                    let activeNonBerulangCount = 0;
                    if (ticketDataCache && ticketDataCache.length > 1) {
                        ticketDataCache.slice(1).forEach(tRow => {
                            let rowAreaId = String(tRow[tIdxIdArea] !== undefined ? tRow[tIdxIdArea] : (tRow[2] || "")).trim();
                            if (rowAreaId === String(k.id).trim()) {
                                let rawStat = String(tRow[tIdxStatus] !== undefined ? tRow[tIdxStatus] : (tRow[8] || tRow[17] || "")).trim().toLowerCase();
                                let rawProg = String(tRow[tIdxProg] !== undefined ? tRow[tIdxProg] : (tRow[10] || "")).trim();
                                if (rawStat !== "done" && rawStat !== "plan" && rawProg !== "100%" && rawProg !== "100") {
                                    activeNonBerulangCount++;
                                }
                            }
                        });
                    }
                    autoTaskBtnHtml = `
                    <span onclick="event.stopPropagation(); filterByKpiId('${k.id}')" class="text-[9px] font-bold ${activeBadgeClass} px-1.5 py-0.5 rounded border shrink-0 cursor-pointer transition-colors" title="Klik untuk filter task & KPI ini (${activeNonBerulangCount} task aktif)">
                        ⏳ ${activeNonBerulangCount} Active
                    </span>`;
                }

                return `
                <div id="kpi-card-${k.id}" class="relative flex justify-between items-center py-2.5 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors">

// Helper: Share KPI Agen ke WhatsApp berbasis Filter Aktif, Sort Dual-Level (Kolom B lalu K), & Status Done di Paling Bawah
function shareAgentKpisWA(agenName) {
    if (!areaDataCache || areaDataCache.length <= 1) {
        if (typeof showToast === 'function') showToast("⚠️ Data KPI belum dimuat.");
        return;
    }

    // Ambil Filter Aktif dari UI
    const activeKpiFilters = Array.from(document.querySelectorAll('.kpi-filter-cb:checked')).map(cb => cb.value.toLowerCase());
    const filterAkun = (document.getElementById('task-filter-akun')?.value || "").trim().toLowerCase();
    const filterKpi = (document.getElementById('task-filter-kpi')?.value || "").trim().toLowerCase();
    const filterSearchDesk = (document.getElementById('task-filter-search')?.value || "").trim().toLowerCase();
    const filterSearchMob = (document.getElementById('task-filter-search-mobile')?.value || "").trim().toLowerCase();
    const filterSearch = filterSearchDesk || filterSearchMob;

    // Filter baris KPI untuk agen ini & terapkan filter aktif UI
    let rows = areaDataCache.slice(1).filter(r => {
        let aName = String(r[14] || "").trim(); // Index 14 / Kolom O (Nama Agen)
        if (aName.toLowerCase() !== String(agenName).trim().toLowerCase()) return false;

        let kpiStatus = String(r[12] || "in progress").toLowerCase().trim(); // Index 12 / Kolom M
        if (kpiStatus === "") kpiStatus = "in progress";

        // 1. Filter Checkbox Status KPI
        if (activeKpiFilters.length > 0) {
            let isKpiMatch = activeKpiFilters.some(filter => kpiStatus.includes(filter));
            if (!isKpiMatch) return false;
        }

        // 2. Filter Akun (Index 1 / Kolom B)
        let akun = String(r[1] || "").trim().toLowerCase();
        if (filterAkun !== "" && akun !== filterAkun) return false;

        // 3. Filter KPI / ID Area (Index 0 / Kolom A)
        let areaId = String(r[0] || "").trim().toLowerCase();
        if (filterKpi !== "" && areaId !== filterKpi) return false;

        // 4. Filter Search Text (Area, Goal, Deskripsi)
        if (filterSearch !== "") {
            let areaVal = String(r[2] || "").trim();
            let goal = String(r[3] || "").trim();
            let descArea = String(r[4] || "").trim();
            let combinedArea = (areaVal + " " + goal + " " + descArea).toLowerCase();
            if (!combinedArea.includes(filterSearch)) return false;
        }

        return true;
    });

    if (!rows || rows.length === 0) {
        if (typeof showToast === 'function') showToast("⚠️ Tidak ada data KPI yang sesuai filter.");
        return;
    }

    // 1. Urutkan berdasarkan: Utama Kolom B (Akun), Kedua Kolom K (Deadline) (A-Z)
    rows.sort((a, b) => {
        let akunA = String(a[1] || "").trim();
        let akunB = String(b[1] || "").trim();
        let cmpAkun = akunA.localeCompare(akunB, undefined, { numeric: true, sensitivity: 'base' });
        if (cmpAkun !== 0) return cmpAkun;

        let deadA = String(a[10] || "").trim();
        let deadB = String(b[10] || "").trim();
        return deadA.localeCompare(deadB, undefined, { numeric: true, sensitivity: 'base' });
    });

    // 2. Format item list & pisahkan item Done (Kolom M / Index 12) ke posisi paling bawah
    let notDoneItems = [];
    let doneItems = [];

    rows.forEach(r => {
        let statusStr = String(r[12] || "").trim().toLowerCase();
        let isDone = statusStr === 'done' || statusStr.includes('done') || statusStr === 'lunas' || statusStr === 'selesai';
        
        let goal = String(r[3] || "-").trim(); // Kolom D (Nama KPI)
        let pencapaian = String(r[15] || "").trim(); // Kolom P (Pencapaian Realisasi)
        
        // Format Kolom G ke % (x100%)
        let rawG = r[6];
        let floatG = parseFloat(String(rawG || 0).replace(',', '.'));
        let persenG = isNaN(floatG) ? 0 : ((floatG <= 1 && floatG > 0) ? Math.round(floatG * 100) : Math.round(floatG));

        let capaianSuffix = (pencapaian && pencapaian !== '-' && pencapaian !== '0') ? ` - ${pencapaian}` : '';
        
        if (isDone) {
            doneItems.push(`- ✅ (${persenG}%) ${goal}${capaianSuffix}`);
        } else {
            notDoneItems.push(`- (${persenG}%) ${goal}${capaianSuffix}`);
        }
    });

    // Gabungkan list: item aktif dulu, lalu item Done di paling bawah
    let allLines = [...notDoneItems, ...doneItems];
    let kpiListStr = allLines.join('\n');

    let months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    let now = new Date();
    let dd = String(now.getDate()).padStart(2, '0');
    let mmm = months[now.getMonth()];
    let yyyy = now.getFullYear();
    let hh = String(now.getHours()).padStart(2, '0');
    let mm = String(now.getMinutes()).padStart(2, '0');
    let nowLogStr = `${dd} ${mmm} ${yyyy} ${hh}:${mm}`;

    let header = `🎯 *REPORT TARGET KPI - ${agenName.toUpperCase()}*\nTanggal : ${nowLogStr}`;
    let fullMsg = `${header}\n\n${kpiListStr}`;

    let waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(fullMsg)}`;
    window.open(waUrl, '_blank');
}

// Helper: Share Task Agen ke WhatsApp berbasis Filter & Template Waktu/Done
function shareAgentTasksWA(agenName) {
    if (!window.currentTaskDataAgg || !window.currentTaskDataAgg[agenName]) {
        if (typeof showToast === 'function') showToast("⚠️ Tidak ada data task untuk agen ini.");
        return;
    }

    let tasks = window.currentTaskDataAgg[agenName];
    if (!tasks || tasks.length === 0) {
        if (typeof showToast === 'function') showToast("⚠️ Tidak ada task yang sesuai filter.");
        return;
    }

    const activeFilters = Array.from(document.querySelectorAll('.task-filter-cb:checked')).map(cb => cb.value.toLowerCase());
    let isDoneReport = (activeFilters.length === 1 && activeFilters[0] === 'done') || tasks.every(t => t.statAsli.toLowerCase().includes('done'));

    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    let now = new Date();
    let dd = String(now.getDate()).padStart(2, '0');
    let mmm = months[now.getMonth()];
    let yyyy = now.getFullYear();
    let hh = String(now.getHours()).padStart(2, '0');
    let mm = String(now.getMinutes()).padStart(2, '0');
    let ss = String(now.getSeconds()).padStart(2, '0');
    let nowLogStr = `${dd} ${mmm} ${yyyy} ${hh}:${mm}:${ss}`;

    // Format daftar task: Time (Kolom Q) + %Prog (Kolom K) + Nama Task (Project)
    // Jika Done: - ✅ 07.31 Task 1
    // Jika Belum Done: - 09.00 (10%) Task 2
    let taskListStr = tasks.map(t => {
        let isDone = t.statAsli.toLowerCase().includes('done') || t.prog >= 100;
        let timeStr = (t.time && t.time !== '-') ? t.time.replace(':', '.') : '';
        let timePrefix = timeStr ? `${timeStr} ` : '';
        let customerInfo = '';
        if (t.colX) {
            let rawW = t.colW || '';
            let waMatch = rawW.match(/^\d+/);
            let waNum = waMatch ? waMatch[0] : rawW.split(/[\.@]/)[0].trim();
            customerInfo = ` with ${t.colX}${waNum ? ' ' + waNum : ''}`;
        }
        if (isDone) {
            return `- ✅ ${timePrefix}${t.project}${customerInfo}`;
        } else {
            return `- ${timePrefix}(${t.prog}%) ${t.project}${customerInfo}`;
        }
    }).join('\n');

    let fullMsg = "";
    if (isDoneReport) {
        let header = `📋✔️ *Report Task Done ${agenName}*\nTanggal : ${nowLogStr}`;
        fullMsg = `${header}\n\n${taskListStr}`;
    } else {
        let hours = now.getHours();
        let mins = now.getMinutes();
        let totalMin = hours * 60 + mins;

        let salam = "Malam";
        let quote = "";

        if (totalMin < 5 * 60) {
            salam = "Malam";
            quote = "";
        } else if (totalMin <= 11 * 60) {
            salam = "Pagi";
            quote = "_Tanpa planning, hancur, Bro! Ambil dosis suksesmu: Rencanakan pagi ini, pantau dengan SIC 3x sehari._";
        } else if (totalMin <= 15 * 60) {
            salam = "Siang";
            quote = "_Istirahat boleh, lepas kendali jangan. Ambil dosis siangmu: Evaluasi progres pagi ini. On track atau meleset?_";
        } else if (totalMin <= 18 * 60) {
            salam = "Sore";
            quote = "_Tutup hari ini dengan cerdas. Parkir kerjaanmu dengan Hemingway Bridge. Pindahkan tugas belum selesai buat besok, lalu istirahat._";
        } else {
            salam = "Malam";
            quote = "";
        }

        let header = `📝 *SIC ${salam} ${agenName}*\nTanggal : ${nowLogStr}`;
        let quoteSection = quote ? `\n${quote}` : '';
        fullMsg = `${header}${quoteSection}\n\n${taskListStr}`;
    }

    // Gunakan URL resmi direct API WhatsApp untuk menghindari korupsi emoji pada redirect HTTP wa.me
    let waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(fullMsg)}`;
    window.open(waUrl, '_blank');
}

function _parseDateForInput(dateStr) {
    if (!dateStr || dateStr === "-") return "";
    let d = new Date(dateStr);
    if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
    const parts = String(dateStr).split(/[\/\-]/);
    if (parts.length === 3) return `20${parts[2].slice(-2)}-${parts[1]}-${parts[0]}`; 
    return "";
}

// Helper untuk Parsing Waktu (Mendukung format 24 jam "14:30", titik "11.30", serta AM/PM "09:00 AM", "02:30 PM" ke 24 jam "HH:MM")
function _parseTimeForInput(timeStr) {
    if (!timeStr || timeStr === "-" || timeStr === "") return "";
    let s = String(timeStr).trim();
    
    let isPM = /pm/i.test(s);
    let isAM = /am/i.test(s);
    
    // Hapus karakter non-digit selain titik dan titik dua
    let cleanStr = s.replace(/[^0-9:\.]/g, '').trim();
    cleanStr = cleanStr.replace(/\./g, ':');
    
    let parts = cleanStr.split(':');
    if (parts.length >= 1 && parts[0] !== "") {
        let nH = parseInt(parts[0], 10);
        let nM = parts.length >= 2 ? parseInt(parts[1], 10) : 0;
        
        if (isNaN(nH) || isNaN(nM) || nM < 0 || nM > 59) return "";
        
        if (isPM && nH < 12) nH += 12;
        else if (isAM && nH === 12) nH = 0;
        
        if (nH >= 0 && nH <= 23) {
            let hh = String(nH).padStart(2, '0');
            let mm = String(nM).padStart(2, '0');
            return `${hh}:${mm}`;
        }
    }
    return "";
}

function getTicketAgentOptions() {

    if (idxId === -1) idxId = 13; // Fallback Kolom N

    areaDataCache.slice(1).forEach(r => {
        let nama = String(r[idxNama] || "").trim();
        let id = String(r[idxId] || "").trim();
        // Cek jika Kolom M/12 berisi nama (jika kolom 14 kosong atau status)
        if (!nama || nama.toLowerCase() === "in progress" || nama.toLowerCase() === "done" || nama.toLowerCase() === "plan") {
            if (idxNama !== 14 && r[14]) nama = String(r[14]).trim();
            else if (idxNama !== 12 && r[12] && r[12].toLowerCase() !== "in progress" && r[12].toLowerCase() !== "done") nama = String(r[12]).trim();
        }
        if (nama && nama !== "-") {
            if (!agents.has(nama) || id) {
                agents.set(nama, id);
            }
        }
    });
    return agents;
}

// 3. Event Listener saat Nama Agen (U) Berubah
function onTicketAgentChange(isEditMode = false) {
    let nama = document.getElementById('tk-agen').value.trim();
    let idAgenField = document.getElementById('tk-id-agen');
    let badgeIdAgen = document.getElementById('tk-badge-id-agen');
    let areaSelect = document.getElementById('tk-id-area');
    let subfields = document.getElementById('tk-subfields-container');
    
    if (!nama) {
        idAgenField.value = "";
        badgeIdAgen.innerText = "ID Agen: -";
        areaSelect.innerHTML = '<option value="">-- Pilih Agen Terlebih Dahulu --</option>';
        areaSelect.disabled = true;
        areaSelect.classList.add('bg-gray-100', 'cursor-not-allowed');
        subfields.classList.add('hidden');
        return;
    }
    
    // Cari ID Agen di sheet Area
    let hArea = areaDataCache[0] || [];
    let idxId = getColIndex(hArea, "ID Agen") > -1 ? getColIndex(hArea, "ID Agen") : 13;
    let idxNama = getColIndex(hArea, "Nama Agen") > -1 ? getColIndex(hArea, "Nama Agen") : (getColIndex(hArea, "Agen") > -1 ? getColIndex(hArea, "Agen") : 14);
    let idxStatus = getColIndex(hArea, "Status") > -1 ? getColIndex(hArea, "Status") : 12; // Kolom M
    let idxGoal = getColIndex(hArea, "Straight Goal") > -1 ? getColIndex(hArea, "Straight Goal") : 3;
    let idxArea = getColIndex(hArea, "Area") > -1 ? getColIndex(hArea, "Area") : 2;

    let foundRow = areaDataCache.slice(1).find(r => {
        let rNama = String(r[idxNama] || r[14] || "").trim().toLowerCase();
        return rNama === nama.toLowerCase();
    });
    let idAgen = foundRow ? String(foundRow[idxId] || foundRow[13] || "").trim() : "";
    idAgenField.value = idAgen;
    badgeIdAgen.innerText = "ID: " + (idAgen || "-");

    // Filter KPI di Area: Kolom M berstatus "In Progress" DAN ID Agen / Nama Agen cocok
    let matchingAreas = [];
    areaDataCache.slice(1).forEach(r => {
        let rStat = String(r[idxStatus] || r[12] || "").trim().toLowerCase();
        let rIdAgen = String(r[idxId] || r[13] || "").trim();
        let rNamaAgen = String(r[idxNama] || r[14] || "").trim().toLowerCase();
        
        let isStatInProgress = (rStat === "in progress");
        let isAgentMatch = (idAgen && rIdAgen === idAgen) || (rNamaAgen === nama.toLowerCase());
        
        if (isStatInProgress && isAgentMatch) {
            matchingAreas.push(r);
        }
    });

    if (matchingAreas.length === 0) {
        areaSelect.innerHTML = '<option value="">-- Tidak ada KPI In Progress --</option>';
        areaSelect.disabled = true;
        areaSelect.classList.add('bg-gray-100', 'cursor-not-allowed');
        subfields.classList.add('hidden');
        if (!isEditMode) {
            showToast("⚠️ Tidak ada KPI dengan status 'In Progress' untuk agen ini. Silakan buat KPI baru terlebih dahulu!");
        }
        return;
    }

    // Urutkan matchingAreas secara alfabetis (A-Z) berdasarkan NAMA Akun (Kolom B / Index 1)
    let idxAkun = getColIndex(hArea, "Akun") > -1 ? getColIndex(hArea, "Akun") : (getColIndex(hArea, "Nama Akun") > -1 ? getColIndex(hArea, "Nama Akun") : 1);
    matchingAreas.sort((a, b) => {
        let akunA = String(a[idxAkun] || a[1] || "").trim();
        let akunB = String(b[idxAkun] || b[1] || "").trim();
        let compAkun = akunA.localeCompare(akunB, undefined, { sensitivity: 'base', numeric: true });
        if (compAkun !== 0) return compAkun;

        let goalA = String(a[idxGoal] || a[3] || "").trim();
        let goalB = String(b[idxGoal] || b[3] || "").trim();
        return goalA.localeCompare(goalB, undefined, { sensitivity: 'base', numeric: true });
    });

    // Isi dropdown Kolom C
    let optHtml = '<option value="">-- Pilih KPI / Area --</option>';
    matchingAreas.forEach(r => {
        let idA = String(r[0] || "").trim();
        let goal = String(r[idxGoal] || r[3] || "").trim();
        let areaName = String(r[idxArea] || r[2] || "").trim();
        let akunName = String(r[idxAkun] || r[1] || "").trim();
        let mainTitle = goal ? goal : areaName;
        let label = akunName ? `[${akunName}] ${mainTitle} (${idA})` : `${mainTitle} (${idA})`;
        optHtml += `<option value="${idA}">${label}</option>`;
    });
    areaSelect.innerHTML = optHtml;
    areaSelect.disabled = false;
    areaSelect.classList.remove('bg-gray-100', 'cursor-not-allowed');

    if (!isEditMode) {
        subfields.classList.add('hidden');
    }
}

// Helper: Populate Dropdown Costumer dari Sheet Networking berbasis Akun (Kolom A)
let currentTicketCustomerList = []; // Cache lokal kontak per akun untuk pencarian super cepat

// Toggle & Close Custom Dropdown Panel Task Costumer
function toggleTicketCustomerPanel(e) {
    if (e) e.stopPropagation();
    const panel = document.getElementById('tk-costumer-panel');
    const searchEl = document.getElementById('tk-costumer-search');
    if (!panel) return;

    if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        if (searchEl) {
            setTimeout(() => searchEl.focus(), 50);
        }
    } else {
        panel.classList.add('hidden');
    }
}

function closeTicketCustomerPanel() {
    const panel = document.getElementById('tk-costumer-panel');
    if (panel) panel.classList.add('hidden');
}

// Global Listener untuk menutup panel jika klik di luar
document.addEventListener('click', (e) => {
    const wrapper = document.getElementById('tk-costumer-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
        closeTicketCustomerPanel();
    }
});

function populateTicketCustomerOptions(selectedW = '', selectedX = '') {
    const selectEl = document.getElementById('tk-costumer-select');
    const inputW = document.getElementById('tk-col-w');
    const inputX = document.getElementById('tk-col-x');
    const searchEl = document.getElementById('tk-costumer-search');

    if (searchEl) searchEl.value = ''; // Reset input pencarian saat data di-populate ulang

    if (!selectEl) return;

    let targetW = selectedW || (inputW ? inputW.value : '');
    let targetX = selectedX || (inputX ? inputX.value : '');

    let akun = (document.getElementById('tk-akun')?.value || '').trim();
    let netData = window.allData || (typeof allData !== 'undefined' ? allData : []);

    let filtered = [];
    if (akun && Array.isArray(netData)) {
        filtered = netData.filter(r => r && Array.isArray(r) && String(r[0] || '').trim().toLowerCase() === akun.toLowerCase());
    }

    currentTicketCustomerList = []; // Reset cache kontak aktif

    filtered.forEach(r => {
        let idNet = String(r[1] || '').trim(); // Kolom B ID Networking / ID Costumer
        let namaCostumer = String(r[7] || r[8] || '').trim(); // Kolom H (Nama) / Kolom I (Nama Lengkap)
        let rawWa = String(r[5] || r[3] || '').trim(); // Kolom F / D
        let waClean = rawWa ? rawWa.split('@')[0].split('.')[0].replace(/\D/g, '') : (idNet ? idNet.split('@')[0].split('.')[0].replace(/\D/g, '') : '');
        let akunRow = String(r[0] || '').trim();

        let label = `${namaCostumer || waClean || idNet}${waClean ? ' ' + waClean : ''}${akunRow ? ' (' + akunRow + ')' : ''}`;

        currentTicketCustomerList.push({
            idNet: idNet,
            namaCostumer: namaCostumer,
            waClean: waClean,
            akunRow: akunRow,
            label: label
        });
    });

    renderTicketCustomerSelectOptions(targetW, targetX);
}

// Render Opsi Dropdown ke DOM dengan Filter Pencarian
function renderTicketCustomerSelectOptions(targetW = '', targetX = '', searchQuery = '') {
    const selectEl = document.getElementById('tk-costumer-select');
    const listEl = document.getElementById('tk-costumer-list');
    const displayTextEl = document.getElementById('tk-costumer-display-text');
    if (!selectEl) return;

    let q = searchQuery.toLowerCase().trim();
    let optHtml = '<option value="">-- Pilih Costumer (Opsional) --</option>';
    let listHtml = `<div onclick="selectTicketCustomerItem('', '', '')" class="p-2.5 text-xs text-gray-400 italic hover:bg-blue-50 cursor-pointer transition-colors">-- Pilih Costumer (Opsional) --</div>`;
    let foundMatched = false;
    let selectedLabelText = '-- Pilih Costumer (Opsional) --';

    let listToRender = currentTicketCustomerList;
    if (q) {
        listToRender = currentTicketCustomerList.filter(item => 
            item.namaCostumer.toLowerCase().includes(q) || 
            item.waClean.includes(q) || 
            item.idNet.toLowerCase().includes(q) ||
            item.label.toLowerCase().includes(q)
        );
    }

    listToRender.forEach(item => {
        let isSelected = false;
        if (targetW && item.idNet === targetW) {
            isSelected = true;
            foundMatched = true;
            selectedLabelText = item.label;
        } else if (!targetW && targetX && item.namaCostumer.toLowerCase() === targetX.toLowerCase()) {
            isSelected = true;
            foundMatched = true;
            selectedLabelText = item.label;
        }

        let escapedNama = (item.namaCostumer || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

        optHtml += `<option value="${item.idNet}" data-nama="${escapedNama}" data-wa="${item.waClean}" ${isSelected ? 'selected' : ''}>${item.label}</option>`;

        listHtml += `
            <div onclick="selectTicketCustomerItem('${item.idNet}', '${escapedNama}', '${item.waClean}')" class="p-2.5 text-xs font-medium text-gray-800 hover:bg-blue-50 hover:text-blue-600 cursor-pointer flex items-center justify-between transition-colors ${isSelected ? 'bg-blue-50 text-blue-600 font-bold' : ''}">
                <span class="truncate">${item.label}</span>
                ${item.waClean ? `<span class="text-[10px] text-gray-400 font-mono ml-2 shrink-0">${item.waClean}</span>` : ''}
            </div>
        `;
    });

    // Fallback jika data existing (targetW/targetX) ada tapi tidak ditemukan pada list filter
    if ((targetW || targetX) && !foundMatched && !q) {
        let fallbackLabel = `${targetX || targetW}${targetW ? ' (' + targetW + ')' : ''}`;
        let escapedX = (targetX || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        optHtml += `<option value="${targetW}" data-nama="${escapedX}" data-wa="" selected>${fallbackLabel}</option>`;
        listHtml += `
            <div onclick="selectTicketCustomerItem('${targetW}', '${escapedX}', '')" class="p-2.5 text-xs font-bold text-blue-600 bg-blue-50 cursor-pointer flex items-center justify-between transition-colors">
                <span class="truncate">${fallbackLabel}</span>
            </div>
        `;
        selectedLabelText = fallbackLabel;
    }

    selectEl.innerHTML = optHtml;
    if (listEl) listEl.innerHTML = listHtml;

    if (displayTextEl) {
        if (selectedLabelText && selectedLabelText !== '-- Pilih Costumer (Opsional) --') {
            displayTextEl.innerText = selectedLabelText;
            displayTextEl.className = "truncate text-gray-800 font-bold";
        } else {
            displayTextEl.innerText = "-- Pilih Costumer (Opsional) --";
            displayTextEl.className = "truncate text-gray-400 font-normal";
        }
    }

    onTicketCustomerChange();
}

// Fungsi eksekusi saat item dipilh di custom panel
function selectTicketCustomerItem(valW, valX, wa) {
    const inputW = document.getElementById('tk-col-w');
    const inputX = document.getElementById('tk-col-x');
    const selectEl = document.getElementById('tk-costumer-select');

    if (inputW) inputW.value = valW;
    if (inputX) inputX.value = valX;
    if (selectEl) selectEl.value = valW;

    renderTicketCustomerSelectOptions(valW, valX);
    closeTicketCustomerPanel();
}

// Fungsi pencarian instan saat user mengetik di kotak #tk-costumer-search
function filterTicketCustomerDropdown(query) {
    let currentW = document.getElementById('tk-col-w')?.value || '';
    let currentX = document.getElementById('tk-col-x')?.value || '';
    renderTicketCustomerSelectOptions(currentW, currentX, query);
}
