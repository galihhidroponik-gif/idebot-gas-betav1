});

// =========================================================================
// ENGINE LOGIC: AUTO TASK GENERATOR UNTUK KPI BERULANG
// =========================================================================
function getMissingAutoTaskInfo(kpiId, areaRow) {
    // Hitung jumlah task unfinished (<> Done) untuk KPI ini terlebih dahulu
    let unfinishedTaskCount = 0;
    if (kpiId && ticketDataCache && ticketDataCache.length > 1) {
        const hTicket = ticketDataCache[0] || [];
        let idxC = getColIndex(hTicket, "ID Area") > -1 ? getColIndex(hTicket, "ID Area") : 2;
        let idxStatus = getColIndex(hTicket, "Status") > -1 ? getColIndex(hTicket, "Status") : (getColIndex(hTicket, "Priority") > -1 ? getColIndex(hTicket, "Priority") : 8);
        let idxK = getColIndex(hTicket, "Prog Task") > -1 ? getColIndex(hTicket, "Prog Task") : 10;

        ticketDataCache.slice(1).forEach(tRow => {
            let rowAreaId = String(tRow[idxC] !== undefined ? tRow[idxC] : (tRow[2] || "")).trim();
            if (rowAreaId === String(kpiId).trim()) {
                let rawStat = String(tRow[idxStatus] !== undefined ? tRow[idxStatus] : (tRow[8] || tRow[17] || "")).trim().toLowerCase();
                let rawProg = String(tRow[idxK] !== undefined ? tRow[idxK] : (tRow[10] || "")).trim();
                if (rawStat !== "done" && rawProg !== "100%") {
                    unfinishedTaskCount++;
                }
            }
        });
    }

    if (!areaRow) return { count: 0, missingDates: [], unfinishedCount: unfinishedTaskCount };

    // 1. Syarat 1: Kolom R (Berulang) == True / "1" / "ya"
    let rawR = String(areaRow[17] || "").trim().toLowerCase();
    let isBerulang = (rawR === "true" || rawR === "1" || rawR === "ya" || rawR === "yes");
    if (!isBerulang) return { count: 0, missingDates: [], unfinishedCount: unfinishedTaskCount };

    // 2. Syarat 2: Kolom K (Deadline KPI) > Hari Ini
    let rawDeadline = areaRow[10];
    if (!rawDeadline) return { count: 0, missingDates: [], unfinishedCount: unfinishedTaskCount };
    
    let deadlineYmd = _parseDateForInput(rawDeadline);
    if (!deadlineYmd) return { count: 0, missingDates: [], unfinishedCount: unfinishedTaskCount };

    let today = new Date();
    today.setHours(0, 0, 0, 0);
    
    let parts = deadlineYmd.split('-');
    let dVal = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    if (isNaN(dVal.getTime()) || dVal < today) {
        return { count: 0, missingDates: [], unfinishedCount: unfinishedTaskCount };
    }

    // 3. Syarat 3 & 4: Day Loop (Kolom T) & Time Loop (Kolom U)
    let dayLoopStr = String(areaRow[19] || "").trim();
    if (!dayLoopStr) return { count: 0, missingDates: [], unfinishedCount: unfinishedTaskCount };

    let targetDays = dayLoopStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n >= 1 && n <= 7);
    if (targetDays.length === 0) return { count: 0, missingDates: [], unfinishedCount: unfinishedTaskCount };

    // 4. Hitung Tanggal Pekan Ini (Senin = Day 1 s/d Minggu = Day 7)
    let now = new Date();
    let jsDay = now.getDay(); // 0 = Sun, 1 = Mon ...
    let isoDay = (jsDay === 0) ? 7 : jsDay;
    
    let monday = new Date(now);
    monday.setDate(now.getDate() - (isoDay - 1));
    monday.setHours(0, 0, 0, 0);

    const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

    let targetDates = [];
    targetDays.forEach(dayNum => {
        let tDate = new Date(monday);
        tDate.setDate(monday.getDate() + (dayNum - 1));
        tDate.setHours(0, 0, 0, 0);

        // MODIFIKASI: Abaikan hari yang sudah lewat di pekan ini (Hanya simpan jika tDate >= today)
        if (tDate >= today) {
            let yyyy = tDate.getFullYear();
            let mm = String(tDate.getMonth() + 1).padStart(2, '0');
            let dd = String(tDate.getDate()).padStart(2, '0');
            let isoStr = `${yyyy}-${mm}-${dd}`;

            let dayFormatted = `${dd}-${monthNames[tDate.getMonth()]}`;
            targetDates.push({ dateStr: isoStr, formatted: dayFormatted });
        }
    });

    // 5. Cek Tanggal Task yang Sudah Ada di ticketDataCache
    let existingDatesSet = new Set();
    if (ticketDataCache && ticketDataCache.length > 1) {
        const hTicket = ticketDataCache[0] || [];
        let idxC = getColIndex(hTicket, "ID Area") > -1 ? getColIndex(hTicket, "ID Area") : 2;
        let idxP = getColIndex(hTicket, "Deadline") > -1 ? getColIndex(hTicket, "Deadline") : (getColIndex(hTicket, "Tgl Deadline") > -1 ? getColIndex(hTicket, "Tgl Deadline") : 15);

        ticketDataCache.slice(1).forEach(tRow => {
            let rowAreaId = String(tRow[idxC] !== undefined ? tRow[idxC] : (tRow[2] || "")).trim();
            if (rowAreaId === String(kpiId).trim()) {
                let rawP = tRow[idxP] !== undefined ? tRow[idxP] : tRow[15];
                let parsedP = _parseDateForInput(rawP);
                if (parsedP) existingDatesSet.add(parsedP);
            }
        });
    }

    let missing = targetDates.filter(td => !existingDatesSet.has(td.dateStr));
    return {
        count: missing.length,
        missingDates: missing,
        unfinishedCount: unfinishedTaskCount
    };
}

function generateAutoTasksForKpi(kpiId) {
    if (!areaDataCache || areaDataCache.length < 2) {
        showToast("⚠️ Data KPI tidak ditemukan.");
        return;
    }

    let areaRow = areaDataCache.slice(1).find(r => String(r[0] || "").trim() === String(kpiId).trim());
    if (!areaRow) {
        showToast("⚠️ Data KPI tidak ditemukan.");
        return;
    }

    let taskInfo = getMissingAutoTaskInfo(kpiId, areaRow);
    if (taskInfo.count === 0) {
        showToast("ℹ️ Seluruh task pekan ini sudah terbuat.");
        return;
    }

    showItemSpinner(kpiId, 'kpi', 'Membuat task...');

    // Data dari Sheet Area (KPI):
    let akunVal = String(areaRow[1] || "").trim(); // Kolom B Area
    let areaVal = String(areaRow[2] || "").trim(); // Kolom C Area (Nama Area)
    let goalVal = String(areaRow[3] || "").trim(); // Kolom D Area (Straight Goal)
    let autoKsVal = String(areaRow[16] || "").trim().toLowerCase(); // Kolom Q Area (Auto-KS)
    let isAutoKs = (autoKsVal === "true" || autoKsVal === "1" || autoKsVal === "ya");
    let timeLoopVal = String(areaRow[20] || "08:00").trim(); // Kolom U Area (Time Loop / Jam)
    let idAgenVal = String(areaRow[13] || "").trim(); // Kolom N Area (ID Agen)
    let namaAgenVal = String(areaRow[14] || "").trim(); // Kolom O Area (Nama Agen)

    let now = new Date();
    let yyyy = now.getFullYear();
    let mm = String(now.getMonth() + 1).padStart(2, '0');
    let dd = String(now.getDate()).padStart(2, '0');
    let todayStr = `${yyyy}-${mm}-${dd}`;

    let baseTime = now.getTime();
    let batchPayloads = [];

    taskInfo.missingDates.forEach((mDateObj, idx) => {
        let payloadArray = new Array(30).fill(null);
        
        let d = new Date(baseTime + (idx * 1000));
        let yy = String(d.getFullYear()).slice(-2);
        let m = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        let hh = String(d.getHours()).padStart(2, '0');
        let min = String(d.getMinutes()).padStart(2, '0');
        let sec = String(d.getSeconds()).padStart(2, '0');
        let taskId = yy + m + day + hh + min + sec;

        // PEMETAAN KOLOM TASK AUTOMATIC SPREADSHEET TICKET:
        // A (0): ID Task
        payloadArray[0] = taskId;
        // B (1): Akun
        payloadArray[1] = akunVal;
        // C (2): ID Area
        payloadArray[2] = String(kpiId).trim();
        // E (4): Area / Nama Area (Kolom C Sheet Area KPI)
        payloadArray[4] = areaVal;
        // G (6): Nama Project = Straight Goal KPI + " - " + dd-mmm
        payloadArray[6] = `${goalVal} - ${mDateObj.formatted}`;
        // H (7): Deskripsi = Kosong / tidak disentuh
        payloadArray[7] = "";
        // I (8): Priority = "In Progress"
        payloadArray[8] = "In Progress";
        // K (10): Progress = "1%"
        payloadArray[10] = "1%";
        // L (11): Tags = Kosong / tidak disentuh
        payloadArray[11] = "";
        // M (12): Kontribusi = 0.01 jika Auto-KS True, else 0
        payloadArray[12] = isAutoKs ? 0.01 : 0;
        // N (13): Tgl Dibuat
        payloadArray[13] = todayStr;
        // P (15): Tgl Deadline Target Pekan Ini
        payloadArray[15] = mDateObj.dateStr;
        // Q (16): Time / Jam (Kolom U Area)
        payloadArray[16] = timeLoopVal;
        // S (18): Tgl Selesai = Kosong
        payloadArray[18] = "";
        // T (19): ID Agen (Kolom N Area)
        payloadArray[19] = idAgenVal;
        // U (20): Nama Agen (Kolom O Area)
        payloadArray[20] = namaAgenVal;
        // Z (25): Update GTask = "False"
        payloadArray[25] = "False";

        batchPayloads.push({
            taskId: taskId,
            payload: payloadArray
        });
    });

    let completedCount = 0;
    let totalBatch = batchPayloads.length;

    function sendNext(idx) {
        if (idx >= totalBatch) {
            showToast(`✅ Berhasil membuat ${completedCount} task otomatis!`);
            refreshTaskKpiDataSilent(function() {
                hideItemSpinner(kpiId, 'kpi');
            });
            return;
        }

        let item = batchPayloads[idx];
        google.script.run
            .withSuccessHandler(function(res) {
                completedCount++;
                sendNext(idx + 1);
            })
            .withFailureHandler(function(err) {
                console.error("Gagal membuat auto task:", err);
                sendNext(idx + 1);
            })
            .updateAreaTicketNative(SHEET_URL, "Ticket", item.taskId, 1, item.payload);
    }

    sendNext(0);
}

function renderKpiTagChips() {
    const hiddenInput = document.getElementById('ar-tags');
    const container = document.getElementById('ar-tags-chips-container');
    if (!hiddenInput || !container) return;

    let rawVal = hiddenInput.value || "";
    let tagsArr = rawVal.split(',').map(s => s.trim()).filter(Boolean);

    if (tagsArr.length === 0) {
        container.innerHTML = `<span class="text-xs text-gray-400 italic">Belum ada tag...</span>`;
        return;
    }

    let chipsHtml = tagsArr.map((tag, idx) => `
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-yellow-100 text-yellow-900 border border-yellow-300 rounded-full text-xs font-bold shadow-2xs">
            <span>${tag}</span>
            <button type="button" onclick="removeKpiTag(${idx})" class="text-yellow-700 hover:text-red-600 hover:bg-yellow-200 rounded-full w-4 h-4 inline-flex items-center justify-center transition-colors cursor-pointer text-[10px]" title="Hapus tag ${tag}">
                ✕
            </button>
        </span>
    `).join('');

    container.innerHTML = chipsHtml;
}

function addKpiTagFromInput() {
    const textInput = document.getElementById('ar-tags-input');
    const hiddenInput = document.getElementById('ar-tags');
    if (!textInput || !hiddenInput) return;

    let newTag = textInput.value.trim();
    if (!newTag) return;

    let currentVal = hiddenInput.value || "";
    let tagsArr = currentVal.split(',').map(s => s.trim()).filter(Boolean);

    // Mencegah duplikasi tag yang sama (case-insensitive)
    let exists = tagsArr.some(t => t.toLowerCase() === newTag.toLowerCase());
    if (!exists) {
        tagsArr.push(newTag);
        hiddenInput.value = tagsArr.join(', ');
    }

    textInput.value = "";
    renderKpiTagChips();
}

function removeKpiTag(index) {
    const hiddenInput = document.getElementById('ar-tags');
    if (!hiddenInput) return;

    let currentVal = hiddenInput.value || "";
    let tagsArr = currentVal.split(',').map(s => s.trim()).filter(Boolean);

    if (index >= 0 && index < tagsArr.length) {
        tagsArr.splice(index, 1);
        hiddenInput.value = tagsArr.join(', ');
        renderKpiTagChips();
    }
}

function _getActiveTaskCountMap() {
    const map = {};
    if (typeof ticketDataCache === 'undefined' || !Array.isArray(ticketDataCache) || ticketDataCache.length <= 1) return map;

    const hTicket = ticketDataCache[0] || [];
    const tIdxW = (typeof getColIndex === 'function' && getColIndex(hTicket, "ID Costumer") > -1) ? getColIndex(hTicket, "ID Costumer") : ((typeof getColIndex === 'function' && getColIndex(hTicket, "ID Customer") > -1) ? getColIndex(hTicket, "ID Customer") : 22);
    const tIdxStatus = (typeof getColIndex === 'function' && getColIndex(hTicket, "Status Task") > -1) ? getColIndex(hTicket, "Status Task") : ((typeof getColIndex === 'function' && getColIndex(hTicket, "Status") > -1) ? getColIndex(hTicket, "Status") : 8);
    const tIdxProg = (typeof getColIndex === 'function' && getColIndex(hTicket, "Prog Task") > -1) ? getColIndex(hTicket, "Prog Task") : 10;

    ticketDataCache.slice(1).forEach(row => {
        let valW = String(row[tIdxW] !== undefined ? row[tIdxW] : (row[22] || "")).trim();
        if (valW) {
            let statRaw = String(row[tIdxStatus] !== undefined ? row[tIdxStatus] : (row[8] || "Plan")).trim().toLowerCase();
            let rawProg = row[tIdxProg] !== undefined ? row[tIdxProg] : row[10];
            let progVal = 0;
            if (rawProg !== undefined && rawProg !== null && rawProg !== "") {
                let pStr = String(rawProg).replace(',', '.').replace('%', '').trim();
                let num = parseFloat(pStr);
                if (!isNaN(num)) {
                    if (num > 0 && num <= 1 && !String(rawProg).includes('%')) num = num * 100;
                    progVal = Math.min(100, Math.max(0, Math.round(num)));
                }
            }
            let isDone = statRaw.includes('done') || statRaw === 'lunas' || statRaw === 'selesai' || progVal >= 100;
            if (!isDone) {
                let cleanWaW = valW.includes('@g.us') ? valW.split('@g.us')[0] : valW.split('.')[0].replace(/\D/g, '');
                map[valW] = (map[valW] || 0) + 1;
                if (cleanWaW && cleanWaW !== valW) {
                    map[cleanWaW] = (map[cleanWaW] || 0) + 1;
                }
            }
        }
    });
    return map;
}

function _getActiveTasksForCurrentContact() {
    if (typeof currentContactId === 'undefined' || !currentContactId) return [];
    if (typeof ticketDataCache === 'undefined' || !Array.isArray(ticketDataCache) || ticketDataCache.length <= 1) return [];

    const hTicket = ticketDataCache[0] || [];
    const tIdxW = (typeof getColIndex === 'function' && getColIndex(hTicket, "ID Costumer") > -1) ? getColIndex(hTicket, "ID Costumer") : ((typeof getColIndex === 'function' && getColIndex(hTicket, "ID Customer") > -1) ? getColIndex(hTicket, "ID Customer") : 22);
    const tIdxStatus = (typeof getColIndex === 'function' && getColIndex(hTicket, "Status Task") > -1) ? getColIndex(hTicket, "Status Task") : ((typeof getColIndex === 'function' && getColIndex(hTicket, "Status") > -1) ? getColIndex(hTicket, "Status") : 8);
    const tIdxProg = (typeof getColIndex === 'function' && getColIndex(hTicket, "Prog Task") > -1) ? getColIndex(hTicket, "Prog Task") : 10;
    const tIdxProj = (typeof getColIndex === 'function' && getColIndex(hTicket, "Project") > -1) ? getColIndex(hTicket, "Project") : 6;
    const tIdxDeadline = (typeof getColIndex === 'function' && getColIndex(hTicket, "Deadline") > -1) ? getColIndex(hTicket, "Deadline") : 15;
    const tIdxAgen = (typeof getColIndex === 'function' && getColIndex(hTicket, "Nama Agen") > -1) ? getColIndex(hTicket, "Nama Agen") : 20;

    const monthShort = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    const targetId = String(currentContactId).trim();
    const cleanTargetWa = targetId.includes('@g.us') ? targetId.split('@g.us')[0] : targetId.split('.')[0].replace(/\D/g, '');
    const results = [];

    ticketDataCache.slice(1).forEach(row => {
        let valW = String(row[tIdxW] !== undefined ? row[tIdxW] : (row[22] || "")).trim();
        let cleanValW = valW.includes('@g.us') ? valW.split('@g.us')[0] : valW.split('.')[0].replace(/\D/g, '');

        let isMatch = (valW && valW === targetId) || (cleanTargetWa && cleanValW && cleanValW === cleanTargetWa);

        if (isMatch) {
            let statRaw = String(row[tIdxStatus] !== undefined ? row[tIdxStatus] : (row[8] || "Plan")).trim().toLowerCase();
            let rawProg = row[tIdxProg] !== undefined ? row[tIdxProg] : row[10];
            let progVal = 0;
            if (rawProg !== undefined && rawProg !== null && rawProg !== "") {
                let pStr = String(rawProg).replace(',', '.').replace('%', '').trim();
                let num = parseFloat(pStr);
                if (!isNaN(num)) {
                    if (num > 0 && num <= 1 && !String(rawProg).includes('%')) num = num * 100;
                    progVal = Math.min(100, Math.max(0, Math.round(num)));
                }
            }
            let isDone = statRaw.includes('done') || statRaw === 'lunas' || statRaw === 'selesai' || progVal >= 100;
            if (!isDone) {
                let rawDeadline = row[tIdxDeadline] !== undefined ? row[tIdxDeadline] : (row[15] || "");
                let deadlineTs = -Infinity;
                let deadlineLabel = "-";

                if (rawDeadline && String(rawDeadline).trim() !== "" && String(rawDeadline).trim() !== "-") {
                    let parsedIso = (typeof _parseDateForInput === 'function') ? _parseDateForInput(rawDeadline) : "";
                    let dObj = parsedIso ? new Date(parsedIso + "T00:00:00") : new Date(rawDeadline);
                    if (!isNaN(dObj.getTime())) {
                        deadlineTs = dObj.getTime();
                        let yy = String(dObj.getFullYear()).slice(-2);
                        let mmm = monthShort[dObj.getMonth()] || String(dObj.getMonth() + 1).padStart(2, '0');
                        let dd = String(dObj.getDate()).padStart(2, '0');
                        deadlineLabel = `${yy}-${mmm}-${dd}`;
                    } else {
                        deadlineLabel = String(rawDeadline).trim();
                    }
                }

                results.push({
                    id: String(row[0] || "").trim(),
                    prog: progVal,
                    project: String(row[tIdxProj] !== undefined ? row[tIdxProj] : (row[6] || "(Tanpa Nama Project)")).trim(),
                    deadlineLabel: deadlineLabel,
                    deadlineTs: deadlineTs,
                    agen: String(row[tIdxAgen] !== undefined ? row[tIdxAgen] : (row[20] || "-")).trim() || "-"
                });
            }
        }
    });

    // Urutkan berdasarkan Kolom P (Deadline) Z-A (terbaru/terbesar di atas, tanpa deadline di bawah)
    results.sort((a, b) => b.deadlineTs - a.deadlineTs);
    return results;
}

function updateCustomerTaskBadge() {
    const badgeBtn = document.getElementById('btn-chat-task-badge');
    const badgeText = document.getElementById('chat-task-badge-text');
    const addBtn = document.getElementById('btn-quick-add-task');

    if (typeof currentContactId === 'undefined' || !currentContactId) {
        if (badgeBtn) { badgeBtn.classList.add('hidden'); badgeBtn.classList.remove('flex'); }
        if (addBtn) { addBtn.classList.add('hidden'); addBtn.classList.remove('flex'); }
        return;
    }

    // Jika ticketDataCache masih kosong, pancing penarikan data secara silent
    if ((typeof ticketDataCache === 'undefined' || !ticketDataCache || ticketDataCache.length <= 1) && !window.isFetchingTicketDataSilent) {
        window.isFetchingTicketDataSilent = true;
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(res) {
                    window.isFetchingTicketDataSilent = false;
                    if (res && res.status === "success") {
                        ticketDataCache = res.ticket || [];
                        areaDataCache = res.area || [];
                        updateCustomerTaskBadge();
                        if (typeof renderSidebar === 'function') renderSidebar();
                    }
                })
                .withFailureHandler(function() {
                    window.isFetchingTicketDataSilent = false;
                })
                .getAreaTicketDataNative(SHEET_URL, (typeof userAllowedAccounts !== 'undefined' ? userAllowedAccounts : []).join(','));
        }
    }

    const activeTasks = _getActiveTasksForCurrentContact();
    const activeCount = activeTasks.length;

    // Cek apakah ada task yang sedang dalam proses simpan/hapus untuk kontak aktif ini
    const pendingIds = window.pendingSavingTaskIds || new Set();
    const pendingMeta = window.pendingSavingTaskMeta || {};

    let hasPendingForContact = false;
    let pendingMsg = 'Menyimpan...';
    pendingIds.forEach(pid => {
        const meta = pendingMeta[pid];
        if ((meta && meta.contactId === String(currentContactId)) || activeTasks.some(t => String(t.id) === pid)) {
            hasPendingForContact = true;
            if (meta && meta.message) pendingMsg = meta.message;
        }
    });

    if (badgeBtn) {
        const emojiSpan = badgeBtn.querySelector('span:first-child');
        const oldSpinner = badgeBtn.querySelector('.chat-task-badge-spinner');
        if (hasPendingForContact) {
            if (emojiSpan && !emojiSpan.classList.contains('chat-task-badge-spinner')) {
                emojiSpan.classList.add('hidden');
            }
            if (!oldSpinner) {
                const sp = document.createElement('span');
                sp.className = 'chat-task-badge-spinner spinner-small';
                sp.style.cssText = 'width:11px;height:11px;border-width:1.5px;border-color:rgba(67,56,202,0.25);border-top-color:#4338ca;flex-shrink:0;';
                badgeBtn.insertBefore(sp, badgeBtn.firstChild);
            }
            badgeBtn.classList.add('animate-pulse');
        } else {
            if (oldSpinner) oldSpinner.remove();
            if (emojiSpan) emojiSpan.classList.remove('hidden');
            badgeBtn.classList.remove('animate-pulse');
        }
    }

    if (hasPendingForContact) {
        if (addBtn) { addBtn.classList.add('hidden'); addBtn.classList.remove('flex'); }
        if (badgeBtn && badgeText) {
            badgeText.innerText = activeCount > 0 ? `${activeCount} Task • ${pendingMsg}` : pendingMsg;
            badgeBtn.title = `Sedang memproses task...`;
            badgeBtn.classList.remove('hidden');
            badgeBtn.classList.add('flex');
        }
    } else if (activeCount === 0) {
        // Task 0: Hanya tampilkan tombol + Task
        if (badgeBtn) { badgeBtn.classList.add('hidden'); badgeBtn.classList.remove('flex'); }
        if (addBtn) { addBtn.classList.remove('hidden'); addBtn.classList.add('flex'); }
    } else {
        // Task >= 1: Tampilkan badge X Task (klik buka daftar), sembunyikan + Task di header
        if (addBtn) { addBtn.classList.add('hidden'); addBtn.classList.remove('flex'); }
        if (badgeBtn && badgeText) {
            badgeText.innerText = `${activeCount} Task`;
            badgeBtn.title = `Konsumen ini memiliki ${activeCount} task aktif. Klik untuk melihat daftar.`;
            badgeBtn.classList.remove('hidden');
            badgeBtn.classList.add('flex');
        }
    }
}

function openCustomerTaskListPopup() {
    if (typeof currentContactId === 'undefined' || !currentContactId) {
        if (typeof showToast === 'function') showToast("⚠️ Silakan pilih kontak terlebih dahulu.");
        return;
    }

    const modal = document.getElementById('customer-task-list-modal');
    const subtitleEl = document.getElementById('customer-task-list-subtitle');
    const bodyEl = document.getElementById('customer-task-list-body');
    if (!modal || !bodyEl) return;

    let cRow = (typeof allData !== 'undefined' && Array.isArray(allData)) ? allData.find(r => r[1] === currentContactId) : null;
    let contactName = cRow ? String(cRow[7] || cRow[8] || currentContactId).trim() : currentContactId;
    if (subtitleEl) subtitleEl.innerText = contactName;

    const tasks = _getActiveTasksForCurrentContact();
    const pendingIds = window.pendingSavingTaskIds || new Set();
    const pendingMeta = window.pendingSavingTaskMeta || {};


    // Kumpulkan task baru yang sedang disimpan dan belum masuk ke ticketDataCache
    const pendingNewCards = [];
    pendingIds.forEach(pid => {
        const meta = pendingMeta[pid];
        if (meta && meta.isNew && meta.contactId === String(currentContactId) && !tasks.some(t => String(t.id) === pid)) {
            let safeNewProj = (typeof escapeHtmlAttr === 'function') ? escapeHtmlAttr(meta.project || 'Task Baru') : (meta.project || 'Task Baru');
            let msg = (typeof escapeHtmlAttr === 'function') ? escapeHtmlAttr(meta.message || 'Menyimpan...') : (meta.message || 'Menyimpan...');
            pendingNewCards.push(`
                <div class="relative overflow-hidden p-2.5 bg-blue-50/70 border border-blue-200 rounded-xl flex items-start gap-2.5 shadow-sm">
                    <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-lg bg-blue-100 text-blue-700 border border-blue-200 shrink-0 mt-0.5">NEW</span>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-bold text-gray-800 leading-snug break-words">${safeNewProj}</div>
                        <div class="text-[10px] text-blue-600 mt-1 font-medium">Menambahkan task baru...</div>
                    </div>
                    <div class="item-saving-spinner-overlay absolute inset-0 bg-white/85 backdrop-blur-[1px] rounded-xl z-20 flex items-center justify-center gap-2 text-xs font-bold text-blue-600">
                        <div class="spinner-small border-blue-600"></div><span>${msg}</span>
                    </div>
                </div>
            `);
        }
    });

    if (tasks.length === 0 && pendingNewCards.length === 0) {
        bodyEl.innerHTML = `<div class="text-center text-xs text-gray-400 italic py-6">Tidak ada task aktif untuk konsumen ini.</div>`;
    } else {
        const existingCards = tasks.map(t => {
            let safeId = (typeof escapeHtmlAttr === 'function') ? escapeHtmlAttr(t.id) : t.id.replace(/'/g, "\\'");
            let safeProj = (typeof escapeHtmlAttr === 'function') ? escapeHtmlAttr(t.project) : t.project;
            let safeAgen = (typeof escapeHtmlAttr === 'function') ? escapeHtmlAttr(t.agen) : t.agen;
            let safeDeadline = (typeof escapeHtmlAttr === 'function') ? escapeHtmlAttr(t.deadlineLabel) : t.deadlineLabel;

            const isPending = pendingIds.has(String(t.id));
            const meta = pendingMeta[String(t.id)];
            const pendingMsg = (meta && meta.message) ? meta.message : 'Menyimpan...';
            const overlayHtml = isPending
                ? `<div class="item-saving-spinner-overlay absolute inset-0 bg-white/85 backdrop-blur-[1px] rounded-xl z-20 flex items-center justify-center gap-2 text-xs font-bold text-blue-600"><div class="spinner-small border-blue-600"></div><span>${pendingMsg}</span></div>`
                : '';
            const clickAttr = isPending
                ? ''
                : `onclick="closeCustomerTaskListPopup(); if(typeof openTicketForm === 'function') openTicketForm('${safeId}');"`;

            return `
                <div ${clickAttr} class="relative overflow-hidden p-2.5 bg-gray-50 ${isPending ? 'cursor-wait' : 'hover:bg-indigo-50/70 cursor-pointer'} border border-gray-200 hover:border-indigo-300 rounded-xl transition-all flex items-start gap-2.5 shadow-sm">
                    <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-lg bg-indigo-100 text-indigo-700 border border-indigo-200 shrink-0 mt-0.5">${t.prog}%</span>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-bold text-gray-800 leading-snug break-words">${safeProj}</div>
                        <div class="text-[10px] text-gray-500 mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                            <span class="font-semibold text-amber-700">📅 ${safeDeadline}</span>
                            <span class="text-gray-600 font-medium">[${safeAgen}]</span>
                        </div>
                    </div>
                    ${overlayHtml}
                </div>
            `;
        }).join('');

        bodyEl.innerHTML = pendingNewCards.join('') + existingCards;
    }

    modal.classList.remove('hidden');
}

function closeCustomerTaskListPopup() {
    const modal = document.getElementById('customer-task-list-modal');
    if (modal) modal.classList.add('hidden');
}

function openTaskForCurrentContact() {
    if (typeof currentContactId === 'undefined' || !currentContactId) {
        if (typeof showToast === 'function') showToast("⚠️ Silakan pilih kontak terlebih dahulu.");
        return;
    }

    let cRow = (typeof allData !== 'undefined' && Array.isArray(allData)) ? allData.find(r => r[1] === currentContactId) : null;
    let contactName = cRow ? String(cRow[7] || cRow[8] || "").trim() : "";
    let contactAkun = cRow ? String(cRow[0] || "").trim() : "";

    if (typeof openTicketForm === 'function') {
        openTicketForm('NEW');
    }

    if (contactAkun) {
        let akunEl = document.getElementById('tk-akun');
        if (akunEl) {
            akunEl.value = contactAkun;
        }
    }

    if (document.getElementById('tk-col-w')) document.getElementById('tk-col-w').value = currentContactId;
    if (document.getElementById('tk-col-x')) document.getElementById('tk-col-x').value = contactName;

    if (typeof populateTicketCustomerOptions === 'function') {
        populateTicketCustomerOptions(currentContactId, contactName);
    }
}
</script>
