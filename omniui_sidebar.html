<script>
    // Sync Input Pencarian antara Desktop & Mobile dengan Debounce (250ms)
    let searchDebounceTimer = null;
    function syncSearchInput(el) {
        const val = el.value;
        const inputs = document.querySelectorAll('#search-input, #search-input-desktop');
        inputs.forEach(i => { if(i !== el) i.value = val; });
        if(typeof handleSearch === 'function') {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                handleSearch();
            }, 250);
        }
    }

    function handleDeviceChangeCustom(val) {
        document.querySelectorAll('.device-select-elem').forEach(s => s.value = val);
        if(typeof handleDeviceChange === 'function') handleDeviceChange();
    }

    function handleLabelChangeCustom(val) {
        document.querySelectorAll('.label-select-elem').forEach(s => s.value = val);
        if(typeof handleLabelChange === 'function') handleLabelChange();
    }

    function handleBelumBalasFilterChangeCustom(checked) {
        document.querySelectorAll('.belum-balas-filter-elem').forEach(c => c.checked = checked);
        if(typeof handleBelumBalasFilterChange === 'function') handleBelumBalasFilterChange();
    }

    function handleUnsubFilterChangeCustom(checked) {
        document.querySelectorAll('.unsub-filter-elem').forEach(c => c.checked = checked);
        if(typeof handleUnsubFilterChange === 'function') handleUnsubFilterChange();
    }

    function handleNextSendFuFilterChangeCustom(checked) {
        document.querySelectorAll('.next-send-fu-filter-elem').forEach(c => c.checked = checked);
        if(typeof handleNextSendFuFilterChange === 'function') handleNextSendFuFilterChange();
    }

    function handleTaskActiveFilterChangeCustom(checked) {
        document.querySelectorAll('.task-active-filter-elem').forEach(c => c.checked = checked);
        if(typeof handleTaskActiveFilterChange === 'function') handleTaskActiveFilterChange();
    }

    function handleUnreadFilterChangeCustom(checked) {
        document.querySelectorAll('.unread-filter-elem').forEach(c => c.checked = checked);
        if(typeof handleUnreadFilterChange === 'function') handleUnreadFilterChange();
    }

    // Observer otomatis dengan Guard Flag untuk mencegah Loop Re-entrancy
    let isObserverRunning = false;
    const syncStatusObs = new MutationObserver(() => {
        if (isObserverRunning) return;
        isObserverRunning = true;
        try {
            const mainStatus = document.getElementById('sync-status');
            if (mainStatus) {
                const text = mainStatus.innerText;
                document.querySelectorAll('.sync-status-elem').forEach(el => {
                    if (el !== mainStatus && el.innerText !== text) el.innerText = text;
                });
            }
            const tokenDisplay = document.getElementById('ai-token-display');
            if (tokenDisplay) {
                const text = tokenDisplay.innerText;
                const tokenDesktop = document.getElementById('ai-token-display-desktop');
                if (tokenDesktop && tokenDesktop.innerText !== text) tokenDesktop.innerText = text;
            }
            const notifBadge = document.getElementById('notif-badge');
            if (notifBadge) {
                const text = notifBadge.innerText;
                const isHidden = notifBadge.classList.contains('hidden');
                const badgeDesktop = document.getElementById('notif-badge-desktop');
                if (badgeDesktop) {
                    if (badgeDesktop.innerText !== text) badgeDesktop.innerText = text;
                    if (isHidden && !badgeDesktop.classList.contains('hidden')) badgeDesktop.classList.add('hidden');
                    else if (!isHidden && badgeDesktop.classList.contains('hidden')) badgeDesktop.classList.remove('hidden');
                }
            }
            const notifList = document.getElementById('notif-list');
            if (notifList) {
                const html = notifList.innerHTML;
                document.querySelectorAll('.notif-list-container').forEach(el => {
                    if (el !== notifList && el.innerHTML !== html) el.innerHTML = html;
                });
            }
        } finally {
            isObserverRunning = false;
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const target = document.getElementById('sync-status');
        if (target) syncStatusObs.observe(target, { childList: true, characterData: true, subtree: true });
        const token = document.getElementById('ai-token-display');
        if (token) syncStatusObs.observe(token, { childList: true, characterData: true, subtree: true });
        const badge = document.getElementById('notif-badge');
        if (badge) syncStatusObs.observe(badge, { childList: true, characterData: true, subtree: true, attributes: true });
        const nList = document.getElementById('notif-list');
        if (nList) syncStatusObs.observe(nList, { childList: true, characterData: true, subtree: true });
    });
</script>
